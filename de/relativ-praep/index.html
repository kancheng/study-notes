<div class="intro">
<h1>德文 B2｜介系詞關係子句</h1>
<p>介系詞放在關係代名詞前面，格由那個介系詞決定。指整件事或不特定的事物時，用 wo(r)-。</p>
<div class="toolbar">
<a class="download" href="./relativ-praep.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的德語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>人用介系詞加關係代名詞：der Kollege, mit dem ich arbeite。<br>整件事用 worüber、wofür、womit。元音開頭的介系詞加 r：worüber，不是 woüber。</div>

<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "人", "meaning": "介系詞 + 關係代名詞", "rows": [["住在", "die Wohnung, in der ...", "我住的那間公寓"], ["一起工作", "der Kollege, mit dem ...", "和我一起工作的同事"], ["等待", "die Frau, auf die ...", "我等待的那個女人"], ["複數", "die Freunde, mit denen ...", "和我一起的那些朋友"]], "examples": [["Die Wohnung, in der ich wohne, ist klein.", "我住的那間公寓很小。"], ["Der Kollege, mit dem ich arbeite, ist geduldig.", "和我一起工作的同事很有耐心。"], ["Die Frau, auf die ich warte, kommt gleich.", "我等待的那個女人馬上到。"], ["Die Freunde, mit denen ich lerne, wohnen in Taipei.", "和我一起學習的朋友住在台北。"]]}, {"name": "事物", "meaning": "介系詞可以留在關係代名詞前", "rows": [["談論", "das Thema, über das ...", "我們談論的題目"], ["用", "der Stift, mit dem ...", "我用來寫的筆"], ["在……裡", "die Stadt, in der ...", "我出生的城市"], ["格", "由介系詞決定", "über + 受格，mit + 與格"]], "examples": [["Das Thema, über das wir sprechen, ist schwierig.", "我們談論的題目很難。"], ["Der Stift, mit dem ich schreibe, ist neu.", "我用來寫字的筆是新的。"], ["Taipei ist die Stadt, in der ich geboren bin.", "台北是我出生的城市。"], ["Das Problem, an das ich denke, ist die Zeit.", "我想到的問題是時間。"]]}, {"name": "worüber", "meaning": "整件事，或不特定的物", "rows": [["關於", "worüber", "關於那件事"], ["為了", "wofür", "為了什麼"], ["用", "womit", "用什麼"], ["想到", "woran", "想到什麼"]], "examples": [["Das ist etwas, worüber ich nachdenken muss.", "那是我必須想想的事。"], ["Weißt du, wofür dieses Wort steht?", "你知道這個詞代表什麼嗎？"], ["Sie erklärt, womit man anfangen soll.", "她說明應該從什麼開始。"], ["Das, woran er denkt, sagt er nicht.", "他在想什麼，他沒說。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="de">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="de">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放德語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('de'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
