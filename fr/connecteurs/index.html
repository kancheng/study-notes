<div class="intro">
<h1>法文 B1｜連接詞</h1>
<p>把句子接起來時，alors 和 donc 偏口語的結果，cependant 和 pourtant 表示轉折。敘事可以用 d’abord、ensuite、enfin。</p>
<div class="toolbar">
<a class="download" href="./connecteurs.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的法語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>pourtant 常帶一點出乎意料。cependant 較中性，書面也常用。<br>mais 仍然是最直接的「但是」。</div>
<nav class="pager"><a href="../opinion/">← Opinion</a><a href="../subjonctif-b2/">Subjonctif passé →</a></nav>
</main>
<footer>Connecteurs · 法文 B1</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "結果", "meaning": "alors、donc", "rows": [["那麼留下", "alors nous restons", "那麼我們留下"], ["所以成功", "donc j’ai réussi", "所以我考上了"], ["所以問", "donc je demande", "所以我問"], ["結果", "du coup", "於是"]], "examples": [["Il pleut, alors nous restons à la maison.", "下雨了，那麼我們就留在家裡。"], ["J’ai beaucoup étudié, donc j’ai réussi.", "我讀了很多，所以考上了。"], ["Je ne comprends pas, donc je pose une question.", "我不懂，所以我提問。"], ["Le bus n’est pas venu. Du coup, j’ai marché.", "公車沒來。於是我走路了。"]]}, {"name": "轉折", "meaning": "pourtant、cependant", "rows": [["卻很冷靜", "pourtant elle est calme", "她卻很冷靜"], ["然而病了", "cependant il était malade", "然而他病了"], ["但是", "mais", "但是"], ["不過", "par contre", "不過"]], "examples": [["Elle est jeune, pourtant elle est très calme.", "她很年輕，卻非常冷靜。"], ["Il voulait venir. Cependant, il était malade.", "他想來。然而他病了。"], ["Le film est long, mais il est intéressant.", "電影很長，但很有趣。"], ["J’aime cette ville. Par contre, elle est chère.", "我喜歡這座城市。不過它物價高。"]]}, {"name": "順序", "meaning": "d’abord、ensuite、enfin", "rows": [["首先", "d’abord", "首先"], ["然後", "ensuite", "然後"], ["最後", "enfin", "最後"], ["之後", "après", "之後"]], "examples": [["D’abord, je lis la question.", "首先，我讀問題。"], ["Ensuite, je cherche les mots difficiles.", "然後，我找出難字。"], ["Enfin, je réponds.", "最後，我作答。"], ["Après le cours, nous allons au café.", "下課之後，我們去咖啡館。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="fr">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="fr">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放法語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="fr">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('fr'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
