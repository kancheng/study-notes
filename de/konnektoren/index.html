<body>
<header><div class="brand"><a href="../index.html">← 德文筆記</a>　/　Konnektoren</div></header>
<main>
<div class="intro">
<h1>德文 B1｜連接詞</h1>
<p>obwohl、damit、als、wenn、nachdem 把動詞放在從句句尾。trotzdem 是副詞，後面的動詞仍在第二位。</p>
<div class="toolbar">
<a class="download" href="./konnektoren.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的德語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>als 是過去發生一次。wenn 是重複、現在或未來。<br>obwohl 動詞在句尾。trotzdem 後面動詞第二位：Es regnet. Trotzdem gehen wir.</div>
<nav class="pager"><a href="../infinitiv-zu/">← Infinitiv mit zu</a><a href="../passiv/">Passiv →</a></nav>
</main>
<footer>Konnektoren · 德文 B1</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "obwohl 與 trotzdem", "meaning": "雖然，兩種詞序", "rows": [["從句", "obwohl es regnet", "雖然下雨"], ["副詞", "Trotzdem gehen wir.", "儘管如此我們還是去"], ["逗號", "Obwohl es regnet, ...", "從句在前要逗號"], ["不要", "obwohl 後面動詞不在第二位", "動詞在句尾"]], "examples": [["Obwohl es regnet, gehen wir spazieren.", "雖然下雨，我們還是去散步。"], ["Es regnet. Trotzdem gehen wir spazieren.", "下雨了。儘管如此我們還是去散步。"], ["Obwohl ich müde bin, lerne ich weiter.", "雖然我累了，我還是繼續學。"], ["Der Text ist schwer. Trotzdem verstehe ich ihn.", "課文很難。儘管如此我還是看得懂。"]]}, {"name": "als 與 wenn", "meaning": "一次，或是重複", "rows": [["過去一次", "als ich in Berlin war", "當我在柏林時"], ["每當", "wenn ich Zeit hatte", "每當我有時間"], ["未來如果", "wenn ich Zeit habe", "如果我有時間"], ["不要混", "als 不談未來", "未來用 wenn"]], "examples": [["Als ich in Berlin war, habe ich viel gesehen.", "我在柏林的時候，看了很多東西。"], ["Wenn ich früher aufstand, frühstückte ich immer.", "以前我早起的時候，總是會吃早餐。"], ["Wenn ich morgen Zeit habe, rufe ich dich an.", "如果我明天有時間，我會打電話給你。"], ["Als sie ankam, war der Kurs schon vorbei.", "她到達的時候，課已經結束了。"]]}, {"name": "nachdem", "meaning": "先發生的事用過去完成", "rows": [["先吃完", "nachdem ich gegessen hatte", "我吃完之後"], ["助動詞", "hatte / war + 過去分詞", "過去完成"], ["主句", "多用 Präteritum", "然後才發生"], ["移動", "nachdem sie angekommen war", "她到達之後"]], "examples": [["Nachdem ich gegessen hatte, ging ich spazieren.", "我吃完之後去散步。"], ["Nachdem sie angekommen war, rief sie mich an.", "她到了之後打電話給我。"], ["Nachdem wir bezahlt hatten, verließen wir das Café.", "我們付完帳之後離開咖啡館。"], ["Er ging erst, nachdem er den Text gelesen hatte.", "他讀完課文才走。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="de">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="de">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放德語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('de'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
