<title>Wish｜英文 B2</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#182a45;background:#f3f6fb}
*{box-sizing:border-box}
body{margin:0}
header{background:#17355d;color:white;padding:22px max(20px,calc((100vw - 1050px)/2))}
header .brand{font-size:1.35rem;font-weight:800}
header a{color:inherit;text-decoration:none}
main{max-width:1050px;margin:auto;padding:32px 20px 70px}
h1{font-size:clamp(1.8rem,4vw,2.65rem);margin:0 0 8px}
h2{font-size:1.55rem;margin:0}
p{line-height:1.7}
.intro{margin-bottom:24px}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 28px}
.download,button{cursor:pointer;border:0;border-radius:9px;font:inherit}
.download{display:inline-block;background:#17355d;color:white;padding:12px 18px;text-decoration:none;font-weight:700}
.download:hover{background:#0f2442}
.note{font-size:.92rem;color:#52647d}
.card{background:white;border:1px solid #dce4f0;border-radius:16px;box-shadow:0 8px 24px #142f5210;margin:20px 0;padding:23px}
.cardhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.meaning{color:#52647d}
.tablewrap{overflow-x:auto;margin-top:18px}
table{border-collapse:collapse;width:100%;min-width:680px;text-align:left}

.examples h3{font-size:1.07rem;margin:0 0 10px}

.line{font-size:1.03rem;font-weight:700}
.zh{color:#53637b;margin-top:3px}
.speak{background:#e8eef6;color:#17355d;padding:9px 12px;min-width:84px}
.speak:hover,.speak:focus-visible{background:#d5deeb;outline:2px solid #17355d;outline-offset:2px}
.tip{background:#e8eef6;border-left:4px solid #17355d;padding:14px 18px;border-radius:8px;margin-top:20px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.pager a{color:#17355d;font-weight:750;text-decoration:none}
.pager a:hover,.pager a:focus-visible{text-decoration:underline}

<body>
<header><div class="brand"><a href="../index.html">← 英文筆記</a>　/　Wish</div></header>
<main>
<div class="intro">
<h1>英文 B2｜wish 與 as if</h1>
<p>wish 後面用過去式，表示希望現在不是這樣。希望過去不是那樣，用過去完成。as if 也常用過去式表示不像真的。</p>
<div class="toolbar">
<a class="download" href="./wish.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的英語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>I wish I were taller. be 常用 were。I wish I had studied. 是後悔過去。</div>
<nav class="pager"><a href="../causative/">← Causative</a><a href="../subjunctive/">Subjunctive →</a></nav>
</main>
<footer>Wish · 英文 B2</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "wish + 過去式", "meaning": "希望現在不同", "rows": [["知道", "I wish I knew", "但願我知道"], ["是", "I wish I were", "但願我是"], ["有", "I wish I had", "但願我有"], ["住", "I wish she lived", "但願她住"]], "examples": [["I wish I knew the answer.", "但願我知道答案。"], ["I wish I were taller.", "但願我更高。"], ["I wish I had more time.", "但願我有更多時間。"], ["I wish she lived closer.", "但願她住得更近。"]]}, {"name": "wish + 過去完成", "meaning": "後悔過去", "rows": [["用功", "I wish I had studied", "但願我當時有用功"], ["去", "I wish I had gone", "但願我當時有去"], ["說", "I wish I had said", "但願我當時有說"], ["幫忙", "I wish you had helped", "但願你當時有幫"]], "examples": [["I wish I had studied harder.", "但願我當時更用功。"], ["I wish I had gone with them.", "但願我當時跟他們去了。"], ["I wish I had said thank you.", "但願我當時說了謝謝。"], ["I wish you had helped me.", "但願你當時有幫我。"]]}, {"name": "as if", "meaning": "好像", "rows": [["知道", "as if he knew", "好像他知道"], ["是老闆", "as if she were the boss", "好像她是老闆"], ["見過", "as if they had met", "好像他們見過"], ["擁有", "as if he owned it", "好像他擁有它"]], "examples": [["He talks as if he knew everything.", "他說話好像什麼都知道。"], ["She acts as if she were the boss.", "她表現得好像她是老闆。"], ["They smiled as if they had met before.", "他們笑得好像以前見過。"], ["He spends money as if he owned the shop.", "他花錢好像這家店是他的。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="en">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="en">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放英語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('en'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
</body>
