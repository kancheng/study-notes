<main>
<div class="intro">
<h1>日文 N3｜受身</h1>
<p>受身把動作的接受者放到話題上。人用に。不愉快的遭遇、以及事物被做了某事，都很常用。</p>
<div class="toolbar">
<a class="download" href="./ukemi.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音，朗讀的是漢字句。可用性依瀏覽器與系統而異。</span>
</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>五段是詞尾あ段加れる：書く→書かれる、待つ→待たれる。<br>する是される。来る是来られる。</div>
<nav class="pager"><a href="../souda/">← そうだ</a><a href="../shieki/">使役 →</a></nav>

<footer>受身 · 日文 N3</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "人に", "meaning": "被人做了某事", "rows": [["被稱讚", "私は先生に褒められました。", "わたし は せんせい に ほめられました。", "Watashi wa sensei ni homeraremashita."], ["被叫", "名前を呼ばれました。", "なまえ を よばれました。", "Namae o yobaremashita."], ["被問", "友達に道を聞かれました。", "ともだち に みち を きかれました。", "Tomodachi ni michi o kikaremashita."], ["被邀請", "パーティーに誘われました。", "パーティー に さそわれました。", "Paatii ni sasowaremashita."]], "examples": [["子供のとき、母に叱られました。", "こども の とき、 はは に しかられました。", "Kodomo no toki, haha ni shikararemashita.", "小時候我被媽媽罵過。"], ["知らない人に写真を撮られました。", "しらない ひと に しゃしん を とられました。", "Shiranai hito ni shashin o toraremashita.", "我被陌生人拍了照。"], ["先生に作文を褒められました。", "せんせい に さくぶん を ほめられました。", "Sensei ni sakubun o homeraremashita.", "我的作文被老師稱讚了。"], ["隣の人に足を踏まれました。", "となり の ひと に あし を ふまれました。", "Tonari no hito ni ashi o fumaremashita.", "我被旁邊的人踩到腳。"]]}, {"name": "物が", "meaning": "事物當主語", "rows": [["被讀", "この本は多くの人に読まれています。", "この ほん は おおく の ひと に よまれて います。", "Kono hon wa ooku no hito ni yomarete imasu."], ["被開", "窓が開けられました。", "まど が あけられました。", "Mado ga akeraremashita."], ["被決定", "来月の旅行が決められました。", "らいげつ の りょこう が きめられました。", "Raigetsu no ryokou ga kimeraremashita."], ["被用", "この言葉はよく使われています。", "この ことば は よく つかわれて います。", "Kono kotoba wa yoku tsukawarete imasu."]], "examples": [["この歌は世界で歌われています。", "この うた は せかい で うたわれて います。", "Kono uta wa sekai de utawarete imasu.", "這首歌在世界各地被傳唱。"], ["会議の時間が変えられました。", "かいぎ の じかん が かえられました。", "Kaigi no jikan ga kaeraremashita.", "會議時間被改了。"], ["駅の前に新しい店が建てられました。", "えき の まえ に あたらしい みせ が たてられました。", "Eki no mae ni atarashii mise ga tateraremashita.", "車站前面蓋了一家新店。"], ["この漢字はどう読まれますか。", "この かんじ は どう よまれます か。", "Kono kanji wa dou yomaremasu ka.", "這個漢字怎麼讀？"]]}, {"name": "不幸", "meaning": "受害的說法", "rows": [["被淋雨", "帰りに雨に降られました。", "かえり に あめ に ふられました。", "Kaeri ni ame ni furaremashita."], ["被吵醒", "夜、子供に泣かれて、眠れませんでした。", "よる、 こども に なかれて、 ねむれません でした。", "Yoru, kodomo ni nakarete, nemuremasen deshita."], ["被先走", "友達に先に帰られました。", "ともだち に さき に かえられました。", "Tomodachi ni saki ni kaeraremashita."], ["被吃掉", "弟にケーキを食べられました。", "おとうと に ケーキ を たべられました。", "Otouto ni keeki o taberaremashita."]], "examples": [["電車の中で足を踏まれました。", "でんしゃ の なか で あし を ふまれました。", "Densha no naka de ashi o fumaremashita.", "我在電車裡被踩到腳。"], ["父に日記を読まれました。", "ちち に にっき を よまれました。", "Chichi ni nikki o yomaremashita.", "我的日記被爸爸看了。"], ["雨に降られて、風邪をひきました。", "あめ に ふられて、 かぜ を ひきました。", "Ame ni furarete, kaze o hikimashita.", "我被雨淋了，感冒了。"], ["猫に魚を食べられました。", "ねこ に さかな を たべられました。", "Neko ni sakana o taberaremashita.", "魚被貓吃了。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
