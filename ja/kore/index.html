<main>
<div class="intro">
<h1>日文 N5｜これ、それ、あれ</h1>
<p>これ是離說話者近的東西，それは離聽者近，あれ是雙方都遠。どれ問哪一個。指特定名詞時用この、その、あの。</p>
<div class="toolbar">
<a class="download" href="./kore.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音，朗讀的是漢字句。可用性依瀏覽器與系統而異。</span>
</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>これ／この的距離跟說話的人算。<br>問東西用どれ，問地點用どこ。</div>
<nav class="pager"><a href="../konnichiwa-doushi/">← こんにちは</a><a href="../gimonshi/">疑問詞 →</a></nav>

<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "これ", "meaning": "這個、那個、那個（遠）", "rows": [["這個", "これは本です。", "これ は ほん です。", "Kore wa hon desu."], ["那個", "それはペンです。", "それ は ペン です。", "Sore wa pen desu."], ["那個（遠）", "あれは何ですか。", "あれ は なん です か。", "Are wa nan desu ka."], ["哪一個", "どれがあなたの傘ですか。", "どれ が あなた の かさ です か。", "Dore ga anata no kasa desu ka."]], "examples": [["これは本です。", "これ は ほん です。", "Kore wa hon desu.", "這是書。"], ["それは私のペンです。", "それ は わたし の ペン です。", "Sore wa watashi no pen desu.", "那是我的筆。"], ["あれは学校です。", "あれ は がっこう です。", "Are wa gakkou desu.", "那邊那個是學校。"], ["どれがあなたの傘ですか。", "どれ が あなた の かさ です か。", "Dore ga anata no kasa desu ka.", "哪一把是你的傘？"]]}, {"name": "この", "meaning": "後面接名詞", "rows": [["這本書", "この本は新しいです。", "この ほん は あたらしい です。", "Kono hon wa atarashii desu."], ["那隻貓", "その猫はかわいいです。", "その ねこ は かわいい です。", "Sono neko wa kawaii desu."], ["那個人", "あの人は先生です。", "あの ひと は せんせい です。", "Ano hito wa sensei desu."], ["哪一把傘", "どの傘ですか。", "どの かさ です か。", "Dono kasa desu ka."]], "examples": [["この本は新しいです。", "この ほん は あたらしい です。", "Kono hon wa atarashii desu.", "這本書是新的。"], ["その猫はかわいいです。", "その ねこ は かわいい です。", "Sono neko wa kawaii desu.", "那隻貓很可愛。"], ["あの人は先生です。", "あの ひと は せんせい です。", "Ano hito wa sensei desu.", "那個人是老師。"], ["どの傘があなたのですか。", "どの かさ が あなた の です か。", "Dono kasa ga anata no desu ka.", "哪一把傘是你的？"]]}, {"name": "ここ", "meaning": "這裡、那裡、那裡（遠）", "rows": [["這裡", "ここは教室です。", "ここ は きょうしつ です。", "Koko wa kyoushitsu desu."], ["那裡", "そこは図書館です。", "そこ は としょかん です。", "Soko wa toshokan desu."], ["那裡（遠）", "あそこは駅です。", "あそこ は えき です。", "Asoko wa eki desu."], ["哪裡", "どこへ行きますか。", "どこ へ いきます か。", "Doko e ikimasu ka."]], "examples": [["ここは教室です。", "ここ は きょうしつ です。", "Koko wa kyoushitsu desu.", "這裡是教室。"], ["そこは図書館です。", "そこ は としょかん です。", "Soko wa toshokan desu.", "那裡是圖書館。"], ["あそこは駅です。", "あそこ は えき です。", "Asoko wa eki desu.", "那邊是車站。"], ["トイレはどこですか。", "トイレ は どこ です か。", "Toire wa doko desu ka.", "洗手間在哪裡？"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
