<h1>日文 N2｜ずにはいられない</h1>
<p>ずにはいられない是「忍不住、不得不」。五段動詞用ない形的詞幹加ず。一段動詞和する，比較常說ないではいられない。</p>
<div class="toolbar">
<a class="download" href="./zuirarenai.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音，朗讀的是漢字句。可用性依瀏覽器與系統而異。</span>
</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>

<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "ずには", "meaning": "五段：忍不住", "rows": [["忍不住哭", "あの映画を見ると、泣かずにはいられません。", "あの えいが を みると、 なかず に は いられません。", "Ano eiga o miruto, nakazu ni wa iraremasen."], ["忍不住笑", "その話を聞いて、笑わずにはいられませんでした。", "その はなし を きいて、 わらわず に は いられません でした。", "Sono hanashi o kiite, warawazu ni wa iraremasen deshita."], ["忍不住說", "本当のことを言わずにはいられません。", "ほんとう の こと を いわず に は いられません。", "Hontou no koto o iwazu ni wa iraremasen."], ["忍不住回想", "この曲を聞くと、思い出さずにはいられません。", "この きょく を きく と、 おもいださず に は いられません。", "Kono kyoku o kiku to, omoidasazu ni wa iraremasen."]], "examples": [["子供の写真を見ると、笑わずにはいられません。", "こども の しゃしん を みると、 わらわず に は いられません。", "Kodomo no shashin o miruto, warawazu ni wa iraremasen.", "看到孩子的照片，我就忍不住笑。"], ["その景色を見ると、写真を撮らずにはいられません。", "その けしき を みると、 しゃしん を とらず に は いられません。", "Sono keshiki o miruto, shashin o torazu ni wa iraremasen.", "看到那樣的風景，我就忍不住拍照。"], ["間違いを見つけると、注意せずにはいられません。", "まちがい を みつける と、 ちゅうい せず に は いられません。", "Machigai o mitsukeru to, chuui sezu ni wa iraremasen.", "一發現錯誤，我就忍不住提醒。"], ["この本を読むと、続きが気にならずにはいられません。", "この ほん を よむ と、 つづき が き に ならず に は いられません。", "Kono hon o yomu to, tsuzuki ga ki ni narazu ni wa iraremasen.", "讀了這本書，我就忍不住在意後續。"]]}, {"name": "ないでは", "meaning": "一段・する", "rows": [["忍不住高興", "彼の成功を喜ばないではいられません。", "かれ の せいこう を よろこばない で は いられません。", "Kare no seikou o yorokobanai de wa iraremasen."], ["忍不住感動", "その絵を見ると、感動しないではいられません。", "その え を みると、 かんどう しない で は いられません。", "Sono e o miruto, kandou shinai de wa iraremasen."], ["忍不住看", "窓の外を見ないではいられません。", "まど の そと を みない で は いられません。", "Mado no soto o minai de wa iraremasen."], ["忍不住吃", "この匂いは、食べないではいられません。", "この におい は、 たべない で は いられません。", "Kono nioi wa, tabenai de wa iraremasen."]], "examples": [["彼女の話を聞くと、感心しないではいられません。", "かのじょ の はなし を きく と、 かんしん しない で は いられません。", "Kanojo no hanashi o kiku to, kanshin shinai de wa iraremasen.", "聽她說話，我就忍不住佩服。"], ["その手紙を読んで、泣かないではいられませんでした。", "その てがみ を よんで、 なかない で は いられません でした。", "Sono tegami o yonde, nakanai de wa iraremasen deshita.", "讀了那封信，我忍不住哭了。"], ["新しい店を見ると、入ってみないではいられません。", "あたらしい みせ を みると、 はいって みない で は いられません。", "Atarashii mise o miruto, haitte minai de wa iraremasen.", "看到新店，我就忍不住想進去看看。"], ["困っている人を見ると、助けないではいられません。", "こまって いる ひと を みると、 たすけない で は いられません。", "Komatte iru hito o miruto, tasukenai de wa iraremasen.", "看到有困難的人，我就忍不住幫忙。"]]}, {"name": "比較", "meaning": "和なければならない", "rows": [["必須交", "明日までに出さなければなりません。", "あした まで に ださなければ なりません。", "Ashita made ni dasanakereba narimasen."], ["忍不住說", "このことは、言わずにはいられません。", "この こと は、 いわず に は いられません。", "Kono koto wa, iwazu ni wa iraremasen."], ["必須早起", "明日は早く起きなければなりません。", "あした は はやく おきなければ なりません。", "Ashita wa hayaku okinakereba narimasen."], ["忍不住擔心", "子供のことが心配で、電話せずにはいられません。", "こども の こと が しんぱい で、 でんわ せず に は いられません。", "Kodomo no koto ga shinpai de, denwa sezu ni wa iraremasen."]], "examples": [["規則なので、守らなければなりません。", "きそく なので、 まもらなければ なりません。", "Kisoku nanode, mamoranakereba narimasen.", "這是規定，所以必須遵守。"], ["あまりにおかしくて、笑わずにはいられません。", "あまり に おかしくて、 わらわず に は いられません。", "Amari ni okashikute, warawazu ni wa iraremasen.", "實在太好笑，我忍不住笑。"], ["試験の前は、寝なければなりません。", "しけん の まえ は、 ねなければ なりません。", "Shiken no mae wa, nenakereba narimasen.", "考試前必須睡覺。"], ["そのニュースを聞いて、考えずにはいられませんでした。", "その ニュース を きいて、 かんがえず に は いられません でした。", "Sono nyuusu o kiite, kangaezu ni wa iraremasen deshita.", "聽了那則新聞，我忍不住一直想。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
