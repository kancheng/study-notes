<body>
<header><div class="brand"><a href="../index.html">← 日文筆記</a>　/　ない形</div></header>
<main>
<div class="intro">
<h1>日文 N4｜ない形</h1>
<p>ない形用來請對方不要做、表示不必做，以及必須做。必須的說法是なければなりません。</p>
<div class="toolbar">
<a class="download" href="./naikei.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音，朗讀的是漢字句。可用性依瀏覽器與系統而異。</span>
</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>なくてもいい是不必。なければならない是必須。<br>請不要做用ないで。なくて是另一個接續，不用在請求。</div>
<nav class="pager"><a href="../tekei/">← て形</a><a href="../jishokei/">辞書形 →</a></nav>
</main>
<footer>ない形 · 日文 N4</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "ないで", "meaning": "請不要", "rows": [["不要讀", "まだ読まないでください。", "まだ よまないで ください。", "Mada yomanaide kudasai."], ["不要忘", "約束を忘れないでください。", "やくそく を わすれないで ください。", "Yakusoku o wasurenaide kudasai."], ["不要關", "ドアを閉めないでください。", "ドア を しめないで ください。", "Doa o shimenaide kudasai."], ["不要擔心", "心配しないでください。", "しんぱい しないで ください。", "Shinpai shinaide kudasai."]], "examples": [["その箱を開けないでください。", "その はこ を あけないで ください。", "Sono hako o akenaide kudasai.", "請不要打開那個盒子。"], ["ここで走らないでください。", "ここ で はしらないで ください。", "Koko de hashiranaide kudasai.", "請不要在這裡跑。"], ["答えを見ないでください。", "こたえ を みないで ください。", "Kotae o minaide kudasai.", "請不要看答案。"], ["一人で行かないでください。", "ひとり で いかないで ください。", "Hitori de ikanaide kudasai.", "請不要一個人去。"]]}, {"name": "なくてもいい", "meaning": "不必", "rows": [["不必來", "明日、来なくてもいいです。", "あした、 こなくても いい です。", "Ashita, konakutemo ii desu."], ["不必寫", "名前を書かなくてもいいです。", "なまえ を かかなくても いい です。", "Namae o kakanakutemo ii desu."], ["不必等", "待たなくてもいいです。", "またなくても いい です。", "Matanakutemo ii desu."], ["不必買", "今日は買わなくてもいいです。", "きょう は かわなくても いい です。", "Kyou wa kawanakutemo ii desu."]], "examples": [["靴を脱がなくてもいいです。", "くつ を ぬがなくても いい です。", "Kutsu o nuganakutemo ii desu.", "不必脫鞋。"], ["明日は来なくてもいいです。", "あした は こなくても いい です。", "Ashita wa konakutemo ii desu.", "明天不必來。"], ["全部やらなくてもいいです。", "ぜんぶ やらなくても いい です。", "Zenbu yaranakutemo ii desu.", "不必全部做完。"], ["今日は払わなくてもいいです。", "きょう は はらわなくても いい です。", "Kyou wa harawanakutemo ii desu.", "今天不必付。"]]}, {"name": "なければならない", "meaning": "必須", "rows": [["必須喝", "薬を飲まなければなりません。", "くすり を のまなければ なりません。", "Kusuri o nomanakereba narimasen."], ["必須交", "明日までに出さなければなりません。", "あした まで に ださなければ なりません。", "Ashita made ni dasanakereba narimasen."], ["必須早起", "六時に起きなければなりません。", "ろくじ に おきなければ なりません。", "Rokuji ni okinakereba narimasen."], ["必須寫", "この文を書かなければなりません。", "この ぶん を かかなければ なりません。", "Kono bun o kakanakereba narimasen."]], "examples": [["パスポートを見せなければなりません。", "パスポート を みせなければ なりません。", "Pasupooto o misenakereba narimasen.", "必須出示護照。"], ["今日中に決めなければなりません。", "きょうじゅう に きめなければ なりません。", "Kyoujuu ni kimenakereba narimasen.", "必須在今天之內決定。"], ["九時までに来なければなりません。", "くじ まで に こなければ なりません。", "Kuji made ni konakereba narimasen.", "必須在九點之前到。"], ["毎日練習しなければなりません。", "まいにち れんしゅう しなければ なりません。", "Mainichi renshuu shinakereba narimasen.", "必須每天練習。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
