<div class="intro">
<h1>日文 N5｜疑問詞</h1>
<p>だれ、何、いつ、どこ、なぜ／どうして、どう 是常見的疑問詞，用來組成問句。句尾常加 か。</p>
<div class="toolbar">
<a class="download" href="./gimonshi.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音，朗讀的是漢字句。可用性依瀏覽器與系統而異。</span>
</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>何讀なに或なん：何を／なにを，何ですか／なんですか。<br>なぜ和どうして都是「為什麼」；どう是「怎麼樣」，問方法常用どうやって。</div>
<nav class="pager"><a href="../kore/">← これ・それ・あれ</a><a href="../joshi/">助詞 →</a></nav>
</main>
<footer>疑問詞 · 日文 N5</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "疑問詞", "meaning": "六個常用詞", "rows": [["誰", "だれ", "だれ", "dare"], ["什麼", "何", "なに", "nani"], ["何時", "いつ", "いつ", "itsu"], ["哪裡", "どこ", "どこ", "doko"], ["為什麼", "なぜ", "なぜ", "naze"], ["如何", "どう", "どう", "dou"]], "examples": [["誰が来ますか。", "だれ が きます か。", "Dare ga kimasu ka.", "誰要來？"], ["何を勉強しますか。", "なに を べんきょう します か。", "Nani o benkyou shimasu ka.", "你學什麼？"], ["授業はいつ始まりますか。", "じゅぎょう は いつ はじまります か。", "Jugyou wa itsu hajimarimasu ka.", "課幾點開始？"], ["どこに住みますか。", "どこ に すみます か。", "Doko ni sumimasu ka.", "你住哪裡？"]]}, {"name": "人與事物", "meaning": "だれ / 何", "rows": [["誰來", "誰が来ますか。", "だれ が きます か。", "Dare ga kimasu ka."], ["學什麼", "何を勉強しますか。", "なに を べんきょう します か。", "Nani o benkyou shimasu ka."], ["那是什麼", "これは何ですか。", "これ は なん です か。", "Kore wa nan desu ka."], ["誰教", "誰が教えますか。", "だれ が おしえます か。", "Dare ga oshiemasu ka."]], "examples": [["誰が来ますか。", "だれ が きます か。", "Dare ga kimasu ka.", "誰要來？"], ["何を勉強しますか。", "なに を べんきょう します か。", "Nani o benkyou shimasu ka.", "你學什麼？"], ["これは何ですか。", "これ は なん です か。", "Kore wa nan desu ka.", "這是什麼？"], ["誰が英語を教えますか。", "だれ が えいご を おしえます か。", "Dare ga eigo o oshiemasu ka.", "誰教英文？"]]}, {"name": "時間、地方、原因、方式", "meaning": "いつ / どこ / なぜ / どう", "rows": [["何時開始", "授業はいつ始まりますか。", "じゅぎょう は いつ はじまります か。", "Jugyou wa itsu hajimarimasu ka."], ["住哪裡", "どこに住みますか。", "どこ に すみます か。", "Doko ni sumimasu ka."], ["為什麼學", "なぜ英語を勉強しますか。", "なぜ えいご を べんきょう します か。", "Naze eigo o benkyou shimasu ka."], ["怎麼練習", "どうやって練習しますか。", "どうやって れんしゅう します か。", "Douyatte renshuu shimasu ka."]], "examples": [["授業はいつ始まりますか。", "じゅぎょう は いつ はじまります か。", "Jugyou wa itsu hajimarimasu ka.", "課幾點開始？"], ["どこに住みますか。", "どこ に すみます か。", "Doko ni sumimasu ka.", "你住哪裡？"], ["なぜ英語を勉強しますか。", "なぜ えいご を べんきょう します か。", "Naze eigo o benkyou shimasu ka.", "你為什麼學英文？"], ["どうやって練習しますか。", "どうやって れんしゅう します か。", "Douyatte renshuu shimasu ka.", "你怎麼練習？"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
