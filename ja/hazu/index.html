<main>
<div class="intro">
<h1>日文 N3｜はず、わけ、らしい</h1>
<p>はず是按道理應該。わけ是原因或合乎邏輯的結果。らしい是根據聽說或看到的跡象所作的判斷。</p>
<div class="toolbar">
<a class="download" href="./hazu.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音，朗讀的是漢字句。可用性依瀏覽器與系統而異。</span>
</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>はずがない是不可能。わけではない是並非。<br>らしい比そうだ更依賴傳聞或外在跡象。</div>
<nav class="pager"><a href="../bakari/">← ばかり・ところ</a><a href="../noni/">のに・ても →</a></nav>
</main>
<footer>はず・わけ・らしい · 日文 N3</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "はず", "meaning": "按理應該", "rows": [["應該來", "彼は今日来るはずです。", "かれ は きょう くる はず です。", "Kare wa kyou kuru hazu desu."], ["應該知道", "この言葉は知っているはずです。", "この ことば は しって いる はず です。", "Kono kotoba wa shitte iru hazu desu."], ["不可能", "彼が忘れるはずがありません。", "かれ が わすれる はず が ありません。", "Kare ga wasureru hazu ga arimasen."], ["不該在", "今は部屋にいるはずがありません。", "いま は へや に いる はず が ありません。", "Ima wa heya ni iru hazu ga arimasen."]], "examples": [["鍵は引き出しにあるはずです。", "かぎ は ひきだし に ある はず です。", "Kagi wa hikidashi ni aru hazu desu.", "鑰匙應該在抽屜裡。"], ["もう着いているはずです。", "もう ついて いる はず です。", "Mou tsuite iru hazu desu.", "應該已經到了。"], ["そんなに高いはずがありません。", "そんな に たかい はず が ありません。", "Sonna ni takai hazu ga arimasen.", "不可能那麼貴。"], ["今日は休みのはずですが。", "きょう は やすみ の はず です が。", "Kyou wa yasumi no hazu desu ga.", "今天應該是休息啊。"]]}, {"name": "わけ", "meaning": "原因與並非", "rows": [["所以沒時間", "仕事が多いわけです。", "しごと が おおい わけ です。", "Shigoto ga ooi wake desu."], ["並非不喜歡", "嫌いなわけではありません。", "きらい な わけ で は ありません。", "Kirai na wake de wa arimasen."], ["難怪", "夜遅かったので、眠いわけです。", "よる おそかった ので、 ねむい わけ です。", "Yoru osokatta node, nemui wake desu."], ["沒有理由", "怒るわけがありません。", "おこる わけ が ありません。", "Okoru wake ga arimasen."]], "examples": [["熱があるので、休むわけです。", "ねつ が ある ので、 やすむ わけ です。", "Netsu ga aru node, yasumu wake desu.", "因為發燒，所以才休息。"], ["行きたくないわけではありません。", "いきたくない わけ で は ありません。", "Ikitakunai wake de wa arimasen.", "並不是不想去。"], ["毎日練習したので、上手なわけです。", "まいにち れんしゅう した ので、 じょうず な わけ です。", "Mainichi renshuu shita node, jouzu na wake desu.", "因為每天練習，所以才這麼好。"], ["まだ決まったわけではありません。", "まだ きまった わけ で は ありません。", "Mada kimatta wake de wa arimasen.", "還沒有決定。"]]}, {"name": "らしい", "meaning": "看來、聽說", "rows": [["好像下雨", "明日は雨らしいです。", "あした は あめ らしい です。", "Ashita wa ame rashii desu."], ["好像很忙", "彼は最近忙しいらしいです。", "かれ は さいきん いそがしい らしい です。", "Kare wa saikin isogashii rashii desu."], ["好像是學生", "あの人は学生らしいです。", "あの ひと は がくせい らしい です。", "Ano hito wa gakusei rashii desu."], ["好像取消", "旅行は中止らしいです。", "りょこう は ちゅうし らしい です。", "Ryokou wa chuushi rashii desu."]], "examples": [["隣の家は留守らしいです。", "となり の いえ は るす らしい です。", "Tonari no ie wa rusu rashii desu.", "隔壁好像沒有人在。"], ["この店のケーキはおいしいらしいです。", "この みせ の ケーキ は おいしい らしい です。", "Kono mise no keeki wa oishii rashii desu.", "聽說這家店的蛋糕很好吃。"], ["夜は冷えるらしいので、コートを持っていきます。", "よる は ひえる らしい ので、 コート を もって いきます。", "Yoru wa hieru rashii node, kooto o motte ikimasu.", "聽說晚上會變冷，我帶外套去。"], ["あの二人は兄弟らしいです。", "あの ふたり は きょうだい らしい です。", "Ano futari wa kyoudai rashii desu.", "那兩個人好像是兄弟。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
