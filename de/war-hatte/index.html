<p>sein 和 haben 說過去時，口語也常用簡單過去：war 和 hatte。其他動詞的簡單過去留到 B1。</p>

<div class="tip"><strong>用法提醒：</strong>敘述昨天做了什麼，一般動詞仍用 Perfekt：Ich habe gelernt。<br>是、有、在，常用 war 和 hatte：Ich war müde. Ich hatte Zeit.</div>

<script id="lesson" type="application/json">{"cols": ["人稱", "形式", "中文"], "groups": [{"name": "war", "meaning": "sein 的過去", "rows": [["ich / er", "war", "當時是"], ["du", "warst", "你當時是"], ["wir / sie", "waren", "當時是"], ["ihr", "wart", "你們當時是"]], "examples": [["Ich war gestern müde.", "我昨天很累。"], ["Wo warst du?", "你當時在哪裡？"], ["Wir waren zu Hause.", "我們當時在家。"], ["Der Kurs war interessant.", "那堂課很有趣。"]]}, {"name": "hatte", "meaning": "haben 的過去", "rows": [["ich / er", "hatte", "當時有"], ["du", "hattest", "你當時有"], ["wir / sie", "hatten", "當時有"], ["ihr", "hattet", "你們當時有"]], "examples": [["Ich hatte keine Zeit.", "我當時沒有時間。"], ["Hattest du Hunger?", "你當時餓嗎？"], ["Wir hatten eine Frage.", "我們當時有一個問題。"], ["Sie hatte einen Bruder.", "她當時有一個兄弟。"]]}, {"name": "怎麼選", "meaning": "war、hatte 或 Perfekt", "rows": [["狀態", "Ich war krank.", "我當時生病。"], ["擁有", "Ich hatte ein Buch.", "我當時有一本書。"], ["做過的事", "Ich habe geschlafen.", "我睡了。"], ["去過", "Ich bin gegangen.", "我去了。"]], "examples": [["Gestern war ich zu Hause.", "昨天我在家。"], ["Ich hatte leider keine Zeit.", "我當時可惜沒有時間。"], ["Ich habe zehn Stunden geschlafen.", "我睡了十個小時。"], ["Danach bin ich spazieren gegangen.", "之後我去散步了。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="de">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="de">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放德語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('de'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
