<style>

<body>
<header><div class="brand"><a href="../index.html">← 德文筆記</a>　/　Nebensatz</div></header>
<main>
<div class="intro">
<h1>德文 A2｜從句</h1>
<p>weil、dass、wenn、ob 開頭的從句，動詞放到該從句的句尾。denn 不是從句，動詞仍在第二位。</p>
<div class="toolbar">
<a class="download" href="./nebensatz.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的德語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>weil 把動詞送到句尾。denn 後面仍是正常主句：動詞第二位。<br>從句前要加逗號。ob 用來轉述是非問句，dass 用來轉述一件事。</div>
<nav class="pager"><a href="../reflexiv/">← Reflexiv</a><a href="../praeteritum/">Präteritum →</a></nav>
</main>
<footer>Nebensatz · 德文 A2</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "weil 與 denn", "meaning": "原因的兩種動詞位置", "rows": [["因為（從句）", "weil ich krank bin", "因為我生病"], ["因為（主句）", "denn ich bin krank", "因為我生病"], ["所以留下", "Ich bleibe zu Hause", "我留在家裡"], ["逗號", "zu Hause, weil ...", "從句前要逗號"]], "examples": [["Ich bleibe zu Hause, weil ich krank bin.", "我留在家裡，因為我生病。"], ["Ich bleibe zu Hause, denn ich bin krank.", "我留在家裡，因為我生病。"], ["Sie lernt Deutsch, weil sie die Sprache braucht.", "她學德文，因為她需要這個語言。"], ["Er kommt nicht, denn er hat keine Zeit.", "他不來，因為他沒有時間。"]]}, {"name": "dass 與 ob", "meaning": "一件事，或是不是", "rows": [["一件事", "dass er kommt", "他會來"], ["不知道是不是", "ob sie kommt", "她來不來"], ["我想", "Ich denke, dass ...", "我認為……"], ["我不知道", "Ich weiß nicht, ob ...", "我不知道是否……"]], "examples": [["Ich denke, dass er morgen kommt.", "我認為他明天會來。"], ["Sie sagt, dass sie müde ist.", "她說她累了。"], ["Ich weiß nicht, ob sie Zeit hat.", "我不知道她有沒有時間。"], ["Weißt du, ob der Kurs heute ist?", "你知道今天有沒有課嗎？"]]}, {"name": "wenn", "meaning": "如果、每當", "rows": [["如果有時間", "wenn ich Zeit habe", "如果我有時間"], ["從句在前", "Wenn ich Zeit habe, koche ich.", "如果我有時間，我就煮飯。"], ["每當", "wenn es regnet", "每當下雨"], ["動詞", "在從句句尾", "habe、regnet"]], "examples": [["Wenn ich Zeit habe, koche ich.", "如果我有時間，我就煮飯。"], ["Ich bleibe hier, wenn es regnet.", "如果下雨，我就留在這裡。"], ["Wenn du willst, kommen wir mit.", "如果你願意，我們就一起去。"], ["Ruf mich an, wenn du ankommst.", "你到了就打電話給我。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="de">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="de">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放德語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('de'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
