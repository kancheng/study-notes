<style>

<body>
<header><div class="brand"><a href="../index.html">← 法文筆記</a>　/　Négation</div></header>
<main>
<div class="intro">
<h1>法文 A1｜ne…pas</h1>
<p>否定把 ne 放在動詞前，pas 放在動詞後。je 後面如果是母音，ne 寫成 n’。否定句裡，不定冠詞 un、une、des 常改成 de。</p>
<div class="toolbar">
<a class="download" href="./negation.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的法語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>有代詞時，ne 放在代詞前：Je ne le vois pas. 這會在 A2 再練。<br>Il n’y a pas de 後面直接接名詞，不加 un 或 une。</div>
<nav class="pager"><a href="../adjectifs/">← Adjectifs</a><a href="../questions/">Questions →</a></nav>
</main>
<footer>Négation · 法文 A1</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "ne…pas", "meaning": "不是、沒有做", "rows": [["不是", "je ne suis pas", "我不是"], ["沒有", "je n’ai pas", "我沒有"], ["不住", "il n’habite pas", "他不住"], ["不說", "nous ne parlons pas", "我們不說"]], "examples": [["Je ne suis pas médecin.", "我不是醫生。"], ["Je n’ai pas de frère.", "我沒有兄弟。"], ["Il n’habite pas ici.", "他不住這裡。"], ["Nous ne parlons pas anglais.", "我們不說英文。"]]}, {"name": "省音", "meaning": "母音前 n’", "rows": [["不喜歡", "je n’aime pas", "我不喜歡"], ["不是", "ce n’est pas", "這不是"], ["沒有", "il n’y a pas", "沒有"], ["你不是", "tu n’es pas", "你不是"]], "examples": [["Je n’aime pas le café.", "我不喜歡咖啡。"], ["Ce n’est pas mon sac.", "這不是我的袋子。"], ["Il n’y a pas de sucre.", "沒有糖。"], ["Tu n’es pas en retard.", "你沒有遲到。"]]}, {"name": "pas de", "meaning": "否定後不再用 un", "rows": [["沒有書", "pas de livre", "沒有書"], ["沒有朋友", "pas d’amis", "沒有朋友"], ["沒有課", "pas de cours", "沒有課"], ["沒有問題", "pas de problème", "沒問題"]], "examples": [["Je n’ai pas de stylo.", "我沒有筆。"], ["Elle n’a pas d’enfants.", "她沒有孩子。"], ["Nous n’avons pas de cours aujourd’hui.", "我們今天沒有課。"], ["Il n’y a pas de problème.", "沒問題。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="fr">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="fr">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放法語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="fr">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('fr'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
</body>
