<h1>日文 N3｜ことにする、ことになる</h1>
<p>ことにする是自己決定。ことになる是決定已經形成，不一定是自己一個人決定的。</p>
<div class="toolbar">
<a class="download" href="./kotoni.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音，朗讀的是漢字句。可用性依瀏覽器與系統而異。</span>
</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>ことにする的主語是決定的人。<br>ことになる常不說是誰決定的。</div>

<footer>ことにする · 日文 N3</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "ことにする", "meaning": "自己決定", "rows": [["決定早睡", "明日から、早く寝ることにします。", "あした から、 はやく ねる こと に します。", "Ashita kara, hayaku neru koto ni shimasu."], ["決定戒", "タバコをやめることにしました。", "タバコ を やめる こと に しました。", "Tabako o yameru koto ni shimashita."], ["決定不買", "今年は車を買わないことにします。", "ことし は くるま を かわない こと に します。", "Kotoshi wa kuruma o kawanai koto ni shimasu."], ["問", "どうすることにしましたか。", "どう する こと に しました か。", "Dou suru koto ni shimashita ka."]], "examples": [["毎日三十分歩くことにしました。", "まいにち さんじゅっぷん あるく こと に しました。", "Mainichi sanjuppun aruku koto ni shimashita.", "我決定每天走三十分鐘。"], ["来月から、肉を食べないことにします。", "らいげつ から、 にく を たべない こと に します。", "Raigetsu kara, niku o tabenai koto ni shimasu.", "我決定從下個月起不吃肉。"], ["その仕事は断ることにしました。", "その しごと は ことわる こと に しました。", "Sono shigoto wa kotowaru koto ni shimashita.", "那份工作我決定拒絕。"], ["結局、行かないことにしました。", "けっきょく、 いかない こと に しました。", "Kekkyoku, ikanai koto ni shimashita.", "結果我決定不去。"]]}, {"name": "ことになる", "meaning": "決定已定", "rows": [["決定去", "来月、大阪へ行くことになりました。", "らいげつ、 おおさか へ いく こと に なりました。", "Raigetsu, oosaka e iku koto ni narimashita."], ["決定休", "明日は休みになることになりました。", "あした は やすみ に なる こと に なりました。", "Ashita wa yasumi ni naru koto ni narimashita."], ["決定改", "会議は来週になることになりました。", "かいぎ は らいしゅう に なる こと に なりました。", "Kaigi wa raishuu ni naru koto ni narimashita."], ["規定", "ここでは靴を脱ぐことになっています。", "ここ で は くつ を ぬぐ こと に なって います。", "Koko de wa kutsu o nugu koto ni natte imasu."]], "examples": [["来年、東京へ転勤することになりました。", "らいねん、 とうきょう へ てんきん する こと に なりました。", "Rainen, toukyou e tenkin suru koto ni narimashita.", "已經決定我明年調到東京。"], ["結婚式は六月に行うことになりました。", "けっこんしき は ろくがつ に おこなう こと に なりました。", "Kekkonshiki wa rokugatsu ni okonau koto ni narimashita.", "已經決定婚禮在六月舉行。"], ["この計画は中止することになりました。", "この けいかく は ちゅうし する こと に なりました。", "Kono keikaku wa chuushi suru koto ni narimashita.", "這項計畫已經決定中止。"], ["図書館では静かにする必要があります。", "としょかん で は しずか に する ひつよう が あります。", "Toshokan de wa shizuka ni suru hitsuyou ga arimasu.", "在圖書館必須保持安靜。"]]}, {"name": "必要がある", "meaning": "有必要", "rows": [["有必要確認", "もう一度確認する必要があります。", "もう いちど かくにん する ひつよう が あります。", "Mou ichido kakunin suru hitsuyou ga arimasu."], ["有必要早起", "明日は早く起きる必要があります。", "あした は はやく おきる ひつよう が あります。", "Ashita wa hayaku okiru hitsuyou ga arimasu."], ["沒必要", "今すぐ決める必要はありません。", "いま すぐ きめる ひつよう は ありません。", "Ima sugu kimeru hitsuyou wa arimasen."], ["問", "何を準備する必要がありますか。", "なに を じゅんび する ひつよう が あります か。", "Nani o junbi suru hitsuyou ga arimasu ka."]], "examples": [["出国する前に、申請する必要があります。", "しゅっこく する まえ に、 しんせい する ひつよう が あります。", "Shukkoku suru mae ni, shinsei suru hitsuyou ga arimasu.", "出國前必須申請。"], ["この書類を出す必要があります。", "この しょるい を だす ひつよう が あります。", "Kono shorui o dasu hitsuyou ga arimasu.", "必須交出這份文件。"], ["急ぐ必要はありません。", "いそぐ ひつよう は ありません。", "Isogu hitsuyou wa arimasen.", "不必著急。"], ["参加する人は、申し込む必要があります。", "さんか する ひと は、 もうしこむ ひつよう が あります。", "Sanka suru hito wa, moushikomu hitsuyou ga arimasu.", "要參加的人必須報名。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
