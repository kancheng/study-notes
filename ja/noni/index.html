<body>

<main>
<div class="intro">
<h1>日文 N3｜のに與ても</h1>
<p>のに是雖然，帶著意外或不滿。ても是即使，後面的結果不受前面影響。でも接在名詞和な形容詞後面。</p>
<div class="toolbar">
<a class="download" href="./noni.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音，朗讀的是漢字句。可用性依瀏覽器與系統而異。</span>
</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>のに前面用普通形。な形容詞用なのに：暇なのに。<br>ても前面是て形。でも前面是名詞。</div>
<nav class="pager"><a href="../hazu/">← はず・わけ・らしい</a><a href="../keigo/">敬語 →</a></nav>

<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "のに", "meaning": "雖然卻", "rows": [["雖然讀了", "勉強したのに、できませんでした。", "べんきょう した の に、 できません でした。", "Benkyou shita no ni, dekimasen deshita."], ["雖然說了", "言ったのに、聞いてくれません。", "いった の に、 きいて くれません。", "Itta no ni, kiite kuremasen."], ["雖然便宜", "安いのに、だれも買いません。", "やすい の に、 だれ も かいません。", "Yasui no ni, dare mo kaimasen."], ["雖然有空", "暇なのに、出かけません。", "ひま な の に、 でかけません。", "Hima na no ni, dekakemasen."]], "examples": [["約束したのに、来ませんでした。", "やくそく した の に、 きません でした。", "Yakusoku shita no ni, kimasen deshita.", "雖然約好了，卻沒來。"], ["何度も練習したのに、できません。", "なんど も れんしゅう した の に、 できません。", "Nando mo renshuu shita no ni, dekimasen.", "雖然練了很多次，還是不會。"], ["今日は日曜日なのに、働いています。", "きょう は にちようび な の に、 はたらいて います。", "Kyou wa nichiyoubi na no ni, hataraite imasu.", "今天明明是星期天，卻在工作。"], ["知っているのに、教えてくれません。", "しって いる の に、 おしえて くれません。", "Shitte iru no ni, oshiete kuremasen.", "明明知道，卻不告訴我。"]]}, {"name": "ても", "meaning": "即使", "rows": [["即使貴", "高くても、買います。", "たかくても、 かいます。", "Takakutemo, kaimasu."], ["即使下雨", "雨が降っても、行きます。", "あめ が ふっても、 いきます。", "Ame ga futtemo, ikimasu."], ["即使忙", "忙しくても、運動します。", "いそがしくても、 うんどう します。", "Isogashikutemo, undou shimasu."], ["即使說", "何を言っても、聞きません。", "なに を いっても、 ききません。", "Nani o ittemo, kikimasen."]], "examples": [["難しくても、最後までやります。", "むずかしくても、 さいご まで やります。", "Muzukashikutemo, saigo made yarimasu.", "即使難，我也做到最後。"], ["反対されても、行きたいです。", "はんたい されて も、 いきたい です。", "Hantai sarete mo, ikitai desu.", "即使被反對，我也想去。"], ["何度読んでも、分かりません。", "なんど よんでも、 わかりません。", "Nando yondemo, wakarimasen.", "即使讀了很多遍，還是不懂。"], ["待っても、来ませんでした。", "まっても、 きません でした。", "Mattemo, kimasen deshita.", "即使等了，也沒來。"]]}, {"name": "でも", "meaning": "名詞的即使", "rows": [["即使是雨天", "雨でも、行きます。", "あめ でも、 いきます。", "Ame demo, ikimasu."], ["即使是小孩", "子供でも、分かります。", "こども でも、 わかります。", "Kodomo demo, wakarimasu."], ["即使是一點", "少しでも、手伝ってください。", "すこし でも、 てつだって ください。", "Sukoshi demo, tetsudatte kudasai."], ["誰都", "誰でも参加できます。", "だれ でも さんか できます。", "Dare demo sanka dekimasu."]], "examples": [["日曜でも、店は開いています。", "にちよう でも、 みせ は あいて います。", "Nichiyou demo, mise wa aite imasu.", "即使星期天，店也開著。"], ["初心者でも、参加できます。", "しょしんしゃ でも、 さんか できます。", "Shoshinsha demo, sanka dekimasu.", "即使是初學者也能參加。"], ["一杯でもいいので、飲んでください。", "いっぱい でも いい ので、 のんで ください。", "Ippai demo ii node, nonde kudasai.", "即使一杯也好，請喝。"], ["どこでもいいです。", "どこ でも いい です。", "Doko demo ii desu.", "哪裡都可以。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
