<header><div class="brand"><a href="../index.html">← 法文筆記</a>　/　Discours indirect</div></header>
<main>
<div class="intro">
<h1>法文 B2｜間接引語</h1>
<p>轉述別人現在說的話，動詞往往退一層：現在式變成未完成過去，複合過去變成愈過去，簡單將來變成條件式。命令變成 de 加原形。</p>
<div class="toolbar">
<a class="download" href="./discours.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的法語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>轉述疑問句用 si，不再用 est-ce que。<br>時間詞也常改：demain 可改成 le lendemain，aujourd’hui 可改成 ce jour-là。</div>
<nav class="pager"><a href="../passif/">← Voix passive</a><a href="../infinitif/">Infinitif passé →</a></nav>
</main>
<footer>Discours indirect · 法文 B2</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "陳述", "meaning": "時態往前退", "rows": [["當時累", "il était fatigué", "他當時累了"], ["已經做完", "elle avait fini", "她已經做完"], ["第二天會來", "il viendrait le lendemain", "他隔天會來"], ["不知道", "il ne savait pas", "他當時不知道"]], "examples": [["Il a dit qu’il était fatigué.", "他說他累了。"], ["Elle a dit qu’elle avait fini le travail.", "她說她已經把工作做完了。"], ["Il a dit qu’il viendrait le lendemain.", "他說他隔天會來。"], ["Elle a dit qu’elle ne savait pas.", "她說她不知道。"]]}, {"name": "疑問", "meaning": "si、疑問詞", "rows": [["是否來", "si je venais", "我是否來"], ["幾點", "à quelle heure nous partions", "我們幾點走"], ["哪裡", "où j’habitais", "我住哪裡"], ["為什麼", "pourquoi elle était partie", "她為什麼離開"]], "examples": [["Elle m’a demandé si je venais.", "她問我來不來。"], ["Il a demandé à quelle heure nous partions.", "他問我們幾點出發。"], ["Elle voulait savoir où j’habitais.", "她想知道我住哪裡。"], ["Il a demandé pourquoi elle était partie.", "他問她為什麼離開了。"]]}, {"name": "命令", "meaning": "de + 原形", "rows": [["叫我等", "de l’attendre", "等他"], ["請我來", "de venir", "來"], ["叫我不要說", "de ne pas le dire", "不要說"], ["請我們坐", "de nous asseoir", "坐下"]], "examples": [["Il m’a dit de l’attendre.", "他叫我等他。"], ["Elle m’a demandé de venir plus tôt.", "她請我早一點來。"], ["Il m’a dit de ne pas le répéter.", "他叫我不要把這件事說出去。"], ["Le professeur nous a dit de nous asseoir.", "老師叫我們坐下。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="fr">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="fr">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放法語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="fr">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('fr'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
