<main>
<div class="intro">
<h1>英文 B1｜so…that 與 such…that</h1>
<p>so…that 和 such…that 都表示「如此……以至於」。so 後面接形容詞或副詞，such 後面接名詞片語。</p>
<div class="toolbar">
<a class="download" href="./so-that-result.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的英語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>so many / so much 後面仍用 so，即使後面有名詞：so many books that...。</div>
<nav class="pager"><a href="../time-clauses/">← Time Clauses</a><a href="../although/">Although →</a></nav>
</main>
<footer>So That Result · 英文 B1</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "so + 形容詞", "meaning": "如此……以至於", "rows": [["累", "so tired that", "累到"], ["忙", "so busy that", "忙到"], ["快", "so fast that", "快到"], ["便宜", "so cheap that", "便宜到"]], "examples": [["I was so tired that I fell asleep.", "我累到睡著了。"], ["She is so busy that she cannot come.", "她忙到不能來。"], ["He ran so fast that I could not follow.", "他跑得快到我跟不上。"], ["The book was so cheap that I bought two.", "這本書便宜到我買了兩本。"]]}, {"name": "such + 名詞", "meaning": "如此一個……", "rows": [["好老師", "such a good teacher that", "這麼好的老師，以至於"], ["大雨", "such heavy rain that", "這麼大的雨，以至於"], ["難的考試", "such a hard test that", "這麼難的考試，以至於"], ["好心的人", "such kind people that", "這麼好心的人，以至於"]], "examples": [["She is such a good teacher that we all like her.", "她是這麼好的老師，我們都很喜歡她。"], ["It was such heavy rain that we stayed home.", "雨大到我們留在家。"], ["It was such a hard test that many students failed.", "考試難到許多學生不及格。"], ["They are such kind people that I trust them.", "他們人這麼好，我信任他們。"]]}, {"name": "so many / so much", "meaning": "數量太多", "rows": [["可數", "so many books that", "書多到"], ["可數", "so few chairs that", "椅子少到"], ["不可數", "so much work that", "工作多到"], ["不可數", "so little time that", "時間少到"]], "examples": [["I have so many books that I need a new shelf.", "我的書多到需要一個新書架。"], ["There were so few chairs that some students stood.", "椅子少到有些學生站著。"], ["There is so much work that I cannot rest.", "工作多到我無法休息。"], ["We have so little time that we must hurry.", "我們時間少到必須趕快。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="en">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="en">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放英語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('en'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
