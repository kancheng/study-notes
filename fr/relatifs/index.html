<style>

p{line-height:1.7}
.intro{margin-bottom:24px}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 28px}
.download,button{cursor:pointer;border:0;border-radius:9px;font:inherit}
.download{display:inline-block;background:#b3482f;color:white;padding:12px 18px;text-decoration:none;font-weight:700}

<body>
<header><div class="brand"><a href="../index.html">← 法文筆記</a>　/　Pronoms relatifs</div></header>
<main>
<div class="intro">
<h1>法文 B1｜關係代詞</h1>
<p>qui 當關係子句的主詞。que 當受詞。où 指地方或時間。dont 代替 de，用在 parler de、avoir besoin de 這類說法。</p>
<div class="toolbar">
<a class="download" href="./relatifs.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的法語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>que 在母音前寫成 qu’。<br>主詞即使是物，也用 qui，不用 que：le livre qui est sur la table。</div>
<nav class="pager"><a href="../subjonctif/">← Subjonctif</a><a href="../ordre-pronoms/">Place des pronoms →</a></nav>
</main>
<footer>Pronoms relatifs · 法文 B1</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "qui、que", "meaning": "主詞與受詞", "rows": [["誰在說", "la femme qui parle", "正在說話的那位女士"], ["我讀的", "le livre que je lis", "我正在讀的書"], ["你看見的", "l’homme que tu as vu", "你看見的那位男士"], ["在桌上的", "le livre qui est sur la table", "在桌上的書"]], "examples": [["La femme qui parle est ma tante.", "正在說話的那位女士是我的阿姨。"], ["Le livre que je lis est à Marie.", "我正在讀的書是 Marie 的。"], ["L’homme que tu as vu est professeur.", "你看見的那位男士是老師。"], ["Le livre qui est sur la table est à moi.", "桌上的書是我的。"]]}, {"name": "où", "meaning": "地方、時間", "rows": [["我住的城市", "la ville où j’habite", "我住的城市"], ["我們见面的", "le café où nous nous sommes rencontrés", "我們見面的咖啡館"], ["那天", "le jour où je suis arrivé", "我到達的那天"], ["問", "l’endroit où", "那個地方"]], "examples": [["La ville où j’habite est calme.", "我住的城市很安靜。"], ["C’est le café où nous nous sommes rencontrés.", "這是我們見面的那家咖啡館。"], ["Je me souviens du jour où je suis arrivé.", "我記得我到達的那天。"], ["Montre-moi l’endroit où tu travailles.", "指給我看你工作的地方。"]]}, {"name": "dont", "meaning": "代替 de", "rows": [["你說的", "le film dont tu parles", "你說的那部電影"], ["我需要的", "le stylo dont j’ai besoin", "我需要的筆"], ["我認識家人的", "une amie dont je connais la famille", "我認識她家人的朋友"], ["你來自的", "la ville dont tu viens", "你來自的城市"]], "examples": [["Le film dont tu parles passe ce soir.", "你說的那部電影今晚上映。"], ["Voici le stylo dont j’ai besoin.", "這就是我需要的筆。"], ["C’est une amie dont je connais bien la famille.", "這是一位我很熟悉她家人的朋友。"], ["Taipei est la ville dont je viens.", "台北是我來自的城市。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="fr">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="fr">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放法語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="fr">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('fr'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
