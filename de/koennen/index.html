<header><div class="brand"><a href="../index.html">← 德文筆記</a>　/　Können</div></header>
<main>
<div class="intro">
<h1>德文 A1｜können 與 möchten</h1>
<p>können 是做得到。möchten 是想要，語氣比 wollen 客氣。兩個都把真正的動詞以原形放在句尾。</p>
<div class="toolbar">
<a class="download" href="./koennen.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的德語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>情態動詞自己變位，句尾動詞用原形：Ich kann Deutsch sprechen.<br>möchten 的完整形式是 möchte、möchtest、möchte、möchten、möchtet、möchten。</div>
<nav class="pager"><a href="../negation/">← Nicht und Kein</a><a href="../imperativ/">Imperativ →</a></nav>
</main>
<footer>Können · 德文 A1</footer>
<script id="lesson" type="application/json">{"cols": ["人稱", "形式", "中文"], "groups": [{"name": "können", "meaning": "做得到", "rows": [["ich", "ich kann", "我能"], ["du", "du kannst", "你能"], ["er / sie", "er kann", "他能"], ["wir", "wir können", "我們能"], ["ihr", "ihr könnt", "你們能"], ["sie / Sie", "sie können", "他們／您能"]], "examples": [["Ich kann schwimmen.", "我會游泳。"], ["Kannst du Deutsch sprechen?", "你會說德文嗎？"], ["Sie kann gut kochen.", "她很會煮飯。"], ["Wir können heute kommen.", "我們今天能來。"]]}, {"name": "möchten", "meaning": "想要，語氣客氣", "rows": [["ich", "ich möchte", "我想要"], ["du", "du möchtest", "你想要"], ["er / sie", "er möchte", "他想要"], ["Sie", "Was möchten Sie?", "您想要什麼？"]], "examples": [["Ich möchte einen Kaffee.", "我想要一杯咖啡。"], ["Möchtest du Wasser?", "你想喝水嗎？"], ["Er möchte nach Hause gehen.", "他想回家。"], ["Was möchten Sie trinken?", "您想喝什麼？"]]}, {"name": "句尾原形", "meaning": "第二個動詞不變化", "rows": [["說", "Ich kann Deutsch sprechen.", "我會說德文。"], ["讀", "Kannst du Deutsch lesen?", "你能讀德文嗎？"], ["來", "Sie können um acht kommen.", "您可以八點來。"], ["學習", "Ich möchte Deutsch lernen.", "我想學德文。"]], "examples": [["Ich kann heute nicht kommen.", "我今天不能來。"], ["Kannst du das Fenster öffnen?", "你能打開窗戶嗎？"], ["Wir möchten hier bleiben.", "我們想留在這裡。"], ["Sie kann sehr gut singen.", "她很會唱歌。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="de">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="de">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放德語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('de'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
