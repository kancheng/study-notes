<header><div class="brand"><a href="../index.html">← 英文筆記</a>　/　Dummy It</div></header>
<main>
<div class="intro">
<h1>英文 B2｜形式主詞與形式受詞 it</h1>
<p>真正的主詞太長時，先用 it 占位子，把 to V 或 that 子句放到後面。受詞也可以用 it 先占。</p>
<div class="toolbar">
<a class="download" href="./dummy-it.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的英語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>It is important to rest. 真正的主詞是 to rest。</div>
<nav class="pager"><a href="../gerund-or-infinitive/">← Gerund or Infinitive</a><a href="../agreement/">Agreement →</a></nav>
</main>
<footer>Dummy It · 英文 B2</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "形式主詞 to V", "meaning": "It is + 形容詞", "rows": [["重要", "It is important to rest.", "休息很重要。"], ["難", "It is hard to say.", "很難講。"], ["好", "It is good to see you.", "見到你很好。"], ["可能", "It is possible to finish.", "有可能做完。"]], "examples": [["It is important to rest.", "休息很重要。"], ["It is hard to say no.", "拒絕很難說。"], ["It is good to see you.", "見到你很好。"], ["It is possible to finish today.", "今天有可能做完。"]]}, {"name": "形式主詞 that", "meaning": "It is said that", "rows": [["據說", "It is said that", "據說"], ["清楚", "It is clear that", "很清楚"], ["真的", "It is true that", "的確"], ["可惜", "It is a pity that", "可惜"]], "examples": [["It is said that the test is easy.", "據說考試很簡單。"], ["It is clear that she is right.", "很清楚，她是對的。"], ["It is true that we need time.", "的確，我們需要時間。"], ["It is a pity that he cannot come.", "可惜他不能來。"]]}, {"name": "形式受詞", "meaning": "find / think it", "rows": [["覺得難", "find it hard to", "覺得……很難"], ["覺得有用", "find it useful to", "覺得……有用"], ["認為可能", "think it possible to", "認為……有可能"], ["使成", "make it clear that", "說清楚"]], "examples": [["I find it hard to get up early.", "我覺得早起很難。"], ["She finds it useful to take notes.", "她覺得做筆記有用。"], ["We think it possible to finish.", "我們認為有可能做完。"], ["Please make it clear that you will come.", "請說清楚你會來。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="en">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="en">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放英語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('en'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
