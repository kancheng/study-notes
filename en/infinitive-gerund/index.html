<main>
<div class="intro">
<h1>英文 A2｜to V 與 V-ing</h1>
<p>有些動詞後面接 to V，有些接 V-ing。這一課先記最常見的分組。</p>
<div class="toolbar">
<a class="download" href="./infinitive-gerund.pdf" download>下載完整 PDF</a>

</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>like 兩邊都可以：I like to read. 和 I like reading. 意思接近。enjoy 和 finish 只能接 V-ing。</div>

<footer>Infinitive and Gerund · 英文 A2</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "to V", "meaning": "want、decide、hope", "rows": [["想要", "want to go", "想去"], ["決定", "decide to stay", "決定留下"], ["希望", "hope to see", "希望見到"], ["需要", "need to rest", "需要休息"]], "examples": [["I want to go home.", "我想回家。"], ["She decided to stay.", "她決定留下。"], ["We hope to see you.", "我們希望見到你。"], ["He needs to rest.", "他需要休息。"]]}, {"name": "V-ing", "meaning": "enjoy、finish、practice", "rows": [["享受", "enjoy reading", "享受閱讀"], ["做完", "finish doing", "做完"], ["練習", "practice speaking", "練習說"], ["考慮", "consider joining", "考慮加入"]], "examples": [["I enjoy reading.", "我享受閱讀。"], ["She finished doing her homework.", "她把作業做完了。"], ["We practice speaking English.", "我們練習說英文。"], ["He is considering joining the club.", "他正在考慮加入社團。"]]}, {"name": "like", "meaning": "兩邊都可以", "rows": [["to V", "like to swim", "喜歡游泳"], ["V-ing", "like swimming", "喜歡游泳"], ["to V", "love to cook", "喜愛下廚"], ["V-ing", "love cooking", "喜愛下廚"]], "examples": [["I like to swim.", "我喜歡游泳。"], ["I like swimming.", "我喜歡游泳。"], ["She loves to cook.", "她喜愛下廚。"], ["She loves cooking.", "她喜愛下廚。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="en">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="en">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放英語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('en'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
