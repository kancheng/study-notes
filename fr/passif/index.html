<body>
<header><div class="brand"><a href="../index.html">← 法文筆記</a>　/　Voix passive</div></header>
<main>
<div class="intro">
<h1>法文 B2｜被動</h1>
<p>被動把承受動作的人或物放到主詞。用 être 的各種時態，加上過去分詞，分詞配合主詞。動作的做出者用 par。</p>
<div class="toolbar">
<a class="download" href="./passif.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的法語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>時態落在 être 上：est écrit、a été écrit、sera annoncé。<br>不需要說出是誰做的時候，也可以用 on：On parle français ici.</div>
<nav class="pager"><a href="../conditionnel-passe/">← Conditionnel passé</a><a href="../discours/">Discours indirect →</a></nav>
</main>
<footer>Voix passive · 法文 B2</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "現在與複合", "meaning": "est、a été", "rows": [["被寫", "a été écrit", "被寫成"], ["被關上", "a été fermée", "被關上"], ["被送出", "ont été envoyées", "被寄出"], ["開著", "est ouverte", "是開著的"]], "examples": [["Ce roman a été écrit en 1990.", "這本小說寫於 1990 年。"], ["La porte a été fermée par le gardien.", "門被管理員關上了。"], ["Les invitations ont été envoyées hier.", "邀請函昨天寄出了。"], ["La fenêtre est ouverte.", "窗戶是開著的。"]]}, {"name": "將來與必須", "meaning": "sera、doit être", "rows": [["將被公布", "seront annoncés", "將被公布"], ["必須被簽", "doit être signé", "必須簽名"], ["將被修好", "sera réparé", "將被修好"], ["被邀請", "ont été invités", "被邀請了"]], "examples": [["Les résultats seront annoncés demain.", "結果明天會公布。"], ["Ce document doit être signé.", "這份文件必須簽名。"], ["L’ascenseur sera réparé ce soir.", "電梯今晚會修好。"], ["Nous avons été invités à la réunion.", "我們被邀請參加會議。"]]}, {"name": "on", "meaning": "不說出是誰", "rows": [["有人說法文", "on parle français", "這裡說法文"], ["有人建", "on construit", "正在興建"], ["有人說", "on dit que", "據說"], ["有人問", "on m’a demandé", "有人問我"]], "examples": [["On parle français dans cette classe.", "這堂課說法文。"], ["On construit un pont près de la gare.", "火車站附近正在建一座橋。"], ["On dit que le musée est fermé le lundi.", "據說博物館星期一休館。"], ["On m’a demandé d’arriver tôt.", "有人要求我早到。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="fr">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="fr">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放法語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="fr">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('fr'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
