<h1>日文 N2｜ものだ、べき、ことになっている</h1>
<p>ものだ用來說一般的道理或社會上該有的樣子。べき是「應該」。ことになっている是已經定下來的規定，不是說話的人臨時決定的。</p>
<div class="toolbar">
<a class="download" href="./monoda.pdf" download>下載完整 PDF</a>

</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>

"rows": [["上課不用手機", "授業中は、携帯電話を使わないことになっています。", "じゅぎょうちゅう は、 けいたいでんわ を つかわない こと に なって います。", "Jugyouchuu wa, keitaidenwa o tsukawanai koto ni natte imasu."], ["這裡不拍照", "ここでは、写真を撮らないことになっています。", "ここ で は、 しゃしん を とらない こと に なって います。", "Koko de wa, shashin o toranai koto ni natte imasu."], ["九點開始", "会議は九時に始まることになっています。", "かいぎ は くじ に はじまる こと に なって います。", "Kaigi wa kuji ni hajimaru koto ni natte imasu."], ["要申請", "参加する人は、前の週に申し込むことになっています。", "さんか する ひと は、 まえ の しゅう に もうしこむ こと に なって います。", "Sanka suru hito wa, mae no shuu ni moushikomu koto ni natte imasu."]], "examples": [["この寮では、夜十一時に門が閉まることになっています。", "この りょう で は、 よる じゅういちじ に もん が しまる こと に なって います。", "Kono ryou de wa, yoru juuichiji ni mon ga shimaru koto ni natte imasu.", "這間宿舍規定晚上十一點關門。"], ["図書館では、大きな声で話さないことになっています。", "としょかん で は、 おおきな こえ で はなさない こと に なって います。", "Toshokan de wa, ookina koe de hanasanai koto ni natte imasu.", "圖書館規定不大聲說話。"], ["レポートは金曜日までに出すことになっています。", "レポート は きんようび まで に だす こと に なって います。", "Repooto wa kin'youbi made ni dasu koto ni natte imasu.", "報告規定要在星期五之前交出。"], ["非常口の前に物を置かないことになっています。", "ひじょうぐち の まえ に もの を おかない こと に なって います。", "Hijouguchi no mae ni mono o okanai koto ni natte imasu.", "規定緊急出口前面不能放東西。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
