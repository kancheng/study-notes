<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="日文 A1 必背：です、あります／います、と言います 的說法、例句、中文翻譯與發音。">
<title>こんにちは 動詞｜日文 A1 三種說法</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#182a45;background:#f3f6fb}
*{box-sizing:border-box}
body{margin:0}
header{background:#132f55;color:white;padding:22px max(20px,calc((100vw - 1050px)/2))}
header .brand{font-size:1.35rem;font-weight:800;letter-spacing:.02em}
header a{color:inherit;text-decoration:none}
main{max-width:1050px;margin:auto;padding:32px 20px 70px}
h1{font-size:clamp(1.8rem,4vw,2.65rem);margin:0 0 8px}
h2{font-size:1.55rem;margin:0}
p{line-height:1.7}
.intro{margin-bottom:24px}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 28px}
.download,button{cursor:pointer;border:0;border-radius:9px;font:inherit}
.download{display:inline-block;background:#df3349;color:white;padding:12px 18px;text-decoration:none;font-weight:700}
.download:hover{background:#b91f35}
.note{font-size:.92rem;color:#52647d}
.card{background:white;border:1px solid #dce4f0;border-radius:16px;box-shadow:0 8px 24px #142f5210;margin:20px 0;padding:23px}
.cardhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.meaning{color:#52647d}
.tablewrap{overflow-x:auto;margin-top:18px}
table{border-collapse:collapse;width:100%;min-width:720px;text-align:left}
th{background:#eaf0f9;font-size:.9rem}
th,td{padding:13px 14px;border-bottom:1px solid #e4e9f1}
td:nth-child(2){font-weight:750;color:#173e71}
.examples{margin-top:22px}
.examples h3{font-size:1.07rem;margin:0 0 10px}
.example{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #edf0f5}
.line{font-size:1.03rem;font-weight:700}
.zh{color:#53637b;margin-top:3px}
.speak{background:#e7f0fd;color:#163b6a;padding:9px 12px;min-width:84px}
.speak:hover,.speak:focus-visible{background:#cedffa;outline:2px solid #3769a9;outline-offset:2px}
.tip{background:#e9eff8;border-left:4px solid #5276aa;padding:14px 18px;border-radius:8px;margin-top:20px}
footer{max-width:1050px;margin:auto;padding:20px;color:#627087;font-size:.9rem}
@media(max-width:600px){main{padding-top:25px}.card{padding:17px}}
</style>
</head>
<body>
<header><div class="brand"><a href="../../index.html">← 四語筆記首頁</a>　/　こんにちは 動詞</div></header>
<main>
<div class="intro">
<h1>日文 A1｜三種必背說法</h1>
<p>日文丁寧體不隨人稱變化，下面仍用六組人稱對照，方便和英、法、德一起記：<strong>です</strong>（是）、<strong>あります／います</strong>（有）、<strong>と言います</strong>（叫做）。先看表，再按例句旁的播放鍵跟讀。</p>
<div class="toolbar">
<a class="download" href="./Konnichiwa-Doushi-A1.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>です、あります、います、と言います都不隨人稱變化。東西用 <strong>あります</strong>，人用 <strong>います</strong>。年齡用 です：<em>私は 25 才です。</em>（我 25 歲。）問名字用 <em>お名前は何ですか。</em></div>
</main>
<footer>こんにちは 動詞 · 日語入門說法與跟讀小抄</footer>
<script>
const LANG = 'ja-JP';
const groups = [
  {
    name: 'です',
    meaning: '是',
    rows: [
      ['私', '私は〜です', '我是'],
      ['あなた', 'あなたは〜です', '你是'],
      ['彼／彼女', '彼は／彼女は〜です', '他／她是'],
      ['私たち', '私たちは〜です', '我們是'],
      ['あなた', 'あなたは〜です', '您是'],
      ['彼ら／彼女たち', '彼らは／彼女たちは〜です', '他們／她們是']
    ],
    examples: [
      ['私は学生です。', '我是學生。'],
      ['準備はいいですか。', '你準備好了嗎？'],
      ['彼女はフランス人です。', '她是法國人。'],
      ['私は 25 才です。', '我 25 歲。'],
      ['先生ですか。', '您是老師嗎？'],
      ['彼らは学生です。', '他們是學生。']
    ]
  },
  {
    name: 'あります／います',
    meaning: '有；東西與人不同',
    rows: [
      ['私', '（私は）〜があります', '我有'],
      ['あなた', '（あなたは）〜があります', '你有'],
      ['彼／彼女', '（彼は／彼女は）〜があります', '他／她有'],
      ['私たち', '（私たちは）〜があります', '我們有'],
      ['あなた', '（あなたは）〜があります', '您有'],
      ['彼ら／彼女たち', '（彼らは／彼女たちは）〜があります', '他們／她們有']
    ],
    examples: [
      ['本があります。', '我有一本書。'],
      ['ペンはありますか。', '你有筆嗎？'],
      ['彼には兄弟がいます。', '他有一個兄弟。'],
      ['授業があります。', '我們有一堂課。'],
      ['質問はありますか。', '您有問題嗎？'],
      ['彼女たちには友達がいます。', '她們有朋友。']
    ]
  },
  {
    name: 'と言います',
    meaning: '叫做／名字是',
    rows: [
      ['私', '私は〜と言います', '我叫'],
      ['あなた', 'あなたは〜と言います', '你叫'],
      ['彼／彼女', '彼は／彼女は〜と言います', '他／她叫'],
      ['私たち', '私たちは〜と言います', '我們叫'],
      ['あなた', 'あなたは〜と言います', '您叫'],
      ['彼ら／彼女たち', '彼らは／彼女たちは〜と言います', '他們／她們叫']
    ],
    examples: [
      ['私は Hao-Cheng と言います。', '我叫 Hao-Cheng。'],
      ['名前は何ですか。', '你叫什麼名字？'],
      ['彼女は Marie と言います。', '她叫 Marie。'],
      ['私たちは青組と言います。', '我們叫做「藍隊」。'],
      ['お名前は何ですか。', '您叫什麼名字？'],
      ['彼らは Paul と Marc と言います。', '他們叫 Paul 和 Marc。']
    ]
  }
];
const esc = s => s.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
document.querySelector('#content').innerHTML = groups.map(g => `<section class="card"><div class="cardhead"><h2 lang="ja">${esc(g.name)}</h2><span class="meaning">${esc(g.meaning)}</span></div><div class="tablewrap"><table><thead><tr><th scope="col">人稱</th><th scope="col">說法</th><th scope="col">中文</th></tr></thead><tbody>${g.rows.map(r => `<tr><td lang="ja">${esc(r[0])}</td><td lang="ja">${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>${g.examples.map(([line, zh]) => `<div class="example"><div><div class="line" lang="ja">${esc(line)}</div><div class="zh">${esc(zh)}</div></div><button class="speak" type="button" data-say="${esc(line)}" aria-label="播放日語：${esc(line)}">▶ 播放</button></div>`).join('')}</div></section>`).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LANG;
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_', '-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
</body>
</html>
