<body>
<header><div class="brand"><a href="../index.html">← 德文筆記</a>　/　Partizip</div></header>
<main>
<div class="intro">
<h1>德文 B2｜分詞當形容詞</h1>
<p>Partizip I 表示主動、同時發生。Partizip II 表示被動、已經完成。分詞放在名詞前面，詞尾和形容詞一樣。</p>
<div class="toolbar">
<a class="download" href="./partizip.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的德語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>der wartende Gast：正在等的客人。die geschlossene Tür：已經關上的門。<br>擴展時，整段都放在冠詞和名詞中間：das gestern gekaufte Buch。</div>
<nav class="pager"><a href="../nominalisierung/">← Nominalisierung</a><a href="../je-desto/">Je und Sodass →</a></nav>
</main>
<footer>Partizip · 德文 B2</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "Partizip I", "meaning": "正在做的", "rows": [["等待", "der wartende Gast", "正在等的客人"], ["笑", "ein lachendes Kind", "一個正在笑的孩子"], ["讀", "die lesenden Studenten", "正在讀的學生們"], ["詞尾", "像形容詞", "der -e，ein -es，複數 -en"]], "examples": [["Der wartende Gast wird ungeduldig.", "正在等的客人變得不耐煩。"], ["Ein lachendes Kind kam herein.", "一個笑著的孩子走了進來。"], ["Die lesenden Studenten sind leise.", "正在讀書的學生們很安靜。"], ["Ich sehe einen schlafenden Hund.", "我看見一隻在睡覺的狗。"]]}, {"name": "Partizip II", "meaning": "已經完成的", "rows": [["關上", "die geschlossene Tür", "關上的門"], ["寫好", "der geschriebene Text", "寫好的課文"], ["打開", "ein geöffnetes Fenster", "一扇開著的窗"], ["詞尾", "像形容詞", "不是句尾的過去分詞"]], "examples": [["Die geschlossene Tür ist alt.", "那扇關上的門很舊。"], ["Der geschriebene Text liegt auf dem Tisch.", "寫好的課文放在桌上。"], ["Durch ein geöffnetes Fenster kommt Luft herein.", "空氣從一扇開著的窗戶進來。"], ["Die korrigierten Aufgaben sind hier.", "改好的作業在這裡。"]]}, {"name": "擴展", "meaning": "冠詞和名詞中間可以放一段", "rows": [["昨天買的", "das gestern gekaufte Buch", "昨天買的書"], ["坐在窗邊的", "der am Fenster sitzende Mann", "坐在窗邊的男人"], ["我們討論過的", "die von uns besprochene Frage", "我們討論過的問題"], ["改回子句", "das Buch, das ich gestern gekauft habe", "我昨天買的書"]], "examples": [["Das gestern gekaufte Buch liegt hier.", "昨天買的書放在這裡。"], ["Der am Fenster sitzende Mann liest Zeitung.", "坐在窗邊的男人在讀報。"], ["Die von uns besprochene Frage ist wichtig.", "我們討論過的問題很重要。"], ["Das Buch, das ich gestern gekauft habe, ist teuer.", "我昨天買的那本書很貴。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="de">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="de">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放德語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('de'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
