<p>qui、que／qu’est-ce que、quand、où、pourquoi、comment 是常見的疑問詞，用來組成問句。</p>
<div class="toolbar">
<a class="download" href="./interrogatifs.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的法語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>問「什麼」當受詞時，口語常用 Qu’est-ce que… ?<br>qui 可當主詞：Qui vient ? 動詞要配合第三人稱。</div>

</main>
<footer>Interrogatifs · 法文 A1</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "疑問詞", "meaning": "六個常用詞", "rows": [["誰", "qui", "誰"], ["什麼", "que / qu’est-ce que", "什麼"], ["何時", "quand", "什麼時候"], ["哪裡", "où", "哪裡"], ["為什麼", "pourquoi", "為什麼"], ["如何", "comment", "怎麼／如何"]], "examples": [["Qui vient ?", "誰要來？"], ["Qu’est-ce que tu étudies ?", "你在學什麼？"], ["Quand commence le cours ?", "課幾點開始？"], ["Où habites-tu ?", "你住哪裡？"]]}, {"name": "人與事物", "meaning": "qui / que", "rows": [["誰來", "Qui vient ?", "誰要來？"], ["學什麼", "Qu’est-ce que tu étudies ?", "你在學什麼？"], ["那是什麼", "Qu’est-ce que c’est ?", "這是什麼？"], ["誰教", "Qui t’enseigne ?", "誰教你？"]], "examples": [["Qui vient ?", "誰要來？"], ["Qu’est-ce que tu étudies ?", "你在學什麼？"], ["Qu’est-ce que c’est ?", "這是什麼？"], ["Qui enseigne l’anglais ?", "誰教英文？"]]}, {"name": "時間、地方、原因、方式", "meaning": "quand / où / pourquoi / comment", "rows": [["何時開始", "Quand commence le cours ?", "課幾點開始？"], ["住哪裡", "Où habites-tu ?", "你住哪裡？"], ["為什麼學", "Pourquoi apprends-tu l’anglais ?", "你為什麼學英文？"], ["怎麼練習", "Comment est-ce que tu t’entraînes ?", "你怎麼練習？"]], "examples": [["Quand commence le cours ?", "課幾點開始？"], ["Où habites-tu ?", "你住哪裡？"], ["Pourquoi apprends-tu l’anglais ?", "你為什麼學英文？"], ["Comment est-ce que tu t’entraînes ?", "你怎麼練習？"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="fr">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="fr">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放法語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="fr">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('fr'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
