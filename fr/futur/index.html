<style>

<header><div class="brand"><a href="../index.html">← 法文筆記</a>　/　Futur</div></header>
<main>
<div class="intro">
<h1>法文 A2｜將來</h1>
<p>即將發生用 aller 加原形。較遠或書面的將來用簡單將來式，詞尾是 -ai、-as、-a、-ons、-ez、-ont。venir de 加原形表示剛剛做完。</p>
<div class="toolbar">
<a class="download" href="./futur.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的法語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>être 的將來是 je serai。avoir 是 j’aurai。aller 是 j’irai。faire 是 je ferai。venir 是 je viendrai。<br>簡單將來的詞尾都要發音，和條件式的 -ais 不同。</div>
<nav class="pager"><a href="../imparfait/">← Imparfait</a><a href="../comparatif/">Comparatif →</a></nav>
</main>
<footer>Futur · 法文 A2</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "aller + 原形", "meaning": "即將", "rows": [["要走", "je vais partir", "我要走了"], ["要吃", "nous allons manger", "我們要吃了"], ["要看", "elle va regarder", "她要看"], ["問", "tu vas venir ?", "你要來嗎？"]], "examples": [["Je vais partir dans dix minutes.", "我十分鐘後要走。"], ["Nous allons manger bientôt.", "我們快要吃飯了。"], ["Elle va regarder ce film.", "她要看這部電影。"], ["Tu vas venir avec nous ?", "你要跟我們一起來嗎？"]]}, {"name": "簡單將來", "meaning": "詞尾 -ai、-as、-a", "rows": [["工作", "je travaillerai", "我將會工作"], ["去", "nous irons", "我們將會去"], ["來", "elle viendra", "她將會來"], ["是", "je serai", "我將會是"]], "examples": [["Demain, je travaillerai.", "我明天會工作。"], ["L’année prochaine, nous irons en France.", "明年我們會去法國。"], ["Elle viendra à huit heures.", "她會在八點來。"], ["Je serai à la gare à midi.", "我正午會在火車站。"]]}, {"name": "venir de", "meaning": "剛剛", "rows": [["剛吃完", "je viens de manger", "我剛吃完"], ["剛離開", "il vient de partir", "他剛離開"], ["剛到", "nous venons d’arriver", "我們剛到"], ["問", "tu viens de finir ?", "你剛做完嗎？"]], "examples": [["Je viens de manger.", "我剛吃完。"], ["Il vient de partir.", "他剛離開。"], ["Nous venons d’arriver.", "我們剛到。"], ["Tu viens de finir ?", "你剛做完嗎？"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="fr">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="fr">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放法語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="fr">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('fr'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
