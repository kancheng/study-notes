<header><div class="brand"><a href="../index.html">← 英文筆記</a>　/　Which Clause</div></header>
<main>
<div class="intro">
<h1>英文 B2｜逗號後的 which</h1>
<p>逗號後面的 who 或 which 是補上額外資訊，拿掉整句仍然知道在說誰。which 也可以指前面整件事。</p>
<div class="toolbar">
<a class="download" href="./which-clause.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的英語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>這種句子不用 that。My brother, who lives in Taipei, is a doctor.</div>
<nav class="pager"><a href="../reported-speech/">← Reported Speech</a><a href="../third-conditional/">Third Conditional →</a></nav>
</main>
<footer>Which Clause · 英文 B2</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "who，補充人", "meaning": "逗號隔開", "rows": [["弟弟", "my brother, who lives in Taipei", "我住台北的弟弟"], ["老師", "Ms. Lin, who teaches us", "教我們的林老師"], ["Marie", "Marie, who called", "打來的 Marie"], ["父親", "my father, who is a doctor", "我那當醫生的父親"]], "examples": [["My brother, who lives in Taipei, is a doctor.", "我弟弟住在台北，他是醫生。"], ["Ms. Lin, who teaches us, is kind.", "林老師教我們，她很親切。"], ["Marie, who called last night, is my friend.", "Marie 昨晚打來，她是我的朋友。"], ["My father, who is a doctor, works late.", "我父親是醫生，他工作到很晚。"]]}, {"name": "which，補充事物", "meaning": "逗號隔開", "rows": [["書", "the book, which I bought", "那本書，我買的"], ["城市", "Taipei, which is big", "台北，它很大"], ["考試", "the test, which was hard", "那場考試，它很難"], ["店", "the shop, which is new", "那家店，它是新的"]], "examples": [["This book, which I bought yesterday, is useful.", "這本書是我昨天買的，它很有用。"], ["Taipei, which is a big city, is my home.", "台北是個大城市，它是我家。"], ["The test, which was hard, is over.", "那場考試很難，它結束了。"], ["The shop, which is new, sells tea.", "那家店是新的，它賣茶。"]]}, {"name": "which 指整句", "meaning": "前面那件事", "rows": [["贏了", "which surprised us", "這讓我們驚訝"], ["遲到", "which made her angry", "這讓她生氣"], ["下雨", "which was a problem", "這是個問題"], ["幫忙", "which was kind", "這很貼心"]], "examples": [["The team won, which surprised us.", "隊伍贏了，這讓我們很驚訝。"], ["He was late, which made her angry.", "他遲到了，這讓她生氣。"], ["It rained all day, which was a problem.", "雨下了一整天，這是個問題。"], ["She waited for me, which was kind.", "她等我，這很貼心。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="en">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="en">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放英語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('en'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
