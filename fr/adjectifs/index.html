<div class="intro">
<h1>法文 A1｜形容詞</h1>
<p>形容詞要配合名詞的性和數。多數形容詞放在名詞後面。少數常見的放在前面，其中 beau、nouveau、vieux 在母音前要改形。</p>
<div class="toolbar">
<a class="download" href="./adjectifs.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的法語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>放在名詞前的常見形容詞有 beau、bon、grand、jeune、joli、petit、vieux、nouveau。<br>陽性和母音名詞之間：beau → bel，nouveau → nouvel，vieux → vieil。</div>
<nav class="pager"><a href="../articles/">← Articles</a><a href="../negation/">Négation →</a></nav>
</main>
<footer>Adjectifs · 法文 A1</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "性與數", "meaning": "跟著名詞變", "rows": [["陽", "grand", "高"], ["陰", "grande", "高"], ["陽複", "intéressants", "有趣"], ["陰複", "intéressantes", "有趣"]], "examples": [["Paul est grand.", "Paul 個子高。"], ["Marie est grande.", "Marie 個子高。"], ["Ces livres sont intéressants.", "這些書很有趣。"], ["Ces questions sont intéressantes.", "這些問題很有趣。"]]}, {"name": "位置", "meaning": "前與後", "rows": [["前面", "une petite maison", "一間小房子"], ["後面", "une robe rouge", "一件紅洋裝"], ["好", "un bon café", "一杯好咖啡"], ["年輕", "une jeune femme", "一位年輕女子"]], "examples": [["J’habite une petite maison.", "我住一間小房子。"], ["Elle porte une robe rouge.", "她穿一件紅洋裝。"], ["C’est un bon café.", "這是一杯好咖啡。"], ["Marc est un jeune homme.", "Marc 是一位年輕人。"]]}, {"name": "母音前", "meaning": "bel、nouvel、vieil", "rows": [["美", "un bel appartement", "一間漂亮的公寓"], ["新", "un nouvel ami", "一位新朋友"], ["老", "un vieil ami", "一位老朋友"], ["陰", "une belle ville", "一座漂亮的城市"]], "examples": [["C’est un bel appartement.", "這是一間漂亮的公寓。"], ["J’ai un nouvel ami.", "我有一位新朋友。"], ["Paul est un vieil ami.", "Paul 是一位老朋友。"], ["Taipei est une belle ville.", "台北是一座漂亮的城市。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="fr">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="fr">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放法語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="fr">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('fr'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
