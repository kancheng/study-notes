<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#182a45;background:#f3f6fb}
*{box-sizing:border-box}
body{margin:0}
header{background:#17355d;color:white;padding:22px max(20px,calc((100vw - 1050px)/2))}
header .brand{font-size:1.35rem;font-weight:800}
header a{color:inherit;text-decoration:none}
main{max-width:1050px;margin:auto;padding:32px 20px 70px}
h1{font-size:clamp(1.8rem,4vw,2.65rem);margin:0 0 8px}
h2{font-size:1.55rem;margin:0}
p{line-height:1.7}
.intro{margin-bottom:24px}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 28px}
.download,button{cursor:pointer;border:0;border-radius:9px;font:inherit}
.download{display:inline-block;background:#17355d;color:white;padding:12px 18px;text-decoration:none;font-weight:700}
.download:hover{background:#0f2442}
.note{font-size:.92rem;color:#52647d}
.card{background:white;border:1px solid #dce4f0;border-radius:16px;box-shadow:0 8px 24px #142f5210;margin:20px 0;padding:23px}

.zh{color:#53637b;margin-top:3px}

.speak:hover,.speak:focus-visible{background:#d5deeb;outline:2px solid #17355d;outline-offset:2px}

<body>
<header><div class="brand"><a href="../index.html">← 英文筆記</a>　/　Reduced Relative</div></header>
<main>
<div class="intro">
<h1>英文 B2｜關係子句省略</h1>
<p>關係子句如果是 who is 或 which is，可以把代名詞和 be 拿掉，只留分詞或介系詞片語。介系詞也可以放到 which 前面。</p>
<div class="toolbar">
<a class="download" href="./reduced-relative.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的英語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>The man who is standing there 可以寫成 The man standing there.</div>
<nav class="pager"><a href="../cleft/">← Cleft Sentences</a><a href="../parallelism/">Parallelism →</a></nav>
</main>
<footer>Reduced Relative · 英文 B2</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "V-ing", "meaning": "拿掉 who is", "rows": [["站著", "the man standing there", "站在那裡的男人"], ["住", "the students living here", "住在這裡的學生"], ["等", "the bus coming now", "現在來的公車"], ["哭", "the girl crying", "正在哭的女孩"]], "examples": [["The man standing there is my uncle.", "站在那裡的男人是我叔叔。"], ["The students living here are new.", "住在這裡的學生是新來的。"], ["The bus coming now is late.", "現在來的這班公車是晚的。"], ["The girl crying is Marie.", "正在哭的女孩是 Marie。"]]}, {"name": "過去分詞", "meaning": "拿掉 which was", "rows": [["寫的", "the book written by her", "她寫的書"], ["蓋的", "the school built in 1990", "1990 年蓋的學校"], ["用的", "the language used here", "這裡使用的語言"], ["邀請的", "the students invited", "被邀請的學生"]], "examples": [["The book written by her is new.", "她寫的那本書是新的。"], ["The school built in 1990 is still used.", "1990 年蓋的那所學校仍在使用。"], ["English is the language used here.", "英文是這裡使用的語言。"], ["The students invited yesterday came.", "昨天被邀請的學生來了。"]]}, {"name": "介系詞提前", "meaning": "in which、to whom", "rows": [["住在", "the city in which I live", "我住的城市"], ["談到", "the man to whom I spoke", "我交談的男人"], ["用", "the pen with which she wrote", "她用來寫的筆"], ["來自", "the club of which he is a member", "他所屬的社團"]], "examples": [["Taipei is the city in which I live.", "台北是我住的城市。"], ["He is the man to whom I spoke.", "他就是我和他說話的那個人。"], ["This is the pen with which she wrote.", "這是她用來寫字的筆。"], ["That is the club of which he is a member.", "那是他所屬的社團。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="en">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="en">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放英語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('en'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
