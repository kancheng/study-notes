<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#182a45;background:#f3f6fb}
*{box-sizing:border-box}
body{margin:0}
header{background:#1d6a4f;color:white;padding:22px max(20px,calc((100vw - 1050px)/2))}
header .brand{font-size:1.35rem;font-weight:800}
header a{color:inherit;text-decoration:none}
main{max-width:1050px;margin:auto;padding:32px 20px 70px}
h1{font-size:clamp(1.8rem,4vw,2.65rem);margin:0 0 8px}
h2{font-size:1.55rem;margin:0}
p{line-height:1.7}
.intro{margin-bottom:24px}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 28px}
.download,button{cursor:pointer;border:0;border-radius:9px;font:inherit}
.download{display:inline-block;background:#1d6a4f;color:white;padding:12px 18px;text-decoration:none;font-weight:700}
.download:hover{background:#124936}
.note{font-size:.92rem;color:#52647d}
.card{background:white;border:1px solid #dce4f0;border-radius:16px;box-shadow:0 8px 24px #142f5210;margin:20px 0;padding:23px}

.speak:hover,.speak:focus-visible{background:#cfe8dc;outline:2px solid #1d6a4f;outline-offset:2px}

<header><div class="brand"><a href="../index.html">← 德文筆記</a>　/　Akkusativ</div></header>
<main>
<div class="intro">
<h1>德文 A1｜受格</h1>
<p>動詞的直接受詞用受格。只有陽性單數的冠詞會變：der 變成 den，ein 變成 einen。</p>
<div class="toolbar">
<a class="download" href="./akkusativ.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的德語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>陰性、中性和複數的受格冠詞看起來和主格一樣。<br>真正會變的是陽性單數：den Mann，einen Kaffee。</div>
<nav class="pager"><a href="../plural/">← Plural</a><a href="../possessiv/">Possessiv →</a></nav>
</main>
<footer>Akkusativ · 德文 A1</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "冠詞", "meaning": "只有陽性單數改變", "rows": [["陽性", "den Mann / einen Kaffee", "這個男人／一杯咖啡"], ["陰性", "die Frau / eine Lampe", "這個女人／一盞燈"], ["中性", "das Buch / ein Buch", "這本書／一本書"], ["複數", "die Bücher", "這些書"]], "examples": [["Ich sehe den Mann.", "我看見那個男人。"], ["Sie kauft einen Kaffee.", "她買一杯咖啡。"], ["Wir lesen das Buch.", "我們讀這本書。"], ["Er braucht die Bücher.", "他需要這些書。"]]}, {"name": "人稱代名詞", "meaning": "動詞後面的人", "rows": [["我", "mich", "我"], ["你", "dich", "你"], ["他／她／它", "ihn / sie / es", "他／她／它"], ["我們／你們", "uns / euch", "我們／你們"], ["他們／您", "sie / Sie", "他們／您"]], "examples": [["Sie kennt mich.", "她認識我。"], ["Ich sehe dich.", "我看見你。"], ["Wir besuchen ihn morgen.", "我們明天去看他。"], ["Kennt ihr uns?", "你們認識我們嗎？"]]}, {"name": "es gibt", "meaning": "有，後面用受格", "rows": [["陽性", "es gibt einen Park", "有一座公園"], ["陰性", "es gibt eine Bäckerei", "有一家麵包店"], ["中性", "es gibt ein Kino", "有一家電影院"], ["疑問", "Gibt es hier einen Supermarkt?", "這裡有超市嗎？"]], "examples": [["Es gibt einen Park in der Nähe.", "附近有一座公園。"], ["Es gibt eine Bäckerei um die Ecke.", "轉角有一家麵包店。"], ["Gibt es hier ein Café?", "這裡有咖啡館嗎？"], ["Es gibt heute einen Kurs.", "今天有一堂課。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="de">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="de">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放德語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('de'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
