<header><div class="brand"><a href="../index.html">← 英文筆記</a>　/　Can</div></header>
<main>
<div class="intro">
<h1>英文 A1｜can</h1>
<p>can 表示做得到。後面直接接原形動詞，不隨人稱變化。</p>
<div class="toolbar">
<a class="download" href="./can.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的英語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>口語常把 cannot 縮成 can&#x27;t。問句把 can 放到主詞前面。</div>

<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "can", "meaning": "做得到", "rows": [["我", "I can swim", "我會游泳"], ["你", "you can help", "你能幫忙"], ["她", "she can drive", "她會開車"], ["他們", "they can come", "他們能來"]], "examples": [["I can swim.", "我會游泳。"], ["You can help me.", "你能幫我。"], ["She can drive.", "她會開車。"], ["They can come today.", "他們今天能來。"]]}, {"name": "can't", "meaning": "做不到", "rows": [["我", "I can't drive", "我不會開車"], ["他", "he can't swim", "他不會游泳"], ["我們", "we can't stay", "我們不能留下"], ["她", "she can't come", "她不能來"]], "examples": [["I can't drive.", "我不會開車。"], ["He can't swim.", "他不會游泳。"], ["We can't stay long.", "我們不能留很久。"], ["She can't come tonight.", "她今晚不能來。"]]}, {"name": "疑問", "meaning": "Can + 主詞", "rows": [["你", "Can you swim?", "你會游泳嗎？"], ["他", "Can he help?", "他能幫忙嗎？"], ["她", "Can she drive?", "她會開車嗎？"], ["他們", "Can they come?", "他們能來嗎？"]], "examples": [["Can you swim?", "你會游泳嗎？"], ["Can he help me?", "他能幫我嗎？"], ["Can she drive?", "她會開車嗎？"], ["Can they come tomorrow?", "他們明天能來嗎？"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="en">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="en">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放英語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('en'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
