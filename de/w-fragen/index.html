<h1>德文 A1｜W 疑問詞</h1>
<p>wer、was、wann、wo、warum、wie 是常見的 W 疑問詞。疑問詞放在第一位，動詞緊接在後。</p>
<div class="toolbar">
<a class="download" href="./w-fragen.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的德語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>德文問句裡，疑問詞後面立刻是變位動詞：Wo wohnst du?<br>問「去哪裡」用 wohin，問「從哪裡來」用 woher。</div>
<nav class="pager"><a href="../fragen/">← Fragen</a><a href="../artikel/">Artikel →</a></nav>
</main>
<footer>W-Fragen · 德文 A1</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "疑問詞", "meaning": "六個常用詞", "rows": [["誰", "wer", "誰"], ["什麼", "was", "什麼"], ["何時", "wann", "什麼時候"], ["哪裡", "wo", "哪裡"], ["為什麼", "warum", "為什麼"], ["如何", "wie", "怎麼／如何"]], "examples": [["Wer kommt?", "誰要來？"], ["Was lernst du?", "你在學什麼？"], ["Wann beginnt der Unterricht?", "課幾點開始？"], ["Wo wohnst du?", "你住哪裡？"]]}, {"name": "人與事物", "meaning": "wer / was", "rows": [["誰來", "Wer kommt?", "誰要來？"], ["學什麼", "Was lernst du?", "你在學什麼？"], ["那是什麼", "Was ist das?", "這是什麼？"], ["誰教", "Wer unterrichtet dich?", "誰教你？"]], "examples": [["Wer kommt?", "誰要來？"], ["Was lernst du?", "你在學什麼？"], ["Was ist das?", "這是什麼？"], ["Wer unterrichtet Englisch?", "誰教英文？"]]}, {"name": "時間、地方、原因、方式", "meaning": "wann / wo / warum / wie", "rows": [["何時開始", "Wann beginnt der Unterricht?", "課幾點開始？"], ["住哪裡", "Wo wohnst du?", "你住哪裡？"], ["為什麼學", "Warum lernst du Englisch?", "你為什麼學英文？"], ["怎麼練習", "Wie übst du?", "你怎麼練習？"]], "examples": [["Wann beginnt der Unterricht?", "課幾點開始？"], ["Wo wohnst du?", "你住哪裡？"], ["Warum lernst du Englisch?", "你為什麼學英文？"], ["Wie übst du?", "你怎麼練習？"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="de">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="de">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放德語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('de'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
