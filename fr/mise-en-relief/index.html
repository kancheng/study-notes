<main>
<div class="intro">
<h1>法文 B2｜強調句</h1>
<p>c’est…qui 強調主詞，c’est…que 強調其他成分。ce qui 把一件事當主詞，ce que 把一件事當受詞，ce dont 代替 de。</p>
<div class="toolbar">
<a class="download" href="./mise-en-relief.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的法語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>qui 只在強調主詞時使用。強調地點、時間、受詞都用 que：C’est à Paris que…<br>ce dont 後面的動詞本來就帶 de：avoir besoin de、parler de。</div>
<nav class="pager"><a href="../connecteurs-b2/">← Connecteurs écrits</a><span></span></nav>
</main>
<footer>Mise en relief · 法文 B2</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "c’est…qui / que", "meaning": "強調是誰、是什麼", "rows": [["是 Marie", "c’est Marie qui", "是 Marie"], ["是在巴黎", "c’est à Paris que", "是在巴黎"], ["是這本書", "c’est ce livre que", "是這本書"], ["是昨天", "c’est hier que", "是昨天"]], "examples": [["C’est Marie qui a organisé la fête.", "是 Marie 籌辦了這場聚會。"], ["C’est à Paris que nous nous sommes rencontrés.", "我們是在巴黎認識的。"], ["C’est ce livre que je cherche.", "我找的就是這本書。"], ["C’est hier que la décision a été prise.", "決定是昨天做的。"]]}, {"name": "ce qui、ce que", "meaning": "所…的事", "rows": [["我所喜歡的", "ce qui me plaît", "讓我喜歡的"], ["我想要的", "ce que je veux", "我想要的"], ["重要的是", "ce qui est important", "重要的是"], ["他說的", "ce qu’il a dit", "他所說的"]], "examples": [["Ce qui me plaît, c’est le calme.", "讓我喜歡的是那份安靜。"], ["Ce que je veux, c’est comprendre.", "我想要的是弄懂。"], ["Ce qui est important, c’est de pratiquer.", "重要的是練習。"], ["Je n’ai pas compris ce qu’il a dit.", "我沒有懂他所說的。"]]}, {"name": "ce dont", "meaning": "代替 de", "rows": [["我們需要的", "ce dont nous avons besoin", "我們所需要的"], ["我說的", "ce dont je parle", "我所談的"], ["她害怕的", "ce dont elle a peur", "她所害怕的"], ["你記得的", "ce dont tu te souviens", "你所記得的"]], "examples": [["Ce dont nous avons besoin, c’est de temps.", "我們所需要的是時間。"], ["Ce dont je parle, c’est de cette règle.", "我所談的是這條規則。"], ["Je comprends ce dont elle a peur.", "我理解她所害怕的事。"], ["Ce dont tu te souviens est important.", "你所記得的事很重要。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="fr">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="fr">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放法語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="fr">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('fr'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
