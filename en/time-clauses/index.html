<header><div class="brand"><a href="../index.html">← 英文筆記</a>　/　Time Clauses</div></header>
<main>
<div class="intro">
<h1>英文 B1｜時間副詞子句</h1>
<p>when、while、as soon as、not until 後面接時間子句。談未來時，時間子句用現在式，主句用 will。</p>
<div class="toolbar">
<a class="download" href="./time-clauses.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的英語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>When I arrive, I will call you. 時間子句不寫 When I will arrive.</div>
<nav class="pager"><a href="../relative-where-when/">← Relative Where When</a><a href="../so-that-result/">So That Result →</a></nav>
</main>
<footer>Time Clauses · 英文 B1</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "when / while", "meaning": "當……時", "rows": [["when", "when I arrive", "當我到達時"], ["when", "when she calls", "當她打來時"], ["while", "while you wait", "當你等待時"], ["while", "while he was out", "當他外出時"]], "examples": [["When I arrive, I will call you.", "我到的時候會打給你。"], ["Please tell me when she calls.", "她打來時請告訴我。"], ["Read while you wait.", "等待時讀點東西。"], ["I called while he was out.", "他外出時我打了電話。"]]}, {"name": "as soon as", "meaning": "一……就", "rows": [["到了", "as soon as I arrive", "我一到"], ["結束", "as soon as class ends", "課一結束"], ["看到", "as soon as she saw me", "她一看到我"], ["回家", "as soon as we got home", "我們一到家"]], "examples": [["I will text you as soon as I arrive.", "我一到就傳訊息給你。"], ["We can leave as soon as class ends.", "課一結束我們就能走。"], ["She smiled as soon as she saw me.", "她一看到我就笑了。"], ["It started to rain as soon as we got home.", "我們一到家就開始下雨。"]]}, {"name": "not until", "meaning": "直到……才", "rows": [["直到", "not until six", "直到六點才"], ["直到", "not until he called", "直到他打來才"], ["直到", "not until tomorrow", "直到明天才"], ["直到", "not until the rain stops", "直到雨停才"]], "examples": [["I will not leave until six.", "我直到六點才會離開。"], ["She did not rest until he called.", "直到他打來，她才休息。"], ["The shop does not open until tomorrow.", "這家店直到明天才開。"], ["We will not go out until the rain stops.", "直到雨停，我們才會出去。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="en">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="en">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放英語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('en'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
