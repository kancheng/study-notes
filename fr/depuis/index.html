<p>從過去一直持續到現在，用現在式加 depuis。已經結束的一段時間，用複合過去加 pendant。多久以前，用 il y a。</p>

</div>

<div class="tip"><strong>用法提醒：</strong>depuis 問的是 Depuis quand ? 或 Depuis combien de temps ?<br>pour 常指計畫中的長度：Je vais rester pour deux jours.</div>

<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "depuis", "meaning": "從那時起，現在仍是", "rows": [["從二〇二〇", "depuis 2020", "從 2020 年起"], ["六個月", "depuis six mois", "至今六個月"], ["問", "depuis quand", "從什麼時候"], ["問多久", "depuis combien de temps", "至今多久"]], "examples": [["J’habite ici depuis 2020.", "我從 2020 年起住在這裡。"], ["J’apprends le français depuis six mois.", "我學法文至今六個月。"], ["Depuis quand est-ce que tu habites ici ?", "你從什麼時候住在這裡？"], ["Depuis combien de temps est-ce que vous travaillez ici ?", "您在這裡工作多久了？"]]}, {"name": "pendant", "meaning": "一段已經結束的時間", "rows": [["八小時", "pendant huit heures", "八個小時"], ["兩年", "pendant deux ans", "兩年"], ["整個夏天", "pendant tout l’été", "整個夏天"], ["問", "pendant combien de temps", "多久"]], "examples": [["J’ai dormi pendant huit heures.", "我睡了八個小時。"], ["Elle a vécu à Paris pendant deux ans.", "她在巴黎住了兩年。"], ["Nous avons voyagé pendant tout l’été.", "我們整個夏天都在旅行。"], ["Pendant combien de temps est-ce que tu as étudié ?", "你當時學了多久？"]]}, {"name": "il y a、pour", "meaning": "以前、計畫的長度", "rows": [["一小時前", "il y a une heure", "一小時前"], ["三天前", "il y a trois jours", "三天前"], ["待兩天", "pour deux jours", "待兩天"], ["問以前", "il y a combien de temps", "多久以前"]], "examples": [["Il est parti il y a une heure.", "他一小時前離開了。"], ["Marie est partie il y a trois jours.", "Marie 三天前離開了。"], ["Je vais rester pour deux jours.", "我打算待兩天。"], ["Il y a combien de temps est-ce que tu es arrivé ?", "你多久以前到的？"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="fr">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="fr">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放法語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="fr">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('fr'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
