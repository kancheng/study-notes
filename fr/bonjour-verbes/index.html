<div class="intro">
<h1>法文 A1｜être、avoir、s’appeler</h1>
<p>自我介紹先記這三個動詞。être 是「是」，avoir 是「有」，s’appeler 是「叫做」。年齡用 avoir，不用 être。</p>
<div class="toolbar">
<a class="download" href="./bonjour-verbes.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的法語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>女性要配合性別：étudiante、française、prête。<br>年齡用 avoir：J’ai 25 ans. s’appeler 在 nous 不重複子音：nous nous appelons。</div>
<nav class="pager"><span></span><a href="../articles/">Articles →</a></nav>
</main>
<footer>Bonjour Verbes · 法文 A1</footer>
<script id="lesson" type="application/json">{"cols": ["人稱", "現在式", "中文"], "groups": [{"name": "être", "meaning": "是", "rows": [["je", "je suis", "我是"], ["tu", "tu es", "你是"], ["il / elle", "il / elle est", "他／她是"], ["nous", "nous sommes", "我們是"], ["vous", "vous êtes", "您／你們是"], ["ils / elles", "ils / elles sont", "他們／她們是"]], "examples": [["Je suis étudiant.", "我是學生。"], ["Tu es prêt ?", "你準備好了嗎？"], ["Elle est française.", "她是法國人。"], ["Nous sommes à Taipei.", "我們在台北。"]]}, {"name": "avoir", "meaning": "有；年齡", "rows": [["je", "j’ai", "我有"], ["tu", "tu as", "你有"], ["il / elle", "il / elle a", "他／她有"], ["nous", "nous avons", "我們有"], ["vous", "vous avez", "您／你們有"], ["ils / elles", "ils / elles ont", "他們／她們有"]], "examples": [["J’ai 25 ans.", "我二十五歲。"], ["Tu as un livre ?", "你有一本書嗎？"], ["Il a un frère.", "他有一個兄弟。"], ["Nous avons un cours.", "我們有一堂課。"]]}, {"name": "s’appeler", "meaning": "叫做", "rows": [["je", "je m’appelle", "我叫"], ["tu", "tu t’appelles", "你叫"], ["il / elle", "il / elle s’appelle", "他／她叫"], ["nous", "nous nous appelons", "我們叫"], ["vous", "vous vous appelez", "您／你們叫"], ["ils / elles", "ils / elles s’appellent", "他們／她們叫"]], "examples": [["Je m’appelle Hao-Cheng.", "我叫 Hao-Cheng。"], ["Tu t’appelles comment ?", "你叫什麼名字？"], ["Elle s’appelle Marie.", "她叫 Marie。"], ["Vous vous appelez comment ?", "您貴姓？"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="fr">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="fr">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放法語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="fr">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('fr'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
