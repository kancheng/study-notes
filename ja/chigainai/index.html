<h1>日文 N2｜に違いない、にすぎない</h1>
<p>に違いない是很有把握的判斷，相當於「一定是」。にすぎない是「只不過」。にほかならない是「正是、不外乎」。</p>
<div class="toolbar">
<a class="download" href="./chigainai.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音，朗讀的是漢字句。可用性依瀏覽器與系統而異。</span>
</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>
</div>

<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "に違いない", "meaning": "一定是", "rows": [["一定掉了", "鍵がない。どこかに落としたに違いありません。", "かぎ が ない。 どこ か に おとした に ちがい ありません。", "Kagi ga nai. doko ka ni otoshita ni chigai arimasen."], ["一定是老師", "あの人は、先生に違いありません。", "あの ひと は、 せんせい に ちがい ありません。", "Ano hito wa, sensei ni chigai arimasen."], ["一定很累", "彼は昨日遅くまで働いていました。疲れているに違いありません。", "かれ は きのう おそく まで はたらいて いました。 つかれて いる に ちがい ありません。", "Kare wa kinou osoku made hataraite imashita. tsukarete iru ni chigai arimasen."], ["一定是真的", "みんなそう言っています。本当に違いありません。", "みんな そう いって います。 ほんとう に ちがい ありません。", "Minna sou itte imasu. hontou ni chigai arimasen."]], "examples": [["電気がついています。彼は部屋にいるに違いありません。", "でんき が ついて います。 かれ は へや に いる に ちがい ありません。", "Denki ga tsuite imasu. kare wa heya ni iru ni chigai arimasen.", "燈亮著，他一定在房間裡。"], ["この足音は、父に違いありません。", "この あしおと は、 ちち に ちがい ありません。", "Kono ashioto wa, chichi ni chigai arimasen.", "這個腳步聲一定是爸爸。"], ["彼女は何か知っているに違いありません。", "かのじょ は なに か しって いる に ちがい ありません。", "Kanojo wa nani ka shitte iru ni chigai arimasen.", "她一定知道些什麼。"], ["そんなに高い店は、人気があるに違いありません。", "そんな に たかい みせ は、 にんき が ある に ちがい ありません。", "Sonna ni takai mise wa, ninki ga aru ni chigai arimasen.", "那麼貴的店，一定很受歡迎。"]]}, {"name": "にすぎない", "meaning": "只不過", "rows": [["只是學生", "私は学生にすぎません。", "わたし は がくせい に すぎません。", "Watashi wa gakusei ni sugimasen."], ["只是意見", "これは私の意見にすぎません。", "これ は わたし の いけん に すぎません。", "Kore wa watashi no iken ni sugimasen."], ["只是開始", "これは第一歩にすぎません。", "これ は だいいっぽ に すぎません。", "Kore wa daiippo ni sugimasen."], ["只是藉口", "忙しいというのは、言い訳にすぎません。", "いそがしい と いう の は、 いいわけ に すぎません。", "Isogashii to iu no wa, iiwake ni sugimasen."]], "examples": [["私にできることは、これだけにすぎません。", "わたし に できる こと は、 これ だけ に すぎません。", "Watashi ni dekiru koto wa, kore dake ni sugimasen.", "我能做的只不過是這些。"], ["三百人にすぎませんが、みんな熱心です。", "さんびゃくにん に すぎません が、 みんな ねっしん です。", "Sanbyakunin ni sugimasen ga, minna nesshin desu.", "雖然只不過三百人，大家都很熱忱。"], ["失敗は、一度にすぎません。", "しっぱい は、 いちど に すぎません。", "Shippai wa, ichido ni sugimasen.", "失敗只不過一次。"], ["今の話は、例にすぎません。", "いま の はなし は、 れい に すぎません。", "Ima no hanashi wa, rei ni sugimasen.", "剛才說的只不過是例子。"]]}, {"name": "にほかならない", "meaning": "正是", "rows": [["正是努力", "合格したのは、努力の結果にほかなりません。", "ごうかく した の は、 どりょく の けっか に ほか なりません。", "Goukaku shita no wa, doryoku no kekka ni hoka narimasen."], ["正是因為忙", "彼が来ないのは、忙しいからにほかなりません。", "かれ が こない の は、 いそがしい から に ほか なりません。", "Kare ga konai no wa, isogashii kara ni hoka narimasen."], ["正是愛", "この行動は、家族への愛にほかなりません。", "この こうどう は、 かぞく へ の あい に ほか なりません。", "Kono koudou wa, kazoku e no ai ni hoka narimasen."], ["正是習慣", "健康でいられるのは、毎日歩くからにほかなりません。", "けんこう で いられる の は、 まいにち あるく から に ほか なりません。", "Kenkou de irareru no wa, mainichi aruku kara ni hoka narimasen."]], "examples": [["この成功は、チームの力にほかなりません。", "この せいこう は、 チーム の ちから に ほか なりません。", "Kono seikou wa, chiimu no chikara ni hoka narimasen.", "這次成功正是團隊的力量。"], ["彼が怒ったのは、嘘をつかれたからにほかなりません。", "かれ が おこった の は、 うそ を つかれた から に ほか なりません。", "Kare ga okotta no wa, uso o tsukareta kara ni hoka narimasen.", "他生氣正是因為被騙了。"], ["言葉を学ぶことは、人と人をつなぐことにほかなりません。", "ことば を まなぶ こと は、 ひと と ひと を つなぐ こと に ほか なりません。", "Kotoba o manabu koto wa, hito to hito o tsunagu koto ni hoka narimasen.", "學語言正是把人和人連起來。"], ["彼女が選んだ理由は、将来を考えたことにほかなりません。", "かのじょ が えらんだ りゆう は、 しょうらい を かんがえた こと に ほか なりません。", "Kanojo ga eranda riyuu wa, shourai o kangaeta koto ni hoka narimasen.", "她做這個選擇的理由，正是考慮到將來。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
