<style>

*{box-sizing:border-box}

h1{font-size:clamp(1.8rem,4vw,2.65rem);margin:0 0 8px}

p{line-height:1.7}

.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 28px}

<body>
<header><div class="brand"><a href="../index.html">← 英文筆記</a>　/　Second Conditional</div></header>
<main>
<div class="intro">
<h1>英文 B1｜第二條件句</h1>
<p>和第二條件句談的是現在或未來不太可能、或與事實相反的情況。if 用過去式，主句用 would。</p>
<div class="toolbar">
<a class="download" href="./second-conditional.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的英語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>be 在這種句子裡常用 were，不分人稱：If I were you.</div>
<nav class="pager"><a href="../first-conditional/">← First Conditional</a><a href="../participle-adjective/">Participle Adjective →</a></nav>
</main>
<footer>Second Conditional · 英文 B1</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "If I were", "meaning": "與現在事實相反", "rows": [["如果我是你", "If I were you", "如果我是你"], ["如果她在", "If she were here", "如果她在這裡"], ["如果我是老師", "If I were a teacher", "如果我是老師"], ["如果現在是夏天", "If it were summer", "如果現在是夏天"]], "examples": [["If I were you, I would rest.", "如果我是你，我會休息。"], ["If she were here, she would help.", "如果她在這裡，她會幫忙。"], ["If I were a teacher, I would be patient.", "如果我是老師，我會有耐心。"], ["If it were summer, we would swim.", "如果現在是夏天，我們會去游泳。"]]}, {"name": "If + 過去式", "meaning": "想像的情況", "rows": [["有時間", "If I had time", "如果我有時間"], ["有錢", "If we had money", "如果我們有錢"], ["住得近", "If he lived near", "如果他住得近"], ["會說法文", "If she spoke French", "如果她會說法文"]], "examples": [["If I had time, I would learn guitar.", "如果我有時間，我會學吉他。"], ["If we had money, we would travel.", "如果我們有錢，我們會去旅行。"], ["If he lived near, he would walk.", "如果他住得近，他會走路來。"], ["If she spoke French, she could help.", "如果她會說法文，她就能幫忙。"]]}, {"name": "would", "meaning": "想像中的結果", "rows": [["會去", "I would go", "我會去"], ["會買", "she would buy", "她會買"], ["不會擔心", "I would not worry", "我不會擔心"], ["會說", "what would you do", "你會怎麼做"]], "examples": [["I would go if I were free.", "如果我有空，我會去。"], ["She would buy it if it were cheaper.", "如果它更便宜，她會買。"], ["I would not worry if I were you.", "如果我是你，我不會擔心。"], ["What would you do if you won?", "如果你贏了，你會怎麼做？"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="en">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="en">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放英語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('en'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
</body>
