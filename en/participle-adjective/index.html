<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "-ing / -ed", "meaning": "事物與感受", "rows": [["有趣／感興趣", "interesting / interested", "有趣的／感興趣的"], ["無聊／感到無聊", "boring / bored", "無聊的／感到無聊的"], ["令人興奮／感到興奮", "exciting / excited", "令人興奮的／感到興奮的"], ["令人疲倦／感到疲倦", "tiring / tired", "累人的／感到累的"]], "examples": [["The movie is interesting.", "這部電影很有趣。"], ["I am interested in the movie.", "我對這部電影感興趣。"], ["The game is exciting, so we are excited.", "這場比賽很刺激，所以我們很興奮。"], ["The work is tiring, and I am tired.", "這工作很累人，我也累了。"]]}, {"name": "正在做的", "meaning": "V-ing 修飾名詞", "rows": [["哭的", "the crying baby", "正在哭的嬰兒"], ["跑的", "the running boy", "正在跑的男孩"], ["微笑的", "the smiling girl", "微笑的女孩"], ["上升的", "the rising sun", "升起的太陽"]], "examples": [["The crying baby needs milk.", "正在哭的嬰兒需要牛奶。"], ["The running boy is my brother.", "正在跑的男孩是我弟弟。"], ["The smiling girl is Marie.", "微笑的女孩是 Marie。"], ["We watched the rising sun.", "我們看著升起的太陽。"]]}, {"name": "已被做的", "meaning": "過去分詞修飾名詞", "rows": [["破的", "a broken window", "破掉的窗戶"], ["寫好的", "a written report", "寫好的報告"], ["遺失的", "the lost bag", "遺失的袋子"], ["煮好的", "cooked food", "煮好的食物"]], "examples": [["There is a broken window.", "有一扇破掉的窗戶。"], ["Please read the written report.", "請讀那份寫好的報告。"], ["She found the lost bag.", "她找到了遺失的袋子。"], ["We ate the cooked food.", "我們吃了煮好的食物。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="en">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="en">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放英語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('en'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
