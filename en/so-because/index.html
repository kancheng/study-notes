<main>
<div class="intro">
<h1>英文 A2｜so 與 because</h1>
<p>because 引出原因，so 引出結果。because of 後面接名詞，不接完整句子。</p>

<a class="download" href="./so-because.pdf" download>下載完整 PDF</a>

</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>同一句不要寫 Because I was tired, so I rested. 原因和結果只留一個連接詞。</div>

<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "because", "meaning": "原因子句", "rows": [["因為累", "because I was tired", "因為我累了"], ["因為雨", "because it rained", "因為下雨"], ["因為忙", "because she was busy", "因為她很忙"], ["放句首", "Because it was late", "因為晚了"]], "examples": [["I rested because I was tired.", "我休息了，因為我累了。"], ["We stayed home because it rained.", "我們留在家，因為下雨。"], ["She left because she was busy.", "她離開了，因為她很忙。"], ["Because it was late, I went home.", "因為晚了，我回家了。"]]}, {"name": "so", "meaning": "結果", "rows": [["所以", "so I rested", "所以我休息"], ["所以", "so we stayed", "所以我們留下"], ["所以", "so she left", "所以她離開"], ["所以", "so I called", "所以我打了電話"]], "examples": [["I was tired, so I rested.", "我累了，所以我休息。"], ["It rained, so we stayed home.", "下雨了，所以我們留在家。"], ["She was busy, so she left.", "她很忙，所以她離開了。"], ["It was late, so I called her.", "晚了，所以我打給她。"]]}, {"name": "because of", "meaning": "後面接名詞", "rows": [["雨", "because of the rain", "因為雨"], ["交通", "because of the traffic", "因為交通"], ["他", "because of him", "因為他"], ["考試", "because of the test", "因為考試"]], "examples": [["We stayed home because of the rain.", "因為雨，我們留在家。"], ["I was late because of the traffic.", "因為交通，我遲到了。"], ["She smiled because of him.", "因為他，她笑了。"], ["He studied hard because of the test.", "因為考試，他很用功。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="en">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="en">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放英語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('en'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
