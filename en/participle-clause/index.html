<div class="tip"><strong>用法提醒：</strong>Walking home, the rain started. 是錯的，因為雨不會走路。要寫 Walking home, I got wet. 或 When I was walking home, the rain started.</div>

<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "V-ing", "meaning": "同時或原因", "rows": [["走回家", "Walking home, I", "走回家時，我"], ["感到累", "Feeling tired, she", "覺得累，她"], ["看到", "Seeing the bus, we", "看到公車，我們"], ["不知道", "Not knowing the answer, he", "不知道答案，他"]], "examples": [["Walking home, I met Marie.", "走回家時，我遇到 Marie。"], ["Feeling tired, she sat down.", "覺得累，她坐下了。"], ["Seeing the bus, we ran.", "看到公車，我們跑了起來。"], ["Not knowing the answer, he kept quiet.", "不知道答案，他保持安靜。"]]}, {"name": "過去分詞", "meaning": "被動的狀態", "rows": [["建成", "Built in 1990, the school", "建於 1990 年，這所學校"], ["寫成", "Written in English, the letter", "用英文寫成，這封信"], ["疲倦", "Tired after work, I", "工作後很累，我"], ["受驚", "Surprised by the news, she", "被消息嚇到，她"]], "examples": [["Built in 1990, the school is still new.", "這所學校建於 1990 年，它仍然很新。"], ["Written in English, the letter was easy to read.", "這封信用英文寫成，很容易讀。"], ["Tired after work, I went to bed.", "工作後很累，我去睡了。"], ["Surprised by the news, she called me.", "被消息嚇到，她打給我。"]]}, {"name": "改寫", "meaning": "子句與分詞", "rows": [["because", "Because he was tired, he left.", "因為他累了，他離開。"], ["分詞", "Being tired, he left.", "因為累了，他離開。"], ["when", "When I walked home, I met her.", "我走回家時遇到她。"], ["分詞", "Walking home, I met her.", "走回家時，我遇到她。"]], "examples": [["Because he was tired, he left.", "因為他累了，他離開了。"], ["Being tired, he left.", "因為累了，他離開了。"], ["When I walked home, I met her.", "我走回家時遇到她。"], ["Walking home, I met her.", "走回家時，我遇到她。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="en">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="en">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放英語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('en'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
