<header><div class="brand"><a href="../index.html">← 德文筆記</a>　/　Subjektiv</div></header>
<main>
<div class="intro">
<h1>德文 B2｜情態動詞的推測</h1>
<p>同一組情態動詞還可以表示消息從哪裡來：傳聞、本人聲稱、有可能、幾乎可以確定。</p>
<div class="toolbar">
<a class="download" href="./subjektiv.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的德語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>sollen 是聽說。wollen 是本人聲稱，說話者未必相信。dürfte 是大概。müssen 是根據跡象幾乎可以確定。<br>談過去時，後面用分詞加 haben 或 sein：Er muss schon gegangen sein。</div>
<nav class="pager"><a href="../je-desto/">← Je und Sodass</a><span></span></nav>
</main>
<footer>Subjektiv · 德文 B2</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "sollen 與 wollen", "meaning": "聽說，或本人這麼說", "rows": [["傳聞", "Er soll sehr streng sein.", "聽說他很嚴格。"], ["本人聲稱", "Sie will die Chefin kennen.", "她聲稱認識主管。"], ["過去", "Sie will die Prüfung bestanden haben.", "她聲稱通過了考試。"], ["差別", "sollen 不是她自己說的", "wollen 是她自己說的"]], "examples": [["Er soll sehr streng sein.", "聽說他很嚴格。"], ["Der Kurs soll interessant sein.", "聽說這堂課很有趣。"], ["Sie will die Chefin persönlich kennen.", "她聲稱親自認識主管。"], ["Er will davon nichts gewusst haben.", "他聲稱對此一無所知。"]]}, {"name": "dürfte 與 können", "meaning": "大概，或有可能", "rows": [["大概", "Das dürfte stimmen.", "那大概是對的。"], ["有可能", "Das kann stimmen.", "那有可能是對的。"], ["預期", "Der Zug müsste gleich kommen.", "火車應該快到了。"], ["不確定", "kann 比 dürfte 更沒把握", "只是有可能"]], "examples": [["Das dürfte ein Fehler sein.", "那大概是一個錯誤。"], ["Das kann stimmen, aber ich bin nicht sicher.", "那有可能是對的，但我沒有把握。"], ["Der Zug müsste gleich kommen.", "火車應該快到了。"], ["Sie dürfte die Nachricht schon gelesen haben.", "她大概已經看過那個消息了。"]]}, {"name": "müssen", "meaning": "從跡象推出來", "rows": [["幾乎確定", "Er muss zu Hause sein.", "他一定在家。"], ["過去", "Er muss schon gegangen sein.", "他一定已經走了。"], ["移動", "sein 放句尾", "gegangen sein"], ["不是命令", "這裡不是必須", "是推測"]], "examples": [["Das Licht ist an. Er muss zu Hause sein.", "燈亮著。他一定在家。"], ["Die Tasche ist weg. Sie muss schon gegangen sein.", "袋子不見了。她一定已經走了。"], ["Er muss den Zug verpasst haben.", "他一定沒趕上火車。"], ["Das muss ein Missverständnis sein.", "那一定是個誤會。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="de">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="de">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放德語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('de'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
