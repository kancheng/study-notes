<title>Opinion｜法文 B1</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#182a45;background:#f7f4f2}
*{box-sizing:border-box}
body{margin:0}
header{background:#b3482f;color:white;padding:22px max(20px,calc((100vw - 1050px)/2))}
header .brand{font-size:1.35rem;font-weight:800}
header a{color:inherit;text-decoration:none}
main{max-width:1050px;margin:auto;padding:32px 20px 70px}
h1{font-size:clamp(1.8rem,4vw,2.65rem);margin:0 0 8px}
h2{font-size:1.55rem;margin:0}
p{line-height:1.7}
.intro{margin-bottom:24px}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 28px}
.download,button{cursor:pointer;border:0;border-radius:9px;font:inherit}
.download{display:inline-block;background:#b3482f;color:white;padding:12px 18px;text-decoration:none;font-weight:700}
.download:hover{background:#8b321f}
.note{font-size:.92rem;color:#52647d}
.card{background:white;border:1px solid #eadfd6;border-radius:16px;box-shadow:0 8px 24px #142f5210;margin:20px 0;padding:23px}
.cardhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.meaning{color:#52647d}
.tablewrap{overflow-x:auto;margin-top:18px}
table{border-collapse:collapse;width:100%;min-width:680px;text-align:left}
th{background:#f8efe8;font-size:.9rem}
th,td{padding:13px 14px;border-bottom:1px solid #f0e6df}
td:nth-child(2){font-weight:750;color:#b3482f}
.examples{margin-top:22px}
.examples h3{font-size:1.07rem;margin:0 0 10px}
.example{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #f3ebe6}
.line{font-size:1.03rem;font-weight:700}
.zh{color:#53637b;margin-top:3px}
.speak{background:#f8efe8;color:#b3482f;padding:9px 12px;min-width:84px}
.speak:hover,.speak:focus-visible{background:#f0ddd2;outline:2px solid #b3482f;outline-offset:2px}
.tip{background:#f8efe8;border-left:4px solid #b3482f;padding:14px 18px;border-radius:8px;margin-top:20px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.pager a{color:#b3482f;font-weight:750;text-decoration:none}
.pager a:hover,.pager a:focus-visible{text-decoration:underline}
footer{max-width:1050px;margin:auto;padding:20px;color:#627087;font-size:.9rem}

</head>
<body>
<header><div class="brand"><a href="../index.html">← 法文筆記</a>　/　Opinion</div></header>
<main>
<div class="intro">
<h1>法文 B1｜看法</h1>
<p>肯定地說「我認為是事實」時，que 後面用直陳式。否定或不確定時，常用虛擬式。à mon avis 和 selon moi 後面是一個完整的看法，不必改動詞形式。</p>
<div class="toolbar">
<a class="download" href="./opinion.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的法語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>Je pense qu’il a raison. 用直陳式。<br>Je ne pense pas qu’il ait raison. 用虛擬式。douter que 也接虛擬式。</div>
<nav class="pager"><a href="../gerondif/">← Gérondif</a><a href="../connecteurs/">Connecteurs →</a></nav>
</main>
<footer>Opinion · 法文 B1</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "肯定", "meaning": "直陳式", "rows": [["我認為", "je pense que", "我認為"], ["我相信", "je crois que", "我相信"], ["我覺得", "je trouve que", "我覺得"], ["依我看", "à mon avis", "依我看"]], "examples": [["Je pense que c’est une bonne idée.", "我認為這是個好主意。"], ["Je crois qu’il a raison.", "我相信他是對的。"], ["Je trouve que ce film est trop long.", "我覺得這部電影太長。"], ["À mon avis, il faut partir tôt.", "依我看，必須早點出發。"]]}, {"name": "否定與懷疑", "meaning": "虛擬式", "rows": [["我不認為", "je ne pense pas que", "我不認為"], ["我不相信", "je ne crois pas que", "我不相信"], ["我懷疑", "je doute que", "我懷疑"], ["不肯定", "il n’est pas sûr que", "還不肯定"]], "examples": [["Je ne pense pas que ce soit difficile.", "我不認為這很難。"], ["Je ne crois pas qu’il ait raison.", "我不相信他是對的。"], ["Je doute qu’il vienne.", "我懷疑他會來。"], ["Il n’est pas sûr que nous ayons le temps.", "還不肯定我們有沒有時間。"]]}, {"name": "說出立場", "meaning": "selon moi、pour moi", "rows": [["對我來說", "pour moi", "對我來說"], ["據我", "selon moi", "據我看來"], ["我同意", "je suis d’accord", "我同意"], ["我不同意", "je ne suis pas d’accord", "我不同意"]], "examples": [["Pour moi, le plus important est de pratiquer.", "對我來說，最重要的是練習。"], ["Selon moi, cette solution est simple.", "據我看來，這個辦法很簡單。"], ["Je suis d’accord avec toi.", "我同意你。"], ["Je ne suis pas d’accord avec cette idée.", "我不同意這個想法。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="fr">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="fr">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放法語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="fr">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('fr'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
</body>
</html>
