<header><div class="brand"><a href="../index.html">← 英文筆記</a>　/　Negative Inversion</div></header>
<main>
<div class="intro">
<h1>英文 B2｜否定副詞倒裝</h1>
<p>Never、Seldom、Not only 放到句首時，句子要倒裝，像問句一樣把助動詞放在主詞前面。</p>
<div class="toolbar">
<a class="download" href="./inversion-negative.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的英語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>Not only 倒裝的是前半句。Hardly...when 和 No sooner...than 用過去完成。</div>
<nav class="pager"><a href="../agreement/">← Agreement</a><a href="../inversion-so-only/">So and Only →</a></nav>
</main>
<footer>Negative Inversion · 英文 B2</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "never / seldom", "meaning": "幾乎不", "rows": [["從不", "Never have I seen", "我從未見過"], ["很少", "Seldom does she complain", "她很少抱怨"], ["幾乎不", "Hardly did I know", "我幾乎不知道"], ["很少", "Rarely do we meet", "我們很少見面"]], "examples": [["Never have I seen such a view.", "我從未見過這樣的景色。"], ["Seldom does she complain.", "她很少抱怨。"], ["Hardly did I know what to say.", "我幾乎不知道該說什麼。"], ["Rarely do we meet on Sunday.", "我們很少在星期天見面。"]]}, {"name": "not only", "meaning": "不但", "rows": [["離開", "Not only did he leave", "他不但離開"], ["讀", "Not only does she study", "她不但讀書"], ["幫忙", "Not only did they help", "他們不但幫忙"], ["晚", "Not only was I late", "我不但遲到"]], "examples": [["Not only did he leave, but he also took the book.", "他不但離開，還把書拿走了。"], ["Not only does she study English, but she also teaches it.", "她不但讀英文，還教英文。"], ["Not only did they help, but they also stayed.", "他們不但幫忙，還留下來。"], ["Not only was I late, but I also forgot the book.", "我不但遲到，還忘了書。"]]}, {"name": "hardly / no sooner", "meaning": "一……就", "rows": [["剛", "Hardly had I sat down when", "我剛坐下就"], ["剛", "No sooner had she left than", "她剛離開就"], ["剛到", "Hardly had we arrived when", "我們剛到就"], ["剛說", "No sooner had he spoken than", "他剛說完就"]], "examples": [["Hardly had I sat down when the phone rang.", "我剛坐下，電話就響了。"], ["No sooner had she left than it rained.", "她剛離開，就下雨了。"], ["Hardly had we arrived when the class started.", "我們剛到，課就開始了。"], ["No sooner had he spoken than everyone laughed.", "他剛說完，大家就笑了。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="en">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="en">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放英語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('en'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
