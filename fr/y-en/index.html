<div class="intro">
<h1>法文 A2｜y 與 en</h1>
<p>y 代替地點，也代替 à 加上事物。en 代替 de 加上事物，也代替數量。兩個都放在動詞前面。</p>
<div class="toolbar">
<a class="download" href="./y-en.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的法語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>人不用 y。à Marie 用 lui，不用 y。<br>數量留下時，en 仍然要放：J’en ai deux.</div>

<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "y", "meaning": "那裡、à + 事物", "rows": [["去那裡", "j’y vais", "我去那裡"], ["住那裡", "j’y habite", "我住那裡"], ["想到", "j’y pense", "我在想那件事"], ["否定", "je n’y vais pas", "我不去那裡"]], "examples": [["Tu vas à la bibliothèque ? Oui, j’y vais.", "你去圖書館嗎？對，我去。"], ["J’habite à Taipei. J’y habite depuis un an.", "我住台北。我在那裡住了一年。"], ["Tu penses à l’examen ? Oui, j’y pense.", "你在想考試嗎？對，我在想。"], ["Je n’y vais pas aujourd’hui.", "我今天不去那裡。"]]}, {"name": "en", "meaning": "de + 事物、數量", "rows": [["要一些", "j’en veux", "我要一些"], ["有兩個", "j’en ai deux", "我有兩個"], ["需要", "j’en ai besoin", "我需要"], ["否定", "je n’en veux pas", "我不要"]], "examples": [["Tu veux du café ? Oui, j’en veux.", "你要咖啡嗎？好，我要。"], ["Combien de frères as-tu ? J’en ai deux.", "你有幾個兄弟？我有兩個。"], ["Tu as besoin d’un stylo ? Oui, j’en ai besoin.", "你需要筆嗎？對，我需要。"], ["Merci, je n’en veux pas.", "謝謝，我不要了。"]]}, {"name": "il y en a", "meaning": "那裡有一些", "rows": [["有", "il y en a", "有一些"], ["還有", "il y en a encore", "還有"], ["沒有", "il n’y en a pas", "沒有"], ["有三個", "il y en a trois", "有三個"]], "examples": [["Il y a des chaises ? Oui, il y en a.", "有椅子嗎？有的。"], ["Il y en a encore.", "還有一些。"], ["Il n’y en a plus.", "已經沒有了。"], ["Combien de cafés est-ce qu’il y a ? Il y en a trois.", "有幾家咖啡館？有三家。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="fr">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="fr">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放法語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="fr">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('fr'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
