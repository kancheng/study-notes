<style>

<body>
<header><div class="brand"><a href="../index.html">← 日文筆記</a>　/　ます形</div></header>
<main>
<div class="intro">
<h1>日文 N5｜ます形</h1>
<p>ます是現在或未來，ません是否定，ました是過去。五段、一段、する、来る的ます形要分開記。</p>
<div class="toolbar">
<a class="download" href="./masu.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音，朗讀的是漢字句。可用性依瀏覽器與系統而異。</span>
</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>来る的ます形是来ます，不是来ります。<br>する是します。行くは行きます，讀いき。</div>
<nav class="pager"><a href="../keiyoushi/">← 形容詞</a><a href="../jikan/">時間 →</a></nav>
</main>
<footer>ます形 · 日文 N5</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "五段", "meaning": "行く、読む、話す", "rows": [["去", "学校へ行きます。", "がっこう へ いきます。", "Gakkou e ikimasu."], ["不去", "今日は行きません。", "きょう は いきません。", "Kyou wa ikimasen."], ["去了", "昨日、行きました。", "きのう、 いきました。", "Kinou, ikimashita."], ["讀", "本を読みます。", "ほん を よみます。", "Hon o yomimasu."]], "examples": [["毎日、学校へ行きます。", "まいにち、 がっこう へ いきます。", "Mainichi, gakkou e ikimasu.", "我每天去學校。"], ["今日は映画を見ません。", "きょう は えいが を みません。", "Kyou wa eiga o mimasen.", "我今天不看電影。"], ["昨日、友達に会いました。", "きのう、 ともだち に あいました。", "Kinou, tomodachi ni aimashita.", "我昨天見到朋友了。"], ["日本語を話します。", "にほんご を はなします。", "Nihongo o hanashimasu.", "我說日文。"]]}, {"name": "一段", "meaning": "食べる、見る", "rows": [["吃", "朝ごはんを食べます。", "あさごはん を たべます。", "Asagohan o tabemasu."], ["不吃", "肉を食べません。", "にく を たべません。", "Niku o tabemasen."], ["吃了", "もう食べました。", "もう たべました。", "Mou tabemashita."], ["看", "テレビを見ます。", "テレビ を みます。", "Terebi o mimasu."]], "examples": [["七時に朝ごはんを食べます。", "しちじ に あさごはん を たべます。", "Shichiji ni asagohan o tabemasu.", "我七點吃早餐。"], ["今日は肉を食べません。", "きょう は にく を たべません。", "Kyou wa niku o tabemasen.", "我今天不吃肉。"], ["もう昼ごはんを食べました。", "もう ひるごはん を たべました。", "Mou hirugohan o tabemashita.", "我已經吃過午餐了。"], ["夜、テレビを見ます。", "よる、 テレビ を みます。", "Yoru, terebi o mimasu.", "我晚上看電視。"]]}, {"name": "する・来る", "meaning": "不規則", "rows": [["做", "勉強します。", "べんきょう します。", "Benkyou shimasu."], ["不做", "今日は勉強しません。", "きょう は べんきょう しません。", "Kyou wa benkyou shimasen."], ["來", "明日、来ます。", "あした、 きます。", "Ashita, kimasu."], ["不來", "今日は来ません。", "きょう は きません。", "Kyou wa kimasen."]], "examples": [["図書館で勉強します。", "としょかん で べんきょう します。", "Toshokan de benkyou shimasu.", "我在圖書館學習。"], ["週末は勉強しません。", "しゅうまつ は べんきょう しません。", "Shuumatsu wa benkyou shimasen.", "我週末不學習。"], ["明日、友達が来ます。", "あした、 ともだち が きます。", "Ashita, tomodachi ga kimasu.", "明天朋友會來。"], ["昨日、先生が来ました。", "きのう、 せんせい が きました。", "Kinou, sensei ga kimashita.", "昨天老師來了。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
