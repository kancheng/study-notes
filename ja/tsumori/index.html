<style>

<body>
<header><div class="brand"><a href="../index.html">← 日文筆記</a>　/　つもり</div></header>
<main>
<div class="intro">
<h1>日文 N4｜つもり、と思う、予定</h1>
<p>つもり是自己的打算。予定是已經排定的計畫。と思う用來說想法，引用的句子用普通形。</p>
<div class="toolbar">
<a class="download" href="./tsumori.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音，朗讀的是漢字句。可用性依瀏覽器與系統而異。</span>
</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>と思う前面用普通形：雨だと思います，不是雨ですと思います。<br>ないと思います是否定的看法。</div>
<nav class="pager"><a href="../ageru/">← あげる・くれる・もらう</a><a href="../jouken/">条件 →</a></nav>
</main>
<footer>つもり · 日文 N4</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "つもり", "meaning": "打算", "rows": [["打算去", "来年、日本へ行くつもりです。", "らいねん、 にほん へ いく つもり です。", "Rainen, nihon e iku tsumori desu."], ["打算買", "新しい辞書を買うつもりです。", "あたらしい じしょ を かう つもり です。", "Atarashii jisho o kau tsumori desu."], ["不打算", "今日は出かけないつもりです。", "きょう は でかけない つもり です。", "Kyou wa dekakenai tsumori desu."], ["問", "週末、何をするつもりですか。", "しゅうまつ、 なに を する つもり です か。", "Shuumatsu, nani o suru tsumori desu ka."]], "examples": [["大学を卒業したら、働くつもりです。", "だいがく を そつぎょう したら、 はたらく つもり です。", "Daigaku o sotsugyou shitara, hataraku tsumori desu.", "大學畢業後我打算工作。"], ["今晩は早く寝るつもりです。", "こんばん は はやく ねる つもり です。", "Konban wa hayaku neru tsumori desu.", "今晚我打算早睡。"], ["その話はしないつもりです。", "その はなし は しない つもり です。", "Sono hanashi wa shinai tsumori desu.", "那件事我不打算說。"], ["夏休みにどこへ行くつもりですか。", "なつやすみ に どこ へ いく つもり です か。", "Natsuyasumi ni doko e iku tsumori desu ka.", "暑假你打算去哪裡？"]]}, {"name": "と思う", "meaning": "我認為", "rows": [["會下雨", "明日は雨だと思います。", "あした は あめ だ と おもいます。", "Ashita wa ame da to omoimasu."], ["很貴", "この店は高いと思います。", "この みせ は たかい と おもいます。", "Kono mise wa takai to omoimasu."], ["不會來", "彼は来ないと思います。", "かれ は こない と おもいます。", "Kare wa konai to omoimasu."], ["問", "どう思いますか。", "どう おもいます か。", "Dou omoimasu ka."]], "examples": [["この問題は難しいと思います。", "この もんだい は むずかしい と おもいます。", "Kono mondai wa muzukashii to omoimasu.", "我覺得這個問題很難。"], ["明日は晴れだと思います。", "あした は はれ だ と おもいます。", "Ashita wa hare da to omoimasu.", "我覺得明天會放晴。"], ["彼は学生ではないと思います。", "かれ は がくせい で は ない と おもいます。", "Kare wa gakusei de wa nai to omoimasu.", "我不認為他是學生。"], ["日本語は面白いと思います。", "にほんご は おもしろい と おもいます。", "Nihongo wa omoshiroi to omoimasu.", "我覺得日文很有趣。"]]}, {"name": "予定", "meaning": "已經排定", "rows": [["旅行", "週末、旅行する予定です。", "しゅうまつ、 りょこう する よてい です。", "Shuumatsu, ryokou suru yotei desu."], ["會議", "十時に会議の予定です。", "じゅうじ に かいぎ の よてい です。", "Juuji ni kaigi no yotei desu."], ["沒有", "今夜は予定がありません。", "こんや は よてい が ありません。", "Kon'ya wa yotei ga arimasen."], ["問", "明日の予定は何ですか。", "あした の よてい は なん です か。", "Ashita no yotei wa nan desu ka."]], "examples": [["来月、大阪へ行く予定です。", "らいげつ、 おおさか へ いく よてい です。", "Raigetsu, oosaka e iku yotei desu.", "下個月我預計去大阪。"], ["午後三時に医者へ行く予定です。", "ごご さんじ に いしゃ へ いく よてい です。", "Gogo sanji ni isha e iku yotei desu.", "下午三點我預計去看醫生。"], ["今日は特別な予定はありません。", "きょう は とくべつ な よてい は ありません。", "Kyou wa tokubetsu na yotei wa arimasen.", "今天沒有特別的計畫。"], ["夏休みの予定を教えてください。", "なつやすみ の よてい を おしえて ください。", "Natsuyasumi no yotei o oshiete kudasai.", "請告訴我暑假的計畫。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
</body>
