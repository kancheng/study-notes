<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#182a45;background:#f7f4f2}
*{box-sizing:border-box}
body{margin:0}
header{background:#8b321f;color:white;padding:22px max(20px,calc((100vw - 1050px)/2))}
header .brand{font-size:1.35rem;font-weight:800}
header a{color:inherit;text-decoration:none}
main{max-width:1050px;margin:auto;padding:32px 20px 70px}
h1{font-size:clamp(1.8rem,4vw,2.65rem);margin:0 0 8px}
h2{font-size:1.55rem;margin:0}
p{line-height:1.7}
.intro{margin-bottom:24px}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 28px}
.download,button{cursor:pointer;border:0;border-radius:9px;font:inherit}
.download{display:inline-block;background:#b3482f;color:white;padding:12px 18px;text-decoration:none;font-weight:700}
.download:hover{background:#8b321f}
.note{font-size:.92rem;color:#52647d}
.card{background:white;border:1px solid #eadfd6;border-radius:16px;box-shadow:0 8px 24px #142f5210;margin:20px 0;padding:23px}
.cardhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.meaning{color:#52647d}

.zh{color:#53637b;margin-top:3px}

.speak:hover,.speak:focus-visible{background:#f0ddd2;outline:2px solid #b3482f;outline-offset:2px}

<body>
<header><div class="brand"><a href="../index.html">← 法文筆記</a>　/　Questions</div></header>
<main>
<div class="intro">
<h1>法文 A1｜提問</h1>
<p>口語最穩的問法是 est-ce que。疑問詞放在句首。對您說話時，也可以把動詞和 vous 倒過來。</p>
<div class="toolbar">
<a class="download" href="./questions.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的法語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>quel 要配性數：quel、quelle、quels、quelles。<br>問名字可以說 Tu t’appelles comment ? 對您說 Comment vous appelez-vous ?</div>
<nav class="pager"><a href="../negation/">← Négation</a><a href="../verbes-er/">Verbes en -er →</a></nav>
</main>
<footer>Questions · 法文 A1</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "est-ce que", "meaning": "是不是", "rows": [["你說", "Est-ce que tu parles français ?", "你說法文嗎？"], ["您住", "Est-ce que vous habitez ici ?", "您住這裡嗎？"], ["她來", "Est-ce qu’elle vient ?", "她來嗎？"], ["有", "Est-ce qu’il y a un café ?", "有咖啡館嗎？"]], "examples": [["Est-ce que tu parles français ?", "你說法文嗎？"], ["Est-ce que vous habitez à Taipei ?", "您住台北嗎？"], ["Est-ce qu’elle vient demain ?", "她明天來嗎？"], ["Est-ce qu’il y a une banque près d’ici ?", "附近有銀行嗎？"]]}, {"name": "疑問詞", "meaning": "哪裡、如何、什麼", "rows": [["哪裡", "Où habites-tu ?", "你住哪裡？"], ["如何", "Comment allez-vous ?", "您好嗎？"], ["什麼", "Qu’est-ce que c’est ?", "這是什麼？"], ["為什麼", "Pourquoi tu étudies le français ?", "你為什麼學法文？"]], "examples": [["Où est la gare ?", "火車站在哪裡？"], ["Comment allez-vous ?", "您好嗎？"], ["Qu’est-ce que vous faites ?", "您在做什麼？"], ["Pourquoi est-ce que tu restes ?", "你為什麼留下？"]]}, {"name": "quel", "meaning": "哪一個", "rows": [["陽", "Quel livre ?", "哪一本書？"], ["陰", "Quelle heure est-il ?", "現在幾點？"], ["陽複", "Quels jours ?", "哪幾天？"], ["陰複", "Quelles langues ?", "哪些語言？"]], "examples": [["Quel est ton nom ?", "你叫什麼名字？"], ["Quelle heure est-il ?", "現在幾點？"], ["Quels jours travailles-tu ?", "你哪幾天工作？"], ["Quelles langues est-ce que vous parlez ?", "您會說哪些語言？"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="fr">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="fr">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放法語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="fr">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('fr'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
</body>
