<style>

<body>
<header><div class="brand"><a href="../index.html">← 日文筆記</a>　/　形容詞</div></header>
<main>
<div class="intro">
<h1>日文 N5｜い形容詞與な形容詞</h1>
<p>い形容詞直接接です，否定把い改成くない。な形容詞要加な才能修飾名詞，否定用じゃない。</p>
<div class="toolbar">
<a class="download" href="./keiyoushi.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音，朗讀的是漢字句。可用性依瀏覽器與系統而異。</span>
</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>いい的否定和過去用よい：よくないです、よかったです。<br>な形容詞修飾名詞時才加な：便利な店。</div>
<nav class="pager"><a href="../joshi/">← 助詞</a><a href="../masu/">ます形 →</a></nav>
</main>
<footer>形容詞 · 日文 N5</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "い形容詞", "meaning": "い收尾", "rows": [["現在", "この本は高いです。", "この ほん は たかい です。", "Kono hon wa takai desu."], ["否定", "この本は高くないです。", "この ほん は たかくない です。", "Kono hon wa takakunai desu."], ["過去", "昨日は寒かったです。", "きのう は さむかった です。", "Kinou wa samukatta desu."], ["いい", "今日はよかったです。", "きょう は よかった です。", "Kyou wa yokatta desu."]], "examples": [["この本は高いです。", "この ほん は たかい です。", "Kono hon wa takai desu.", "這本書很貴。"], ["今日はあまり寒くないです。", "きょう は あまり さむくない です。", "Kyou wa amari samukunai desu.", "今天不太冷。"], ["昨日の映画はよかったです。", "きのう の えいが は よかった です。", "Kinou no eiga wa yokatta desu.", "昨天的電影很好。"], ["この問題は難しくないです。", "この もんだい は むずかしくない です。", "Kono mondai wa muzukashikunai desu.", "這個問題不難。"]]}, {"name": "な形容詞", "meaning": "後面接な", "rows": [["現在", "この店は便利です。", "この みせ は べんり です。", "Kono mise wa benri desu."], ["否定", "有名じゃないです。", "ゆうめい じゃない です。", "Yuumei janai desu."], ["過去", "昨日は暇でした。", "きのう は ひま でした。", "Kinou wa hima deshita."], ["修飾", "便利な店です。", "べんり な みせ です。", "Benri na mise desu."]], "examples": [["駅の前は便利です。", "えき の まえ は べんり です。", "Eki no mae wa benri desu.", "車站前面很方便。"], ["あの店は有名です。", "あの みせ は ゆうめい です。", "Ano mise wa yuumei desu.", "那家店很有名。"], ["今日は暇じゃありません。", "きょう は ひま じゃ ありません。", "Kyou wa hima ja arimasen.", "我今天沒空。"], ["きれいな花ですね。", "きれい な はな です ね。", "Kirei na hana desu ne.", "好漂亮的花啊。"]]}, {"name": "修飾名詞", "meaning": "放在名詞前面", "rows": [["い", "新しい本", "あたらしい ほん", "atarashii hon"], ["い否定", "高くない本", "たかくない ほん", "takakunai hon"], ["な", "有名な人", "ゆうめい な ひと", "yuumei na hito"], ["きれい", "きれいな町", "きれい な まち", "kirei na machi"]], "examples": [["新しい本を買いました。", "あたらしい ほん を かいました。", "Atarashii hon o kaimashita.", "我買了新書。"], ["小さい猫がいます。", "ちいさい ねこ が います。", "Chiisai neko ga imasu.", "有一隻小貓。"], ["有名な先生です。", "ゆうめい な せんせい です。", "Yuumei na sensei desu.", "是一位有名的老師。"], ["きれいな町ですね。", "きれい な まち です ね。", "Kirei na machi desu ne.", "好漂亮的城鎮啊。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
