<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="法文 A1 必背：être、avoir、s'appeler 現在式變位、例句、中文翻譯與發音。"><title>Bonjour Verbes｜法文 A1 三大動詞</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#182a45;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#132f55;color:white;padding:22px max(20px,calc((100vw - 1050px)/2))}header .brand{font-size:1.35rem;font-weight:800;letter-spacing:.02em}main{max-width:1050px;margin:auto;padding:32px 20px 70px}h1{font-size:clamp(1.8rem,4vw,2.65rem);margin:0 0 8px}h2{font-size:1.55rem;margin:0}p{line-height:1.7}.intro{margin-bottom:24px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 28px}.download,button{cursor:pointer;border:0;border-radius:9px;font:inherit}.download{display:inline-block;background:#df3349;color:white;padding:12px 18px;text-decoration:none;font-weight:700}.download:hover{background:#b91f35}.note{font-size:.92rem;color:#52647d}.card{background:white;border:1px solid #dce4f0;border-radius:16px;box-shadow:0 8px 24px #142f5210;margin:20px 0;padding:23px}.cardhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.meaning{color:#52647d}.tablewrap{overflow-x:auto;margin-top:18px}table{border-collapse:collapse;width:100%;min-width:610px;text-align:left}th{background:#eaf0f9;font-size:.9rem}th,td{padding:13px 14px;border-bottom:1px solid #e4e9f1}td:nth-child(2){font-weight:750;color:#173e71}.examples{margin-top:22px}.examples h3{font-size:1.07rem;margin:0 0 10px}.example{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #edf0f5}.fr{font-size:1.03rem;font-weight:700}.zh{color:#53637b;margin-top:3px}.speak{background:#e7f0fd;color:#163b6a;padding:9px 12px;min-width:84px}.speak:hover,.speak:focus-visible{background:#cedffa;outline:2px solid #3769a9;outline-offset:2px}.tip{background:#e9eff8;border-left:4px solid #5276aa;padding:14px 18px;border-radius:8px;margin-top:20px}footer{max-width:1050px;margin:auto;padding:20px;color:#627087;font-size:.9rem}@media(max-width:600px){main{padding-top:25px}.card{padding:17px}.example{grid-template-columns:1fr auto}}</style></head><body><header><div class="brand"><a href="../index.html" style="color:inherit;text-decoration:none">← 四語筆記首頁</a>　/　Bonjour Verbes</div></header><main><div class="intro"><h1>法文 A1｜三個必背動詞</h1><p>把六組人稱和現在式一起記：<strong>être</strong>（是）、<strong>avoir</strong>（有）、<strong>s’appeler</strong>（叫做）。先看表，再按例句旁的播放鍵跟讀。</p><div class="toolbar"><a class="download" href="./Bonjour-Verbes-A1.pdf" download>下載完整 PDF</a><span class="note">發音使用裝置的法語語音；可用性依瀏覽器與系統而異。</span></div></div><div id="content"></div><div class="tip"><strong>拼字提醒：</strong>vous <strong>êtes</strong>、ils / elles <strong>sont</strong>、<strong>s’appeler</strong>。年齡用 avoir：<em>J’ai 25 ans.</em>（我 25 歲。）</div></main><footer>Bonjour Verbes · 法語入門變位與跟讀小抄</footer><script>
const groups=[{name:'Être',meaning:'是／處於',rows:[['je','je suis','我是'],['tu','tu es','你是'],['il / elle','il / elle est','他／她是'],['nous','nous sommes','我們是'],['vous','vous êtes','您／你們是'],['ils / elles','ils / elles sont','他們／她們是']],examples:[['Je suis étudiant.','我是學生。'],['Tu es prêt ?','你準備好了嗎？'],['Elle est française.','她是法國人。'],['Nous sommes à Taipei.','我們在台北。'],['Vous êtes professeur ?','您是老師嗎？'],['Ils sont ici.','他們在這裡。']]},{name:'Avoir',meaning:'有；表達年齡',rows:[['je','j’ai','我有'],['tu','tu as','你有'],['il / elle','il / elle a','他／她有'],['nous','nous avons','我們有'],['vous','vous avez','您／你們有'],['ils / elles','ils / elles ont','他們／她們有']],examples:[['J’ai 25 ans.','我 25 歲。'],['Tu as un livre.','你有一本書。'],['Il a un frère.','他有一個兄弟。'],['Nous avons un cours.','我們有一堂課。'],['Vous avez une question ?','您有問題嗎？'],['Elles ont des amis.','她們有朋友。']]},{name:'S’appeler',meaning:'叫做／名字是',rows:[['je','je m’appelle','我叫'],['tu','tu t’appelles','你叫'],['il / elle','il / elle s’appelle','他／她叫'],['nous','nous nous appelons','我們叫'],['vous','vous vous appelez','您／你們叫'],['ils / elles','ils / elles s’appellent','他們／她們叫']],examples:[['Je m’appelle Hao-Cheng.','我叫 Hao-Cheng。'],['Tu t’appelles comment ?','你叫什麼名字？'],['Elle s’appelle Marie.','她叫 Marie。'],['Nous nous appelons les Bleus.','我們叫做「藍隊」。'],['Vous vous appelez comment ?','您叫什麼名字？'],['Ils s’appellent Paul et Marc.','他們叫 Paul 和 Marc。']]}];
const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');document.querySelector('#content').innerHTML=groups.map(g=>`<section class="card"><div class="cardhead"><h2>${esc(g.name)}</h2><span class="meaning">${esc(g.meaning)}</span></div><div class="tablewrap"><table><thead><tr><th scope="col">人稱</th><th scope="col">現在式</th><th scope="col">中文</th></tr></thead><tbody>${g.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>${g.examples.map(([fr,zh])=>`<div class="example"><div><div class="fr" lang="fr">${esc(fr)}</div><div class="zh">${esc(zh)}</div></div><button class="speak" type="button" data-fr="${esc(fr)}" aria-label="播放法語：${esc(fr)}">▶ 播放</button></div>`).join('')}</div></section>`).join('');document.addEventListener('click',e=>{let b=e.target.closest('.speak');if(!b)return;if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音播放。');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(b.dataset.fr);u.lang='fr-FR';u.rate=.82;let voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('fr'));if(voice)u.voice=voice;speechSynthesis.speak(u)});
</script></body></html>
