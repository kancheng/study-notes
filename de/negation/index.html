<style>

*{box-sizing:border-box}

<body>
<header><div class="brand"><a href="../index.html">← 德文筆記</a>　/　Nicht und Kein</div></header>
<main>
<div class="intro">
<h1>德文 A1｜nicht 與 kein</h1>
<p>否定名詞用 kein。否定動詞、形容詞或介系詞片語用 nicht。</p>
<div class="toolbar">
<a class="download" href="./negation.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的德語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>有冠詞或想說沒有某個名詞時用 kein：kein Auto，keine Zeit，keinen Kaffee。<br>nicht 常放在句尾，或放在形容詞和介系詞片語前面。</div>
<nav class="pager"><a href="../possessiv/">← Possessiv</a><a href="../koennen/">Können →</a></nav>
</main>
<footer>Nicht und Kein · 德文 A1</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "nicht", "meaning": "否定動詞、形容詞、地方", "rows": [["動詞", "Ich arbeite nicht.", "我不工作。"], ["形容詞", "Das ist nicht teuer.", "那不貴。"], ["地方", "Sie ist nicht in Berlin.", "她不在柏林。"], ["時間", "Heute lerne ich nicht.", "我今天不學習。"]], "examples": [["Ich arbeite am Sonntag nicht.", "我星期天不工作。"], ["Das Buch ist nicht neu.", "這本書不是新的。"], ["Er kommt heute nicht.", "他今天不來。"], ["Am Abend koche ich nicht.", "晚上我不煮飯。"]]}, {"name": "kein", "meaning": "否定名詞，詞尾像 ein", "rows": [["陽性主格", "kein Kurs", "沒有課"], ["陽性受格", "keinen Kaffee", "沒有咖啡"], ["陰性", "keine Zeit", "沒有時間"], ["複數", "keine Bücher", "沒有書"]], "examples": [["Ich habe kein Auto.", "我沒有車。"], ["Sie kauft keinen Kaffee.", "她不買咖啡。"], ["Wir haben keine Zeit.", "我們沒有時間。"], ["Hier gibt es keine Milch.", "這裡沒有牛奶。"]]}, {"name": "對比", "meaning": "同一個意思不要混用", "rows": [["不是老師", "Er ist nicht Lehrer.", "他不是老師。"], ["沒有老師", "Es gibt keinen Lehrer.", "沒有老師。"], ["不貴", "Das ist nicht teuer.", "那不貴。"], ["沒有問題", "Ich habe keine Frage.", "我沒有問題。"]], "examples": [["Ich bin nicht müde.", "我不累。"], ["Ich habe keinen Hunger.", "我不餓。"], ["Das ist kein Fehler.", "那不是錯誤。"], ["Sie spricht nicht laut.", "她說話不大聲。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="de">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="de">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放德語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('de'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
