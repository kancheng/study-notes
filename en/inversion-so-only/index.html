<header><div class="brand"><a href="../index.html">← 英文筆記</a>　/　So and Only</div></header>
<main>
<div class="intro">
<h1>英文 B2｜so、neither 與 only</h1>
<p>So 接肯定的「也是」，Neither 接否定的「也不」。Only 放在句首修飾時間或條件時，主要句子要倒裝。</p>
<div class="toolbar">
<a class="download" href="./inversion-so-only.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的英語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>So 和 Neither 後面的助動詞要跟前一句相同。前一句是 be，就用 be。</div>
<nav class="pager"><a href="../inversion-negative/">← Negative Inversion</a><a href="../cleft/">Cleft Sentences →</a></nav>
</main>
<footer>So and Only · 英文 B2</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "so / neither", "meaning": "也是、也不", "rows": [["也是", "So do I.", "我也是。"], ["也是", "So is she.", "她也是。"], ["也不", "Neither can I.", "我也不能。"], ["也不", "Neither did he.", "他也沒有。"]], "examples": [["I like tea. So do I.", "我喜歡茶。我也是。"], ["She is ready. So is he.", "她準備好了。他也是。"], ["I cannot swim. Neither can she.", "我不會游泳。她也不會。"], ["He did not go. Neither did I.", "他沒去。我也沒去。"]]}, {"name": "only + 時間", "meaning": "句首倒裝", "rows": [["那時", "Only then did I understand.", "直到那時我才懂。"], ["後來", "Only later did she know.", "直到後來她才知道。"], ["昨天", "Only yesterday did he call.", "直到昨天才打來。"], ["現在", "Only now do we see.", "直到現在我們才看見。"]], "examples": [["Only then did I understand.", "直到那時我才懂。"], ["Only later did she know the truth.", "直到後來她才知道真相。"], ["Only yesterday did he call.", "直到昨天才打來。"], ["Only now do we see the problem.", "直到現在我們才看見問題。"]]}, {"name": "only if / when", "meaning": "條件在前", "rows": [["只有當", "Only when I arrived did I see", "只有當我到達時才看見"], ["只有如果", "Only if you try will you", "只有如果你試，你才會"], ["只有在", "Only in Taipei can you", "只有在台北你才能"], ["只有這樣", "Only in this way can we", "只有這樣我們才能"]], "examples": [["Only when I arrived did I see her.", "只有當我到達時，我才看見她。"], ["Only if you try will you learn.", "只有如果你試，你才會學會。"], ["Only in Taipei can you eat this.", "只有在台北你才能吃到這個。"], ["Only in this way can we finish.", "只有這樣我們才能做完。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="en">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="en">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放英語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('en'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
