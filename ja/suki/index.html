<style>

<body>
<header><div class="brand"><a href="../index.html">← 日文筆記</a>　/　好き・たい</div></header>
<main>
<div class="intro">
<h1>日文 N5｜好き與たい</h1>
<p>好き、嫌い、上手、下手是な形容詞，對象用が。たい接在ます形的詞幹後面，表示想做。</p>
<div class="toolbar">
<a class="download" href="./suki.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音，朗讀的是漢字句。可用性依瀏覽器與系統而異。</span>
</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>喜歡的對象用が，不用を：日本語が好きです。<br>たい的對象也常用が：水が飲みたいです。</div>
<nav class="pager"><a href="../kazoe/">← 助数詞</a><a href="../tekudasai/">ましょう →</a></nav>
</main>
<footer>好き・たい · 日文 N5</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "好き", "meaning": "喜歡與不喜歡", "rows": [["喜歡", "日本語が好きです。", "にほんご が すき です。", "Nihongo ga suki desu."], ["不喜歡", "歌が嫌いです。", "うた が きらい です。", "Uta ga kirai desu."], ["最喜歡", "猫が一番好きです。", "ねこ が いちばん すき です。", "Neko ga ichiban suki desu."], ["喜歡的", "好きな食べ物は何ですか。", "すき な たべもの は なん です か。", "Suki na tabemono wa nan desu ka."]], "examples": [["私は日本語が好きです。", "わたし は にほんご が すき です。", "Watashi wa nihongo ga suki desu.", "我喜歡日文。"], ["魚が嫌いです。", "さかな が きらい です。", "Sakana ga kirai desu.", "我不喜歡魚。"], ["コーヒーが一番好きです。", "コーヒー が いちばん すき です。", "Koohii ga ichiban suki desu.", "我最喜歡咖啡。"], ["好きな色は青です。", "すき な いろ は あお です。", "Suki na iro wa ao desu.", "我喜歡的顏色是藍色。"]]}, {"name": "上手", "meaning": "擅長與想要的東西", "rows": [["擅長", "字が上手です。", "じ が じょうず です。", "Ji ga jouzu desu."], ["不擅長", "料理が下手です。", "りょうり が へた です。", "Ryouri ga heta desu."], ["想要", "新しい本がほしいです。", "あたらしい ほん が ほしい です。", "Atarashii hon ga hoshii desu."], ["不要", "今は要りません。", "いま は いりません。", "Ima wa irimasen."]], "examples": [["妹は歌が上手です。", "いもうと は うた が じょうず です。", "Imouto wa uta ga jouzu desu.", "妹妹很會唱歌。"], ["私は料理が下手です。", "わたし は りょうり が へた です。", "Watashi wa ryouri ga heta desu.", "我不太會做菜。"], ["時間がほしいです。", "じかん が ほしい です。", "Jikan ga hoshii desu.", "我想要時間。"], ["この傘はいりません。", "この かさ は いりません。", "Kono kasa wa irimasen.", "這把傘我不需要。"]]}, {"name": "たい", "meaning": "想做某事", "rows": [["想喝", "水が飲みたいです。", "みず が のみたい です。", "Mizu ga nomitai desu."], ["想去", "日本へ行きたいです。", "にほん へ いきたい です。", "Nihon e ikitai desu."], ["想吃", "寿司を食べたいです。", "すし を たべたい です。", "Sushi o tabetai desu."], ["不想", "今日は出かけたくないです。", "きょう は でかけたくない です。", "Kyou wa dekaketakunai desu."]], "examples": [["冷たい水が飲みたいです。", "つめたい みず が のみたい です。", "Tsumetai mizu ga nomitai desu.", "我想喝冷水。"], ["来年、日本へ行きたいです。", "らいねん、 にほん へ いきたい です。", "Rainen, nihon e ikitai desu.", "我明年想去日本。"], ["何を食べたいですか。", "なに を たべたい です か。", "Nani o tabetai desu ka.", "你想吃什麼？"], ["今日はあまり歩きたくないです。", "きょう は あまり あるきたくない です。", "Kyou wa amari arukitakunai desu.", "我今天不太想走路。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
</body>
