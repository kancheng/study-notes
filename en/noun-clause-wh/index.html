<div class="intro">
<h1>英文 B1｜whether 與疑問詞子句</h1>
<p>不確定是不是，用 whether 或 if。問的是什麼、誰、哪裡，就把疑問詞放在子句開頭，後面用陳述句語序。</p>

</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>介系詞後面用 whether，不用 if：I am worried about whether he will come.</div>

<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "whether / if", "meaning": "是否", "rows": [["是否", "whether she will come", "她會不會來"], ["是否", "if he knows", "他知不知道"], ["是否要", "whether to go", "要不要去"], ["是否", "whether it is true", "是不是真的"]], "examples": [["I do not know whether she will come.", "我不知道她會不會來。"], ["Ask if he knows the answer.", "問問他知不知道答案。"], ["She cannot decide whether to go.", "她無法決定要不要去。"], ["I wonder whether it is true.", "我想知道這是不是真的。"]]}, {"name": "what / who", "meaning": "什麼、誰", "rows": [["什麼", "what he wants", "他想要什麼"], ["誰", "who she is", "她是誰"], ["哪一個", "which book you need", "你需要哪本書"], ["什麼", "what happened", "發生了什麼"]], "examples": [["I know what he wants.", "我知道他想要什麼。"], ["Do you know who she is?", "你知道她是誰嗎？"], ["Tell me which book you need.", "告訴我你需要哪本書。"], ["Nobody knows what happened.", "沒有人知道發生了什麼事。"]]}, {"name": "where / when / why", "meaning": "地點、時間、原因", "rows": [["哪裡", "where she lives", "她住哪裡"], ["何時", "when the class starts", "課何時開始"], ["為什麼", "why he left", "他為什麼離開"], ["如何", "how it works", "它怎麼運作"]], "examples": [["I know where she lives.", "我知道她住哪裡。"], ["Please tell me when the class starts.", "請告訴我課何時開始。"], ["I understand why he left.", "我了解他為什麼離開。"], ["She explained how it works.", "她說明了它怎麼運作。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="en">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="en">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放英語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('en'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
