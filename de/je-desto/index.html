<div class="intro">
<h1>德文 B2｜je ... desto 與 sodass</h1>
<p>je 從句的動詞在句尾，desto 後面的動詞在第二位。sodass 表示結果，動詞在句尾。indem 表示做法。</p>
<div class="toolbar">
<a class="download" href="./je-desto.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的德語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>Je mehr ich lese, desto besser verstehe ich。desto 後面不要再把動詞送到句尾。<br>indem 回答怎麼做。sodass 回答因此發生了什麼。</div>

<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "je ... desto", "meaning": "兩邊都是比較級", "rows": [["越多", "je mehr ... desto besser", "越多就越好"], ["越久", "je länger ... desto teurer", "越久就越貴"], ["越早", "je früher ... desto leichter", "越早就越容易"], ["詞序", "je 句尾，desto 第二位", "兩個位置不同"]], "examples": [["Je mehr ich lese, desto besser verstehe ich den Text.", "我讀得越多，就越懂這篇課文。"], ["Je länger wir warten, desto teurer wird das Ticket.", "我們等得越久，票就越貴。"], ["Je früher du anfängst, desto leichter wird es.", "你開始得越早，就越容易。"], ["Je öfter man spricht, desto sicherer wird man.", "說得越頻繁，就越有把握。"]]}, {"name": "indem 與 sodass", "meaning": "做法，以及結果", "rows": [["藉由", "indem man laut liest", "藉由大聲讀"], ["因而", "sodass ich nichts verstand", "因而我什麼都聽不懂"], ["動詞", "兩邊都在從句句尾", "liest、verstand"], ["逗號", "主句之後", "indem 和 sodass 前都要逗號"]], "examples": [["Man verbessert die Aussprache, indem man laut liest.", "藉由大聲讀，可以改善發音。"], ["Es war laut, sodass ich nichts verstand.", "聲音很大，因而我什麼都聽不懂。"], ["Sie erklärt die Regel, indem sie ein Beispiel gibt.", "她舉一個例子來說明規則。"], ["Der Text ist lang, sodass wir ihn teilen.", "課文很長，所以我們把它分開。"]]}, {"name": "nicht nur ... sondern auch", "meaning": "兩件事並列", "rows": [["兩者", "nicht nur ... sondern auch", "不僅……而且……"], ["名詞", "nicht nur Grammatik, sondern auch Wortschatz", "不僅文法，還有詞彙"], ["動詞", "兩邊形式相同", "學，也說"], ["不要只留一邊", "sondern auch 不能省", "也"]], "examples": [["Ich lerne nicht nur Grammatik, sondern auch Aussprache.", "我學的不僅是文法，還有發音。"], ["Sie spricht nicht nur Deutsch, sondern auch Englisch.", "她不僅說德文，也說英文。"], ["Er hat nicht nur angerufen, sondern auch geschrieben.", "他不僅打了電話，還寫了信。"], ["Das ist nicht nur schwer, sondern auch interessant.", "那不僅難，而且有趣。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="de">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="de">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放德語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('de'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
