<h1>日文 N2｜ことはない、わけではない</h1>
<p>ことはない是「不必、不會有那種情況」。わけではない是「並非如此」，用來把話說得不那麼絕對。</p>
<div class="toolbar">
<a class="download" href="./kotowanai.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音，朗讀的是漢字句。可用性依瀏覽器與系統而異。</span>
</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>
</div>
<div id="content"></div>

<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "ことはない", "meaning": "不必、不會", "rows": [["不必擔心", "心配することはありません。", "しんぱい する こと は ありません。", "Shinpai suru koto wa arimasen."], ["不必急", "そんなに急ぐことはありません。", "そんな に いそぐ こと は ありません。", "Sonna ni isogu koto wa arimasen."], ["不會忘", "彼が約束を忘れることはありません。", "かれ が やくそく を わすれる こと は ありません。", "Kare ga yakusoku o wasureru koto wa arimasen."], ["不必謝", "礼を言うことはありません。", "れい を いう こと は ありません。", "Rei o iu koto wa arimasen."]], "examples": [["一人で行けます。心配することはありません。", "ひとり で いけます。 しんぱい する こと は ありません。", "Hitori de ikemasu. shinpai suru koto wa arimasen.", "我可以一個人去，不必擔心。"], ["まだ時間があります。急ぐことはありません。", "まだ じかん が あります。 いそぐ こと は ありません。", "Mada jikan ga arimasu. isogu koto wa arimasen.", "還有時間，不必急。"], ["この機械が急に止まることはありません。", "この きかい が きゅう に とまる こと は ありません。", "Kono kikai ga kyuu ni tomaru koto wa arimasen.", "這台機器不會突然停住。"], ["謝ることはありません。私が悪かったです。", "あやまる こと は ありません。 わたし が わるかった です。", "Ayamaru koto wa arimasen. watashi ga warukatta desu.", "不必道歉，是我不好。"]]}, {"name": "ないことはない", "meaning": "並非不能", "rows": [["不是不會吃", "食べられないことはありません。", "たべられない こと は ありません。", "Taberarenai koto wa arimasen."], ["不是不會說", "話せないことはありません。少しなら、話せます。", "はなせない こと は ありません。 すこし なら、 はなせます。", "Hanasenai koto wa arimasen. sukoshi nara, hanasemasu."], ["不是不去", "行かないことはありません。", "いかない こと は ありません。", "Ikanai koto wa arimasen."], ["不是不懂", "分からないことはありません。", "わからない こと は ありません。", "Wakaranai koto wa arimasen."]], "examples": [["苦手ですが、できないことはありません。", "にがて です が、 できない こと は ありません。", "Nigate desu ga, dekinai koto wa arimasen.", "我不擅長，但並不是不會。"], ["高くても、買えないことはありません。", "たかくても、 かえない こと は ありません。", "Takakutemo, kaenai koto wa arimasen.", "即使貴，也不是買不起。"], ["忙しくても、手伝えないことはありません。", "いそがしくても、 てつだえない こと は ありません。", "Isogashikutemo, tetsudaenai koto wa arimasen.", "即使忙，也不是幫不上忙。"], ["その漢字は、読めないことはありません。", "その かんじ は、 よめない こと は ありません。", "Sono kanji wa, yomenai koto wa arimasen.", "那個漢字並不是不會讀。"]]}, {"name": "わけではない", "meaning": "並非", "rows": [["並非沒時間", "時間がないわけではありません。少しなら、手伝えます。", "じかん が ない わけ で は ありません。 すこし なら、 てつだえます。", "Jikan ga nai wake de wa arimasen. sukoshi nara, tetsudaemasu."], ["並非全部不好", "全部が悪いわけではありません。", "ぜんぶ が わるい わけ で は ありません。", "Zenbu ga warui wake de wa arimasen."], ["並非不懂", "分からないわけではありません。少し難しいだけです。", "わからない わけ で は ありません。 すこし むずかしい だけ です。", "Wakaranai wake de wa arimasen. sukoshi muzukashii dake desu."], ["並非討厭", "嫌いなわけではありません。", "きらい な わけ で は ありません。", "Kirai na wake de wa arimasen."]], "examples": [["行きたくないわけではありません。今日は都合が悪いだけです。", "いきたくない わけ で は ありません。 きょう は つごう が わるい だけ です。", "Ikitakunai wake de wa arimasen. kyou wa tsugou ga warui dake desu.", "並不是不想去，只是今天不方便。"], ["反対しているわけではありません。", "はんたい して いる わけ で は ありません。", "Hantai shite iru wake de wa arimasen.", "我並不是在反對。"], ["毎日勉強しているわけではありません。", "まいにち べんきょう して いる わけ で は ありません。", "Mainichi benkyou shite iru wake de wa arimasen.", "並不是每天都在學習。"], ["簡単だと言っているわけではありません。", "かんたん だ と いって いる わけ で は ありません。", "Kantan da to itte iru wake de wa arimasen.", "我並不是說這很簡單。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
