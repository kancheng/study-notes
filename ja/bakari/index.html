<main>
<div class="intro">
<h1>日文 N3｜たばかり與ところ</h1>
<p>たばかり是剛剛做完。ところは動作的時間點：するところ是正要做，しているところ是正在做，したところ是剛剛做完。</p>
<div class="toolbar">
<a class="download" href="./bakari.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音，朗讀的是漢字句。可用性依瀏覽器與系統而異。</span>
</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>たばかり可以是稍早之前，したところ幾乎是剛剛。<br>ところ前面的形決定是將要、正在還是剛完。</div>
<nav class="pager"><a href="../kotoni/">← ことにする</a><a href="../hazu/">はず・わけ・らしい →</a></nav>
</main>
<footer>ばかり・ところ · 日文 N3</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "たばかり", "meaning": "剛剛", "rows": [["剛吃完", "今、昼ごはんを食べたばかりです。", "いま、 ひるごはん を たべた ばかり です。", "Ima, hirugohan o tabeta bakari desu."], ["剛到", "日本に来たばかりです。", "にほん に きた ばかり です。", "Nihon ni kita bakari desu."], ["剛開始", "日本語を始めたばかりです。", "にほんご を はじめた ばかり です。", "Nihongo o hajimeta bakari desu."], ["剛搬", "この町に引っ越したばかりです。", "この まち に ひっこした ばかり です。", "Kono machi ni hikkoshita bakari desu."]], "examples": [["起きたばかりで、まだ眠いです。", "おきた ばかり で、 まだ ねむい です。", "Okita bakari de, mada nemui desu.", "我剛起床，還很想睡。"], ["このカメラは買ったばかりです。", "この カメラ は かった ばかり です。", "Kono kamera wa katta bakari desu.", "這台相機是剛買的。"], ["入社したばかりの社員です。", "にゅうしゃ した ばかり の しゃいん です。", "Nyuusha shita bakari no shain desu.", "是剛進公司的職員。"], ["習ったばかりなのに、忘れました。", "ならった ばかり な の に、 わすれました。", "Naratta bakari na no ni, wasuremashita.", "才剛學過卻忘了。"]]}, {"name": "ところ", "meaning": "正要、正在、剛完", "rows": [["正要出門", "今から出かけるところです。", "いま から でかける ところ です。", "Ima kara dekakeru tokoro desu."], ["正在吃飯", "今、ご飯を食べているところです。", "いま、 ごはん を たべて いる ところ です。", "Ima, gohan o tabete iru tokoro desu."], ["剛回來", "彼は今、帰ったところです。", "かれ は いま、 かえった ところ です。", "Kare wa ima, kaetta tokoro desu."], ["正要睡", "寝るところでした。", "ねる ところ でした。", "Neru tokoro deshita."]], "examples": [["ちょうど出かけるところです。", "ちょうど でかける ところ です。", "Choudo dekakeru tokoro desu.", "我正好要出門。"], ["今、レポートを書いているところです。", "いま、 レポート を かいて いる ところ です。", "Ima, repooto o kaite iru tokoro desu.", "我正在寫報告。"], ["今、駅に着いたところです。", "いま、 えき に ついた ところ です。", "Ima, eki ni tsuita tokoro desu.", "我剛剛到車站。"], ["電話したとき、出かけるところでした。", "でんわ した とき、 でかける ところ でした。", "Denwa shita toki, dekakeru tokoro deshita.", "打電話來的時候，我正要出門。"]]}, {"name": "ばかりだ", "meaning": "淨是、只是", "rows": [["淨是玩", "弟は遊んでばかりいます。", "おとうと は あそんで ばかり います。", "Otouto wa asonde bakari imasu."], ["淨是抱怨", "文句を言ってばかりです。", "もんく を いって ばかり です。", "Monku o itte bakari desu."], ["只是看", "見ているばかりで、手伝いません。", "みて いる ばかり で、 てつだいません。", "Mite iru bakari de, tetsudaimasen."], ["淨是吃", "甘いものばかり食べています。", "あまい もの ばかり たべて います。", "Amai mono bakari tabete imasu."]], "examples": [["最近、忙しくて、寝てばかりです。", "さいきん、 いそがしくて、 ねて ばかり です。", "Saikin, isogashikute, nete bakari desu.", "最近太忙，淨是在睡。"], ["彼は文句ばかり言っています。", "かれ は もんく ばかり いって います。", "Kare wa monku bakari itte imasu.", "他淨是在抱怨。"], ["高いものばかり見ないで、買いましょう。", "たかい もの ばかり みないで、 かいましょう。", "Takai mono bakari minaide, kaimashou.", "別淨看貴的，我們買吧。"], ["勉強しないで、遊んでばかりいてはいけません。", "べんきょう しない で、 あそんで ばかり いて は いけません。", "Benkyou shinai de, asonde bakari ite wa ikemasen.", "不能不學習、淨玩。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
