<style>

<body>
<header><div class="brand"><a href="../index.html">← 日文筆記</a>　/　た形</div></header>
<main>
<div class="intro">
<h1>日文 N4｜たことがある與たり</h1>
<p>たことがある是曾經做過。たりたりは舉出幾個例子，不是只做這兩件。後面接します。</p>
<div class="toolbar">
<a class="download" href="./takoto.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音，朗讀的是漢字句。可用性依瀏覽器與系統而異。</span>
</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>たり的動詞都要用た形。<br>最後是します，不是ました，除非整句是過去。</div>
<nav class="pager"><a href="../jishokei/">← 辞書形</a><a href="../ageru/">あげる・くれる・もらう →</a></nav>
</main>
<footer>た形 · 日文 N4</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "たことがある", "meaning": "經驗", "rows": [["去過", "日本へ行ったことがあります。", "にほん へ いった こと が あります。", "Nihon e itta koto ga arimasu."], ["吃過", "寿司を食べたことがあります。", "すし を たべた こと が あります。", "Sushi o tabeta koto ga arimasu."], ["沒看過", "この映画を見たことがありません。", "この えいが を みた こと が ありません。", "Kono eiga o mita koto ga arimasen."], ["問", "富士山に登ったことがありますか。", "ふじさん に のぼった こと が あります か。", "Fujisan ni nobotta koto ga arimasu ka."]], "examples": [["私は京都へ行ったことがあります。", "わたし は きょうと へ いった こと が あります。", "Watashi wa kyouto e itta koto ga arimasu.", "我去過京都。"], ["納豆を食べたことがありません。", "なっとう を たべた こと が ありません。", "Nattou o tabeta koto ga arimasen.", "我沒吃過納豆。"], ["この歌を聞いたことがあります。", "この うた を きいた こと が あります。", "Kono uta o kiita koto ga arimasu.", "我聽過這首歌。"], ["馬に乗ったことがありますか。", "うま に のった こと が あります か。", "Uma ni notta koto ga arimasu ka.", "你騎過馬嗎？"]]}, {"name": "たり", "meaning": "又是……又是", "rows": [["週末", "映画を見たり、本を読んだりします。", "えいが を みたり、 ほん を よんだり します。", "Eiga o mitari, hon o yondari shimasu."], ["假日", "散歩したり、買い物したりします。", "さんぽ したり、 かいもの したり します。", "Sanpo shitari, kaimono shitari shimasu."], ["昨天", "話したり、笑ったりしました。", "はなしたり、 わらったり しました。", "Hanashitari, warattari shimashita."], ["吃", "寿司を食べたり、ラーメンを食べたりします。", "すし を たべたり、 ラーメン を たべたり します。", "Sushi o tabetari, raamen o tabetari shimasu."]], "examples": [["週末は、寝たり、テレビを見たりします。", "しゅうまつ は、 ねたり、 テレビ を みたり します。", "Shuumatsu wa, netari, terebi o mitari shimasu.", "週末我會睡覺、看電視之類的。"], ["暇なとき、料理をしたり、音楽を聞いたりします。", "ひま な とき、 りょうり を したり、 おんがく を きいたり します。", "Hima na toki, ryouri o shitari, ongaku o kiitari shimasu.", "有空的時候我會做菜、聽音樂。"], ["昨日は、買ったり、歩いたりしました。", "きのう は、 かったり、 あるいたり しました。", "Kinou wa, kattari, aruitari shimashita.", "昨天我又買東西又走路。"], ["子供のとき、泳いだり、走ったりしました。", "こども の とき、 およいだり、 はしったり しました。", "Kodomo no toki, oyoidari, hashittari shimashita.", "小時候我會游泳、跑步。"]]}, {"name": "た後で", "meaning": "做完之後", "rows": [["吃完", "ご飯を食べた後で、散歩します。", "ごはん を たべた あと で、 さんぽ します。", "Gohan o tabeta ato de, sanpo shimasu."], ["看完", "映画を見た後で、食事をします。", "えいが を みた あと で、 しょくじ を します。", "Eiga o mita ato de, shokuji o shimasu."], ["到了", "家に着いた後で、電話します。", "いえ に ついた あと で、 でんわ します。", "Ie ni tsuita ato de, denwa shimasu."], ["問完", "聞いた後で、決めてください。", "きいた あと で、 きめて ください。", "Kiita ato de, kimete kudasai."]], "examples": [["仕事が終わった後で、飲みに行きます。", "しごと が おわった あと で、 のみ に いきます。", "Shigoto ga owatta ato de, nomi ni ikimasu.", "工作結束後我去喝一杯。"], ["本を読んだ後で、感想を書きます。", "ほん を よんだ あと で、 かんそう を かきます。", "Hon o yonda ato de, kansou o kakimasu.", "我看完書之後寫心得。"], ["シャワーを浴びた後で、寝ます。", "シャワー を あびた あと で、 ねます。", "Shawaa o abita ato de, nemasu.", "我洗完澡就睡。"], ["説明を聞いた後で、質問してください。", "せつめい を きいた あと で、 しつもん して ください。", "Setsumei o kiita ato de, shitsumon shite kudasai.", "聽完說明之後請提問。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
</body>
