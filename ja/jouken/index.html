<style>

<body>
<header><div class="brand"><a href="../index.html">← 日文筆記</a>　/　条件</div></header>
<main>
<div class="intro">
<h1>日文 N4｜たら、と、ば、なら</h1>
<p>たら是如果發生了某事。と是必然的結果。ば是條件。なら是對方剛剛說的話題，或某個身份。</p>
<div class="toolbar">
<a class="download" href="./jouken.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音，朗讀的是漢字句。可用性依瀏覽器與系統而異。</span>
</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>なら接在名詞或な形容詞的詞幹後面：学生なら、暇なら。<br>ば是仮定形：行けば、安ければ、来れば。</div>
<nav class="pager"><a href="../tsumori/">← つもり</a><a href="../souda/">そうだ →</a></nav>
</main>
<footer>条件 · 日文 N4</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "たら", "meaning": "如果、之後", "rows": [["有時間", "時間があったら、行きます。", "じかん が あったら、 いきます。", "Jikan ga attara, ikimasu."], ["到了", "家に着いたら、電話します。", "いえ に ついたら、 でんわ します。", "Ie ni tsuitara, denwa shimasu."], ["便宜", "安かったら、買います。", "やすかったら、 かいます。", "Yasukattara, kaimasu."], ["下雨", "雨が降ったら、中止です。", "あめ が ふったら、 ちゅうし です。", "Ame ga futtara, chuushi desu."]], "examples": [["暇だったら、一緒に食事しませんか。", "ひま だったら、 いっしょ に しょくじ しません か。", "Hima dattara, issho ni shokuji shimasen ka.", "如果有空，要不要一起吃飯？"], ["分からなかったら、聞いてください。", "わからなかったら、 きいて ください。", "Wakaranakattara, kiite kudasai.", "如果不懂，請問。"], ["春になったら、桜を見に行きます。", "はる に なったら、 さくら を み に いきます。", "Haru ni nattara, sakura o mi ni ikimasu.", "到了春天，我去看櫻花。"], ["終わったら、帰ってもいいです。", "おわったら、 かえっても いい です。", "Owattara, kaettemo ii desu.", "結束之後可以回去。"]]}, {"name": "と・ば", "meaning": "必然，以及條件", "rows": [["一到春天", "春になると、暖かくなります。", "はる に なる と、 あたたかく なります。", "Haru ni naru to, atatakaku narimasu."], ["按下", "このボタンを押すと、開きます。", "この ボタン を おす と、 あきます。", "Kono botan o osu to, akimasu."], ["如果便宜", "安ければ、買います。", "やすければ、 かいます。", "Yasukereba, kaimasu."], ["如果去", "早く行けば、間に合います。", "はやく いけば、 まに あいます。", "Hayaku ikeba, mani aimasu."]], "examples": [["右に曲がると、駅があります。", "みぎ に まがる と、 えき が あります。", "Migi ni magaru to, eki ga arimasu.", "往右拐就有車站。"], ["夜になると、冷えます。", "よる に なる と、 ひえます。", "Yoru ni naru to, hiemasu.", "到了晚上就會變冷。"], ["時間があれば、手伝ってください。", "じかん が あれば、 てつだって ください。", "Jikan ga areba, tetsudatte kudasai.", "如果有時間，請幫我。"], ["薬を飲めば、よくなります。", "くすり を のめば、 よく なります。", "Kusuri o nomeba, yoku narimasu.", "吃了藥就會好。"]]}, {"name": "なら", "meaning": "如果是", "rows": [["如果有空", "暇なら、一緒に行きませんか。", "ひま なら、 いっしょ に いきません か。", "Hima nara, issho ni ikimasen ka."], ["如果是學生", "学生なら、入れます。", "がくせい なら、 はいれます。", "Gakusei nara, hairemasu."], ["如果是明天", "明日なら、暇です。", "あした なら、 ひま です。", "Ashita nara, hima desu."], ["如果喜歡", "魚が好きなら、寿司はいかがですか。", "さかな が すき なら、 すし は いかが です か。", "Sakana ga suki nara, sushi wa ikaga desu ka."]], "examples": [["東京へ行くなら、春がいいです。", "とうきょう へ いく なら、 はる が いい です。", "Toukyou e iku nara, haru ga ii desu.", "如果去東京，春天比較好。"], ["安いなら、二つ買います。", "やすい なら、 ふたつ かいます。", "Yasui nara, futatsu kaimasu.", "如果便宜，我買兩個。"], ["病気なら、休んでください。", "びょうき なら、 やすんで ください。", "Byouki nara, yasunde kudasai.", "如果生病了，請休息。"], ["その店なら、駅の前にあります。", "その みせ なら、 えき の まえ に あります。", "Sono mise nara, eki no mae ni arimasu.", "如果是那家店，它在車站前面。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
