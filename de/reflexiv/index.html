<style>

*{box-sizing:border-box}
body{margin:0}

header .brand{font-size:1.35rem;font-weight:800}

main{max-width:1050px;margin:auto;padding:32px 20px 70px}

p{line-height:1.7}
.intro{margin-bottom:24px}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 28px}
.download,button{cursor:pointer;border:0;border-radius:9px;font:inherit}

<body>
<header><div class="brand"><a href="../index.html">← 德文筆記</a>　/　Reflexiv</div></header>
<main>
<div class="intro">
<h1>德文 A2｜反身動詞</h1>
<p>動作回到主詞自己身上時，用反身代名詞。第三人稱和尊稱用 sich，其餘用人稱受格或與格。</p>
<div class="toolbar">
<a class="download" href="./reflexiv.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的德語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>受格反身：mich、dich、sich、uns、euch、sich。<br>身體部位用與格反身，再加受格名詞：Ich wasche mir die Hände。</div>
<nav class="pager"><a href="../adjektiv/">← Adjektiv</a><a href="../nebensatz/">Nebensatz →</a></nav>
</main>
<footer>Reflexiv · 德文 A2</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "受格反身", "meaning": "洗自己、穿上、見面", "rows": [["我", "ich wasche mich", "我洗澡"], ["你", "du wäschst dich", "你洗澡"], ["他", "er zieht sich an", "他穿衣服"], ["我們", "wir treffen uns", "我們見面"]], "examples": [["Ich wasche mich jeden Morgen.", "我每天早上洗澡。"], ["Wäschst du dich mit kaltem Wasser?", "你用冷水洗澡嗎？"], ["Er zieht sich schnell an.", "他很快穿上衣服。"], ["Wir treffen uns um acht.", "我們八點見面。"]]}, {"name": "與格反身", "meaning": "洗自己的某個部位", "rows": [["手", "ich wasche mir die Hände", "我洗手"], ["牙", "du putzt dir die Zähne", "你刷牙"], ["頭髮", "er kämmt sich die Haare", "他梳頭髮"], ["完成式", "ich habe mir die Hände gewaschen", "我洗了手"]], "examples": [["Ich wasche mir die Hände.", "我洗手。"], ["Putzt du dir die Zähne?", "你刷牙了嗎？"], ["Sie kämmt sich die Haare.", "她梳頭髮。"], ["Er hat sich die Jacke angezogen.", "他穿上了外套。"]]}, {"name": "固定搭配", "meaning": "介系詞不能換", "rows": [["期待", "sich freuen auf + 受格", "期待尚未發生的事"], ["感到高興", "sich freuen über + 受格", "為已經發生的事高興"], ["對……有興趣", "sich interessieren für", "對某事有興趣"], ["坐下", "ich setze mich", "我坐下"]], "examples": [["Ich freue mich auf den Kurs.", "我期待這堂課。"], ["Sie freut sich über das Geschenk.", "她為這份禮物感到高興。"], ["Er interessiert sich für Musik.", "他對音樂有興趣。"], ["Setz dich bitte!", "請坐下！"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="de">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="de">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放德語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('de'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
