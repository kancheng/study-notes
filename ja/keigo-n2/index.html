<div class="intro">
<h1>日文 N2｜敬語を広げる</h1>
<p>N2把謙譲語用在自己的動作上：させていただく、参る、伺う、拝見する、お目にかかる。對方的動作繼續用尊敬語。</p>
<div class="toolbar">
<a class="download" href="./keigo-n2.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音，朗讀的是漢字句。可用性依瀏覽器與系統而異。</span>
</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>させていただく是請求對方允許自己做。<br>行く、来る的謙譲語是参る。問う、訪問する的謙譲語是伺う。</div>
<nav class="pager"><a href="../zuirarenai/">← ずにはいられない</a><span></span></nav>
</main>
<footer>敬語を広げる · 日文 N2</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "させていただく", "meaning": "請允許我", "rows": [["先回去", "今日は早めに帰らせていただきます。", "きょう は はやめ に かえらせて いただきます。", "Kyou wa hayame ni kaerasete itadakimasu."], ["說明", "それでは、説明させていただきます。", "それで は、 せつめい させて いただきます。", "Sorede wa, setsumei sasete itadakimasu."], ["看一下", "その資料を拝見させていただきます。", "その しりょう を はいけん させて いただきます。", "Sono shiryou o haiken sasete itadakimasu."], ["請教", "一つ質問させていただきます。", "ひとつ しつもん させて いただきます。", "Hitotsu shitsumon sasete itadakimasu."]], "examples": [["本日は、ここで失礼させていただきます。", "ほんじつ は、 ここ で しつれい させて いただきます。", "Honjitsu wa, koko de shitsurei sasete itadakimasu.", "今天我就先告辭了。"], ["私の考えを述べさせていただきます。", "わたし の かんがえ を のべさせて いただきます。", "Watashi no kangae o nobesasete itadakimasu.", "請讓我說一下我的想法。"], ["来週の予定を確認させていただきます。", "らいしゅう の よてい を かくにん させて いただきます。", "Raishuu no yotei o kakunin sasete itadakimasu.", "請讓我確認一下下週的預定。"], ["お名前を伺わせていただきます。", "おなまえ を うかがわせて いただきます。", "Onamae o ukagawasete itadakimasu.", "請讓我請問您的姓名。"]]}, {"name": "参る・伺う", "meaning": "去、來、拜訪、請教", "rows": [["前往東京", "来週、東京へ参ります。", "らいしゅう、 とうきょう へ まいります。", "Raishuu, toukyou e mairimasu."], ["到老師那裡", "明日、先生のところへ伺います。", "あした、 せんせい の ところ へ うかがいます。", "Ashita, sensei no tokoro e ukagaimasu."], ["請問", "開始の時間を伺います。", "かいし の じかん を うかがいます。", "Kaishi no jikan o ukagaimasu."], ["初次見面", "初めてお目にかかります。", "はじめて おめ に かかります。", "Hajimete ome ni kakarimasu."]], "examples": [["明日の十時に、そちらへ参ります。", "あした の じゅうじ に、 そちら へ まいります。", "Ashita no juuji ni, sochira e mairimasu.", "我明天十點到您那裡。"], ["来月、ご自宅へ伺ってもよろしいでしょうか。", "らいげつ、 ごじたく へ うかがって も よろしい でしょう か。", "Raigetsu, gojitaku e ukagatte mo yoroshii deshou ka.", "下個月到府上拜訪，可以嗎？"], ["その件について、伺いたいことがあります。", "その けん に ついて、 うかがいたい こと が あります。", "Sono ken ni tsuite, ukagaitai koto ga arimasu.", "關於那件事，有些地方想請教。"], ["先生には、昨年お目にかかりました。", "せんせい に は、 さくねん おめ に かかりました。", "Sensei ni wa, sakunen ome ni kakarimashita.", "我去年見過老師。"]]}, {"name": "いたす・拝見", "meaning": "做、看", "rows": [["我來帶路", "それでは、ご案内いたします。", "それで は、 ごあんない いたします。", "Sorede wa, goannai itashimasu."], ["我來說明", "その件は、私からご説明いたします。", "その けん は、 わたし から ごせつめい いたします。", "Sono ken wa, watashi kara gosetsumei itashimasu."], ["拜讀", "先生の本を拝見しました。", "せんせい の ほん を はいけん しました。", "Sensei no hon o haiken shimashita."], ["拜託", "どうぞよろしくお願いいたします。", "どうぞ よろしく おねがい いたします。", "Douzo yoroshiku onegai itashimasu."]], "examples": [["受付でご案内いたします。", "うけつけ で ごあんない いたします。", "Uketsuke de goannai itashimasu.", "我會在服務台為您帶路。"], ["詳しい内容は、後でお送りいたします。", "くわしい ないよう は、 あと で おおくり いたします。", "Kuwashii naiyou wa, ato de ookuri itashimasu.", "詳細內容我稍後寄給您。"], ["お手紙を拝見しました。", "おてがみ を はいけん しました。", "Otegami o haiken shimashita.", "您的信我拜讀了。"], ["ご連絡をお待ちしております。", "ごれんらく を おまち して おります。", "Gorenraku o omachi shite orimasu.", "我等候您的聯絡。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
