<div class="tip"><strong>用法提醒：</strong>parce que 是原因。pour + 原形是目的，不是原因。<br>car 和 parce que 接近，car 比較常出現在書面。</div>

<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "parce que", "meaning": "因為", "rows": [["因為累", "parce que je suis fatigué", "因為我累了"], ["因為下雨", "parce qu’il pleut", "因為下雨"], ["因為有課", "parce que j’ai un cours", "因為我有課"], ["問", "pourquoi", "為什麼"]], "examples": [["Je reste à la maison parce que je suis fatigué.", "我留在家裡，因為我累了。"], ["Nous ne sortons pas parce qu’il pleut.", "我們不出去，因為下雨。"], ["Elle étudie parce qu’elle a un examen.", "她在讀書，因為她有考試。"], ["Pourquoi est-ce que tu apprends le français ?", "你為什麼學法文？"]]}, {"name": "pour", "meaning": "為了", "rows": [["為了工作", "pour travailler", "為了工作"], ["為了懂", "pour comprendre", "為了弄懂"], ["為了買", "pour acheter", "為了買"], ["書面", "car", "因為"]], "examples": [["Il apprend le français pour travailler au Canada.", "他學法文是為了在加拿大工作。"], ["Je lis ce texte pour comprendre la question.", "我讀這段文字是為了弄懂問題。"], ["Elle économise pour acheter un vélo.", "她在存錢，為了買一輛腳踏車。"], ["Je reste, car je suis fatigué.", "我留下，因為我累了。"]]}, {"name": "donc", "meaning": "所以", "rows": [["所以留下", "donc je reste", "所以我留下"], ["所以搭車", "donc je prends le bus", "所以我搭公車"], ["所以問", "donc je demande", "所以我問"], ["結果", "alors", "那麼"]], "examples": [["Je suis malade, donc je reste à la maison.", "我生病了，所以留在家裡。"], ["Il est tard, donc nous prenons un taxi.", "時間晚了，所以我們搭計程車。"], ["Je ne comprends pas, donc je pose une question.", "我不懂，所以我問一個問題。"], ["Tu es fatigué ? Alors repose-toi.", "你累了嗎？那就休息吧。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="fr">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="fr">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放法語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="fr">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('fr'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
