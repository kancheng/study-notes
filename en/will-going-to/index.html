<div class="intro">
<h1>英文 A2｜will 與 be going to</h1>
<p>will 常用在說話當下才決定的事。be going to 常用在已經有的計畫。已經排定的行程也可用現在進行式。</p>
<div class="toolbar">
<a class="download" href="./will-going-to.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的英語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>will 的否定是 will not，口語縮成 won&#x27;t。</div>
<nav class="pager"><a href="../past-simple/">← Past Simple</a><a href="../quantifiers/">Quantifiers →</a></nav>

<footer>Will and Going to · 英文 A2</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "will", "meaning": "現在決定", "rows": [["我", "I will help", "我會幫忙"], ["她", "she will call", "她會打"], ["我們", "we will wait", "我們會等"], ["否定", "I won't stay", "我不會留下"]], "examples": [["I will help you.", "我會幫你。"], ["She will call later.", "她稍後會打。"], ["We will wait here.", "我們會在這裡等。"], ["I won't stay long.", "我不會留很久。"]]}, {"name": "be going to", "meaning": "已經的計畫", "rows": [["我", "I am going to study", "我打算讀"], ["他", "he is going to leave", "他打算離開"], ["我們", "we are going to meet", "我們打算見面"], ["她", "she is going to cook", "她打算煮"]], "examples": [["I am going to study tonight.", "我今晚打算讀書。"], ["He is going to leave tomorrow.", "他明天打算離開。"], ["We are going to meet at seven.", "我們打算七點見面。"], ["She is going to cook dinner.", "她打算煮晚餐。"]]}, {"name": "現在進行式", "meaning": "已排定", "rows": [["我", "I am meeting her", "我約了她"], ["我們", "we are leaving", "我們要出發"], ["課", "class is starting", "課要開始"], ["他", "he is flying", "他要搭飛機"]], "examples": [["I am meeting her at six.", "我六點要和她見面。"], ["We are leaving tomorrow.", "我們明天要出發。"], ["Class is starting at nine.", "課九點開始。"], ["He is flying to Tokyo on Friday.", "他星期五要飛東京。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="en">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="en">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放英語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('en'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
