<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#182a45;background:#f3f6fb}
*{box-sizing:border-box}
body{margin:0}

p{line-height:1.7}

<body>
<header><div class="brand"><a href="../index.html">← 英文筆記</a>　/　Causative</div></header>
<main>
<div class="intro">
<h1>英文 B2｜使役與感官動詞</h1>
<p>make、let、have 後面接原形。see 和 hear 可以接原形，表示看到或聽到整個過程，也可以接 V-ing，表示看到正在做。</p>
<div class="toolbar">
<a class="download" href="./causative.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的英語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>get 不一樣，要加 to：I got him to help. 請他幫忙。</div>
<nav class="pager"><a href="../participle-clause/">← Participle Clause</a><a href="../wish/">Wish →</a></nav>
</main>
<footer>Causative · 英文 B2</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "make / let / have", "meaning": "叫、讓、請", "rows": [["叫", "make me laugh", "使我笑"], ["讓", "let me go", "讓我走"], ["請人做", "have him fix it", "請他修好"], ["使", "made her happy", "使她開心"]], "examples": [["The story made me laugh.", "這個故事使我笑了。"], ["My parents let me go.", "我的父母讓我去。"], ["I had him fix the bike.", "我請他修好腳踏車。"], ["The news made her happy.", "這消息使她開心。"]]}, {"name": "see / hear + 原形", "meaning": "整個過程", "rows": [["看見", "saw him leave", "看見他離開"], ["聽見", "heard her sing", "聽見她唱歌"], ["看見", "saw them play", "看見他們打"], ["聽見", "heard the bell ring", "聽見鈴響"]], "examples": [["I saw him leave.", "我看見他離開。"], ["We heard her sing.", "我們聽見她唱歌。"], ["She saw them play baseball.", "她看見他們打棒球。"], ["I heard the bell ring.", "我聽見鈴響了。"]]}, {"name": "see / hear + V-ing", "meaning": "正在做的片段", "rows": [["看見", "saw him leaving", "看見他正在離開"], ["聽見", "heard her singing", "聽見她正在唱"], ["看見", "saw them playing", "看見他們正在打"], ["聽見", "heard the baby crying", "聽見嬰兒正在哭"]], "examples": [["I saw him leaving.", "我看見他正在離開。"], ["We heard her singing.", "我們聽見她正在唱歌。"], ["She saw them playing baseball.", "她看見他們正在打棒球。"], ["I heard the baby crying.", "我聽見嬰兒正在哭。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="en">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="en">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放英語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('en'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
</body>
