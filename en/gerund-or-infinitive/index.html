<header><div class="brand"><a href="../index.html">← 英文筆記</a>　/　Gerund or Infinitive</div></header>
<main>
<div class="intro">
<h1>英文 B2｜to V 與 V-ing 意思不同</h1>
<p>stop、remember、forget、try 後面接 to V 或 V-ing，意思不一樣。</p>
<div class="toolbar">
<a class="download" href="./gerund-or-infinitive.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的英語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>remember to V 是記得要去做。remember V-ing 是記得做過。</div>
<nav class="pager"><a href="../subjunctive/">← Subjunctive</a><a href="../dummy-it/">Dummy It →</a></nav>

<footer>Gerund or Infinitive · 英文 B2</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "stop / remember", "meaning": "停下來，以及記得", "rows": [["停下某事", "stop talking", "停止說話"], ["停下去做", "stop to talk", "停下來以便說話"], ["記得要做", "remember to lock", "記得要鎖"], ["記得做過", "remember locking", "記得鎖過"]], "examples": [["Please stop talking.", "請停止說話。"], ["He stopped to talk to me.", "他停下來跟我說話。"], ["Remember to lock the door.", "記得要鎖門。"], ["I remember locking the door.", "我記得鎖過門。"]]}, {"name": "forget / try", "meaning": "忘記，以及試", "rows": [["忘記要做", "forgot to call", "忘了要打"], ["忘記做過", "forgot meeting", "忘了見過"], ["試著", "try to open", "試著打開"], ["試一試", "try opening", "打開看看"]], "examples": [["I forgot to call her.", "我忘了要打給她。"], ["I will never forget meeting her.", "我永遠不會忘記見過她。"], ["Try to open the window.", "試著把窗戶打開。"], ["Try opening the window.", "打開窗戶看看。"]]}, {"name": "對照", "meaning": "同一動詞兩句", "rows": [["regret to", "regret to say", "很遺憾要說"], ["regret -ing", "regret saying", "後悔說過"], ["go on to", "went on to explain", "接著去說明"], ["go on -ing", "went on talking", "繼續說"]], "examples": [["I regret to say that I cannot come.", "很遺憾，我得說我不能來。"], ["I regret saying that.", "我後悔說了那句話。"], ["She told the story and went on to explain it.", "她講完故事，接著說明。"], ["He went on talking for an hour.", "他繼續說了一小時。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="en">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="en">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放英語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('en'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
