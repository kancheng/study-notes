<h1>日文 N2｜に伴って、に応じて</h1>
<p>に伴って是隨著某件事的變化，另一件事也跟著變。に応じて是依照情況而不同。とともに也可以表示「隨著」。</p>

<a class="download" href="./tomonatte.pdf" download>下載完整 PDF</a>

</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>

<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "に伴って", "meaning": "隨著", "rows": [["人口增加", "人口が増えるに伴って、町が変わりました。", "じんこう が ふえる に ともなって、 まち が かわりました。", "Jinkou ga fueru ni tomonatte, machi ga kawarimashita."], ["技術進步", "技術が進むに伴って、生活が便利になりました。", "ぎじゅつ が すすむ に ともなって、 せいかつ が べんり に なりました。", "Gijutsu ga susumu ni tomonatte, seikatsu ga benri ni narimashita."], ["年紀增長", "年齢が増すに伴って、考えも変わります。", "ねんれい が ます に ともなって、 かんがえ も かわります。", "Nenrei ga masu ni tomonatte, kangae mo kawarimasu."], ["發展", "経済の発展に伴って、環境の問題も増えました。", "けいざい の はってん に ともなって、 かんきょう の もんだい も ふえました。", "Keizai no hatten ni tomonatte, kankyou no mondai mo fuemashita."]], "examples": [["車が増えるに伴って、空気が悪くなりました。", "くるま が ふえる に ともなって、 くうき が わるく なりました。", "Kuruma ga fueru ni tomonatte, kuuki ga waruku narimashita.", "隨著車子變多，空氣變差了。"], ["外国人が増えるに伴って、町がにぎやかになりました。", "がいこくじん が ふえる に ともなって、 まち が にぎやか に なりました。", "Gaikokujin ga fueru ni tomonatte, machi ga nigiyaka ni narimashita.", "隨著外國人增加，城鎮變熱鬧了。"], ["制度の変化に伴って、手続きも変わりました。", "せいど の へんか に ともなって、 てつづき も かわりました。", "Seido no henka ni tomonatte, tetsuzuki mo kawarimashita.", "隨著制度改變，手續也變了。"], ["子供の成長に伴って、教育費がかかります。", "こども の せいちょう に ともなって、 きょういくひ が かかります。", "Kodomo no seichou ni tomonatte, kyouikuhi ga kakarimasu.", "隨著孩子成長，教育費也跟著增加。"]]}, {"name": "に応じて", "meaning": "依照", "rows": [["依經驗", "経験に応じて、給料が違います。", "けいけん に おうじて、 きゅうりょう が ちがいます。", "Keiken ni oujite, kyuuryou ga chigaimasu."], ["依年齡", "年齢に応じて、料金が変わります。", "ねんれい に おうじて、 りょうきん が かわります。", "Nenrei ni oujite, ryoukin ga kawarimasu."], ["依能力", "能力に応じて、仕事を分けます。", "のうりょく に おうじて、 しごと を わけます。", "Nouryoku ni oujite, shigoto o wakemasu."], ["依季節", "季節に応じて、メニューが変わります。", "きせつ に おうじて、 メニュー が かわります。", "Kisetsu ni oujite, menyuu ga kawarimasu."]], "examples": [["予算に応じて、計画を立ててください。", "よさん に おうじて、 けいかく を たてて ください。", "Yosan ni oujite, keikaku o tatete kudasai.", "請依照預算來訂計畫。"], ["体力に応じて、運動の量を決めます。", "たいりょく に おうじて、 うんどう の りょう を きめます。", "Tairyoku ni oujite, undou no ryou o kimemasu.", "依照體力決定運動量。"], ["人数に応じて、部屋を用意します。", "にんずう に おうじて、 へや を ようい します。", "Ninzuu ni oujite, heya o youi shimasu.", "依照人數準備房間。"], ["目的に応じて、コースを選んでください。", "もくてき に おうじて、 コース を えらんで ください。", "Mokuteki ni oujite, koosu o erande kudasai.", "請依照目的選擇課程。"]]}, {"name": "とともに", "meaning": "隨著、和…一起", "rows": [["隨著年紀", "年を取るとともに、体力が落ちました。", "とし を とる と とも に、 たいりょく が おちました。", "Toshi o toru to tomo ni, tairyoku ga ochimashita."], ["隨著季節", "季節が変わるとともに、景色も変わります。", "きせつ が かわる と とも に、 けしき も かわります。", "Kisetsu ga kawaru to tomo ni, keshiki mo kawarimasu."], ["和朋友一起", "家族とともに、この町で暮らしています。", "かぞく と とも に、 この まち で くらして います。", "Kazoku to tomo ni, kono machi de kurashite imasu."], ["隨著普及", "インターネットの普及とともに、働き方も変わりました。", "インターネット の ふきゅう と とも に、 はたらきかた も かわりました。", "Intaanetto no fukyuu to tomo ni, hatarakikata mo kawarimashita."]], "examples": [["暗くなるとともに、気温も下がりました。", "くらく なる と とも に、 きおん も さがりました。", "Kuraku naru to tomo ni, kion mo sagarimashita.", "隨著天色變暗，氣溫也下降了。"], ["卒業するとともに、就職しました。", "そつぎょう する と とも に、 しゅうしょく しました。", "Sotsugyou suru to tomo ni, shuushoku shimashita.", "隨著畢業，我也開始工作了。"], ["父とともに、店を手伝っています。", "ちち と とも に、 みせ を てつだって います。", "Chichi to tomo ni, mise o tetsudatte imasu.", "我和父親一起幫忙看店。"], ["技術の進歩とともに、新しい仕事が生まれました。", "ぎじゅつ の しんぽ と とも に、 あたらしい しごと が うまれました。", "Gijutsu no shinpo to tomo ni, atarashii shigoto ga umaremashita.", "隨著技術進步，新的工作出現了。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
