<body>
<header><div class="brand"><a href="../index.html">← 德文筆記</a>　/　Infinitiv mit zu</div></header>
<main>
<div class="intro">
<h1>德文 B1｜帶 zu 的不定詞</h1>
<p>versuchen、vergessen、vorhaben 後面的第二個動詞要加 zu。目的若是同一個主詞，用 um ... zu。</p>
<div class="toolbar">
<a class="download" href="./infinitiv-zu.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的德語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>同一主詞的目的用 um ... zu。不同主詞用 damit。<br>ohne ... zu 表示沒做就發生：Er ging, ohne ein Wort zu sagen。</div>
<nav class="pager"><a href="../relativsatz/">← Relativsatz</a><a href="../konnektoren/">Konnektoren →</a></nav>
</main>
<footer>Infinitiv mit zu · 德文 B1</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "動詞加 zu", "meaning": "第二個動作", "rows": [["試著", "versuchen, ... zu", "試著做"], ["別忘了", "vergessen, ... zu", "忘記做"], ["打算", "vorhaben, ... zu", "打算做"], ["開始", "anfangen, ... zu", "開始做"]], "examples": [["Ich versuche, jeden Tag zu lernen.", "我試著每天學習。"], ["Vergiss nicht, die Tür zu schließen.", "別忘了關門。"], ["Ich habe vor, mehr zu lesen.", "我打算多讀一點。"], ["Sie fängt an, besser zu sprechen.", "她開始說得比較好。"]]}, {"name": "um ... zu", "meaning": "為了，主詞相同", "rows": [["為了學習", "um Deutsch zu lernen", "為了學德文"], ["為了通過", "um die Prüfung zu bestehen", "為了通過考試"], ["為了準時", "um pünktlich zu sein", "為了準時"], ["重要的是", "Es ist wichtig, ... zu", "做某事是重要的"]], "examples": [["Ich lerne Deutsch, um in Deutschland zu studieren.", "我學德文，為了到德國讀書。"], ["Sie steht früh auf, um den Zug zu erreichen.", "她早起，為了趕上火車。"], ["Es ist wichtig, ruhig zu bleiben.", "保持冷靜很重要。"], ["Wir bleiben hier, um den Zug nicht zu verpassen.", "我們留在這裡，免得錯過火車。"]]}, {"name": "damit", "meaning": "為了，主詞不同", "rows": [["不同主詞", "damit mein Bruder es versteht", "好讓我的兄弟聽得懂"], ["相同主詞也可用", "damit ich bestehe", "好讓我通過"], ["動詞位置", "在 damit 從句句尾", "versteht、bestehe"], ["不要加 zu", "damit 後面是完整從句", "有自己的主詞和變位動詞"]], "examples": [["Ich spreche langsam, damit du mich verstehst.", "我說慢一點，好讓你聽懂我。"], ["Sie erklärt es noch einmal, damit alle es verstehen.", "她再解釋一次，好讓大家都懂。"], ["Ich wiederhole die Wörter, damit ich sie nicht vergesse.", "我複習單字，免得忘掉。"], ["Er schreibt den Satz auf, damit wir ihn lesen können.", "他把句子寫下來，好讓我們能讀。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="de">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="de">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放德語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('de'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
