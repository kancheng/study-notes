<div class="intro">
<h1>法文 B2｜愈過去</h1>
<p>愈過去表示在過去另一件事之前就已經完成。用未完成過去的 avoir 或 être，加上過去分詞。用 être 時，分詞仍要配合主詞。</p>
<div class="toolbar">
<a class="download" href="./plus-que-parfait.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的法語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>時間軸上有兩件過去的事時，更早的那件用愈過去。<br>être 的配合和複合過去相同：elle était partie、ils étaient arrivés。</div>

<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "avoir", "meaning": "更早已經做完", "rows": [["已經吃了", "j’avais déjà mangé", "我已經吃過了"], ["已經訂了", "nous avions réservé", "我們已經訂了"], ["已經說了", "elle avait dit", "她已經說過"], ["還沒看", "je n’avais pas vu", "我還沒看過"]], "examples": [["J’avais déjà mangé quand il a appelé.", "他打電話來的時候，我已經吃過了。"], ["Nous avions réservé une table.", "我們已經訂了一張桌子。"], ["Elle avait dit la vérité.", "她已經說過實話。"], ["Je n’avais pas vu ce message.", "我當時還沒看到這則訊息。"]]}, {"name": "être", "meaning": "更早的移動，分詞要配合", "rows": [["已經離開", "elle était partie", "她已經離開"], ["已經到了", "ils étaient arrivés", "他們已經到了"], ["已經回去", "nous étions rentrés", "我們已經回去"], ["還沒出門", "je n’étais pas sorti", "我還沒出門"]], "examples": [["Elle était partie avant notre arrivée.", "在我們到達之前，她已經離開了。"], ["Quand nous sommes entrés, ils étaient déjà arrivés.", "我們進去的時候，他們已經到了。"], ["Nous étions rentrés avant minuit.", "我們在午夜前已經回到家。"], ["Je n’étais pas encore sorti quand tu as sonné.", "你按鈴的時候，我還沒出門。"]]}, {"name": "先後", "meaning": "先…然後…", "rows": [["先讀完", "après avoir lu", "讀完之後"], ["先到", "quand je suis arrivé, le train était parti", "我到時火車已走"], ["已經結束", "le cours avait commencé", "課已經開始了"], ["已經決定", "nous avions décidé", "我們已經決定"]], "examples": [["Quand je suis arrivé, le train était déjà parti.", "我到的時候，火車已經走了。"], ["Le cours avait déjà commencé.", "課已經開始了。"], ["Nous avions décidé de rester, puis il a plu.", "我們已經決定留下，然後下雨了。"], ["Elle a compris parce qu’elle avait beaucoup lu.", "她懂了，因為她先前讀了很多。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="fr">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="fr">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放法語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="fr">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('fr'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
