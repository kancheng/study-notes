<div class="intro">
<h1>法文 B1｜複合過去與未完成過去</h1>
<p>複合過去是當時做完的一件事。未完成過去是背景、習慣，或那時候正在持續的情況。兩件同時發生時，被打斷的那一件用未完成過去。</p>
<div class="toolbar">
<a class="download" href="./passe-imparfait.pdf" download>下載完整 PDF</a>

</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>quand 後面如果是突發的事，用複合過去；當時正在做的事用未完成過去。<br>Tous les jours 這類習慣，用未完成過去。Hier 的單一事件，用複合過去。</div>

<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "背景與事件", "meaning": "當時…的時候，發生了…", "rows": [["下雨時出門", "il pleuvait quand je suis sorti", "我出門時正下雨"], ["到達時正在吃", "nous dînions quand elle est arrivée", "她到的時候我們正在吃晚飯"], ["讀書時電話響", "il lisait quand le téléphone a sonné", "他正在讀書，電話響了"], ["走路時看見", "je marchais quand je l’ai vu", "我正在走路時看見了他"]], "examples": [["Il pleuvait quand je suis sorti.", "我出門的時候正在下雨。"], ["Nous dînions quand elle est arrivée.", "她到的時候，我們正在吃晚飯。"], ["Il lisait quand le téléphone a sonné.", "他正在讀書，電話響了。"], ["Je marchais quand je l’ai vu.", "我正在走路，就看見了他。"]]}, {"name": "習慣與一次", "meaning": "以前總是，昨天那一次", "rows": [["以前搭", "je prenais le bus", "我以前搭公車"], ["昨天搭", "j’ai pris un taxi", "我昨天搭了計程車"], ["以前住", "j’habitais ici", "我以前住這裡"], ["昨天去", "j’y suis allé", "我昨天去了那裡"]], "examples": [["Autrefois, je prenais le bus. Hier, j’ai pris un taxi.", "以前我搭公車。昨天我搭了計程車。"], ["Quand j’étais étudiant, j’habitais ici.", "我當學生的時候住在這裡。"], ["Le dimanche, nous allions au marché.", "以前我們星期天去市場。"], ["Dimanche dernier, nous sommes allés au marché.", "上星期天我們去了市場。"]]}, {"name": "狀態", "meaning": "當時一直是那樣", "rows": [["當時年輕", "elle était jeune", "她當時年輕"], ["當時有", "il avait un vélo", "他當時有腳踏車"], ["當時冷", "il faisait froid", "當時很冷"], ["當時是", "c’était calme", "當時很安靜"]], "examples": [["À cette époque, elle était très jeune.", "那時候她很年輕。"], ["Il avait un vélo, mais il l’a vendu.", "他當時有一輛腳踏車，但他把它賣了。"], ["Il faisait froid, alors nous sommes rentrés.", "當時很冷，所以我們回家了。"], ["C’était calme quand nous sommes arrivés.", "我們到的時候，那裡很安靜。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="fr">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="fr">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放法語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="fr">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('fr'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
