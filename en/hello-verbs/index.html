<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="英文 A1 必背：be、have、be called 現在式變化、例句、中文翻譯與發音。">
<title>Hello Verbs｜英文 A1 三大動詞</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#182a45;background:#f3f6fb}
*{box-sizing:border-box}
body{margin:0}
header{background:#132f55;color:white;padding:22px max(20px,calc((100vw - 1050px)/2))}
header .brand{font-size:1.35rem;font-weight:800;letter-spacing:.02em}
header a{color:inherit;text-decoration:none}
main{max-width:1050px;margin:auto;padding:32px 20px 70px}
h1{font-size:clamp(1.8rem,4vw,2.65rem);margin:0 0 8px}
h2{font-size:1.55rem;margin:0}
p{line-height:1.7}
.intro{margin-bottom:24px}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 28px}
.download,button{cursor:pointer;border:0;border-radius:9px;font:inherit}
.download{display:inline-block;background:#df3349;color:white;padding:12px 18px;text-decoration:none;font-weight:700}
.download:hover{background:#b91f35}
.note{font-size:.92rem;color:#52647d}
.card{background:white;border:1px solid #dce4f0;border-radius:16px;box-shadow:0 8px 24px #142f5210;margin:20px 0;padding:23px}
.cardhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.meaning{color:#52647d}
.tablewrap{overflow-x:auto;margin-top:18px}
table{border-collapse:collapse;width:100%;min-width:610px;text-align:left}
th{background:#eaf0f9;font-size:.9rem}
th,td{padding:13px 14px;border-bottom:1px solid #e4e9f1}
td:nth-child(2){font-weight:750;color:#173e71}
.examples{margin-top:22px}
.examples h3{font-size:1.07rem;margin:0 0 10px}
.example{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #edf0f5}
.line{font-size:1.03rem;font-weight:700}
.zh{color:#53637b;margin-top:3px}
.speak{background:#e7f0fd;color:#163b6a;padding:9px 12px;min-width:84px}
.speak:hover,.speak:focus-visible{background:#cedffa;outline:2px solid #3769a9;outline-offset:2px}
.tip{background:#e9eff8;border-left:4px solid #5276aa;padding:14px 18px;border-radius:8px;margin-top:20px}
footer{max-width:1050px;margin:auto;padding:20px;color:#627087;font-size:.9rem}
@media(max-width:600px){main{padding-top:25px}.card{padding:17px}}
</style>
</head>
<body>
<header><div class="brand"><a href="../../index.html">← 四語筆記首頁</a>　/　Hello Verbs</div></header>
<main>
<div class="intro">
<h1>英文 A1｜三個必背動詞</h1>
<p>把六組人稱和現在式一起記：<strong>be</strong>（是）、<strong>have</strong>（有）、<strong>be called</strong>（叫做）。先看表，再按例句旁的播放鍵跟讀。</p>
<div class="toolbar">
<a class="download" href="./Hello-Verbs-A1.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的英語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>第三人稱單數動詞加 <strong>-s</strong>：he <strong>is</strong>、she <strong>has</strong>。<em>you</em> 同時對應「你」和「你們」，形式不變。自介更常說 <em>My name is Hao-Cheng.</em>、<em>What is your name?</em> 年齡用 be：<em>I am 25 years old.</em>（我 25 歲。）</div>
</main>
<footer>Hello Verbs · 英語入門變化與跟讀小抄</footer>
<script>
const LANG = 'en-US';
const groups = [
  {
    name: 'Be',
    meaning: '是／處於',
    rows: [
      ['I', 'I am', '我是'],
      ['you', 'you are', '你是'],
      ['he / she', 'he / she is', '他／她是'],
      ['we', 'we are', '我們是'],
      ['you', 'you are', '你們是'],
      ['they', 'they are', '他們／她們是']
    ],
    examples: [
      ['I am a student.', '我是學生。'],
      ['Are you ready?', '你準備好了嗎？'],
      ['She is French.', '她是法國人。'],
      ['We are in Taipei.', '我們在台北。'],
      ['Are you a teacher?', '您是老師嗎？'],
      ['They are here.', '他們在這裡。']
    ]
  },
  {
    name: 'Have',
    meaning: '有',
    rows: [
      ['I', 'I have', '我有'],
      ['you', 'you have', '你有'],
      ['he / she', 'he / she has', '他／她有'],
      ['we', 'we have', '我們有'],
      ['you', 'you have', '你們有'],
      ['they', 'they have', '他們／她們有']
    ],
    examples: [
      ['I have a book.', '我有一本書。'],
      ['Do you have a pen?', '你有筆嗎？'],
      ['He has a brother.', '他有一個兄弟。'],
      ['We have a class.', '我們有一堂課。'],
      ['Do you have a question?', '您有問題嗎？'],
      ['They have friends.', '他們有朋友。']
    ]
  },
  {
    name: 'Be called',
    meaning: '叫做／名字是',
    rows: [
      ['I', 'I am called', '我叫'],
      ['you', 'you are called', '你叫'],
      ['he / she', 'he / she is called', '他／她叫'],
      ['we', 'we are called', '我們叫'],
      ['you', 'you are called', '你們叫'],
      ['they', 'they are called', '他們／她們叫']
    ],
    examples: [
      ['I am called Hao-Cheng.', '我叫 Hao-Cheng。'],
      ['What are you called?', '你叫什麼名字？'],
      ['She is called Marie.', '她叫 Marie。'],
      ['We are called the Blues.', '我們叫做「藍隊」。'],
      ['What are you called?', '您叫什麼名字？'],
      ['They are called Paul and Marc.', '他們叫 Paul 和 Marc。']
    ]
  }
];
const esc = s => s.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
document.querySelector('#content').innerHTML = groups.map(g => `<section class="card"><div class="cardhead"><h2>${esc(g.name)}</h2><span class="meaning">${esc(g.meaning)}</span></div><div class="tablewrap"><table><thead><tr><th scope="col">人稱</th><th scope="col">現在式</th><th scope="col">中文</th></tr></thead><tbody>${g.rows.map(r => `<tr><td>${esc(r[0])}</td><td lang="en">${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>${g.examples.map(([line, zh]) => `<div class="example"><div><div class="line" lang="en">${esc(line)}</div><div class="zh">${esc(zh)}</div></div><button class="speak" type="button" data-say="${esc(line)}" aria-label="播放英語：${esc(line)}">▶ 播放</button></div>`).join('')}</div></section>`).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = LANG;
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_', '-').startsWith('en'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
</body>
</html>
