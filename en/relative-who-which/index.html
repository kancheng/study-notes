<div class="intro">
<h1>英文 B1｜who、which、that</h1>
<p>關係代名詞把兩句合成一句。人用 who 或 that，事物用 which 或 that。</p>

<a class="download" href="./relative-who-which.pdf" download>下載完整 PDF</a>

<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "who", "meaning": "人", "rows": [["坐", "the student who sits here", "坐在這裡的學生"], ["教", "the teacher who teaches us", "教我們的老師"], ["住", "the man who lives next door", "住隔壁的男人"], ["幫助", "the girl who helped me", "幫助我的女孩"]], "examples": [["The student who sits here is my friend.", "坐在這裡的學生是我的朋友。"], ["The teacher who teaches us is kind.", "教我們的老師很親切。"], ["The man who lives next door is a doctor.", "住隔壁的男人是醫生。"], ["I thanked the girl who helped me.", "我向幫助我的女孩道謝。"]]}, {"name": "which", "meaning": "事物", "rows": [["我買的", "the book which I bought", "我買的書"], ["很有用", "a book which is useful", "有用的書"], ["她寫的", "the letter which she wrote", "她寫的信"], ["我們坐的", "the bus which we took", "我們坐的公車"]], "examples": [["The book which I bought is new.", "我買的那本書是新的。"], ["This is a book which is useful.", "這是一本有用的書。"], ["The letter which she wrote is long.", "她寫的那封信很長。"], ["The bus which we took was late.", "我們坐的那班公車遲到了。"]]}, {"name": "that", "meaning": "人與事物都可以", "rows": [["人", "the student that sits here", "坐在這裡的學生"], ["物", "the book that I need", "我需要的書"], ["人", "the friend that called", "打來的朋友"], ["物", "the movie that we saw", "我們看的電影"]], "examples": [["The student that sits here is new.", "坐在這裡的學生是新來的。"], ["This is the book that I need.", "這是我需要的書。"], ["The friend that called is Marie.", "打來的朋友是 Marie。"], ["The movie that we saw was good.", "我們看的那部電影很好。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="en">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="en">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放英語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2>' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('en'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
