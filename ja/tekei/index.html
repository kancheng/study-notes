<main>
<div class="intro">
<h1>日文 N4｜て形</h1>
<p>て形用來連接動作。五段動詞要看詞尾做音便，一段直接把る改成て。している是正在做或狀態，てから是做完再做。</p>
<div class="toolbar">
<a class="download" href="./tekei.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音，朗讀的是漢字句。可用性依瀏覽器與系統而異。</span>
</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>行く的て形是行って，不是行いて。<br>てもいい是許可，てはいけない是禁止。</div>
<nav class="pager"><a href="../tekudasai/">← ましょう</a><a href="../naikei/">ない形 →</a></nav>
</main>
<footer>て形 · 日文 N4</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "作り方", "meaning": "て形怎麼變", "rows": [["買", "本を買って、読みます。", "ほん を かって、 よみます。", "Hon o katte, yomimasu."], ["書", "名前を書いてください。", "なまえ を かいて ください。", "Namae o kaite kudasai."], ["飲", "水を飲んでください。", "みず を のんで ください。", "Mizu o nonde kudasai."], ["行", "駅へ行って、待ちます。", "えき へ いって、 まちます。", "Eki e itte, machimasu."]], "examples": [["朝ごはんを食べて、学校へ行きます。", "あさごはん を たべて、 がっこう へ いきます。", "Asagohan o tabete, gakkou e ikimasu.", "我吃完早餐去學校。"], ["手を洗って、ご飯を食べます。", "て を あらって、 ごはん を たべます。", "Te o aratte, gohan o tabemasu.", "我洗完手吃飯。"], ["友達に会って、映画を見ました。", "ともだち に あって、 えいが を みました。", "Tomodachi ni atte, eiga o mimashita.", "我見了朋友，然後看了電影。"], ["来てください。", "きて ください。", "Kite kudasai.", "請過來。"]]}, {"name": "ている・てから", "meaning": "正在、做完之後", "rows": [["正在讀", "今、本を読んでいます。", "いま、 ほん を よんで います。", "Ima, hon o yonde imasu."], ["住", "兄は大阪に住んでいます。", "あに は おおさか に すんで います。", "Ani wa oosaka ni sunde imasu."], ["之後", "ご飯を食べてから、勉強します。", "ごはん を たべて から、 べんきょう します。", "Gohan o tabete kara, benkyou shimasu."], ["知道", "この言葉を知っています。", "この ことば を しって います。", "Kono kotoba o shitte imasu."]], "examples": [["今、音楽を聞いています。", "いま、 おんがく を きいて います。", "Ima, ongaku o kiite imasu.", "我正在聽音樂。"], ["私は台北に住んでいます。", "わたし は たいほく に すんで います。", "Watashi wa taihoku ni sunde imasu.", "我住在台北。"], ["宿題をしてから、遊びます。", "しゅくだい を して から、 あそびます。", "Shukudai o shite kara, asobimasu.", "我做完作業再玩。"], ["田中さんを知っていますか。", "たなかさん を しって います か。", "Tanakasan o shitte imasu ka.", "你認識田中先生嗎？"]]}, {"name": "許可と禁止", "meaning": "可以與不行", "rows": [["可以拍", "ここで写真を撮ってもいいですか。", "ここ で しゃしん を とっても いい です か。", "Koko de shashin o tottemo ii desu ka."], ["可以進", "入ってもいいです。", "はいっても いい です。", "Haittemo ii desu."], ["不行吸菸", "ここで吸ってはいけません。", "ここ で すって は いけません。", "Koko de sutte wa ikemasen."], ["不行進", "この部屋に入ってはいけません。", "この へや に はいって は いけません。", "Kono heya ni haitte wa ikemasen."]], "examples": [["窓を開けてもいいですか。", "まど を あけても いい です か。", "Mado o aketemo ii desu ka.", "我可以開窗嗎？"], ["今日は早く帰ってもいいです。", "きょう は はやく かえっても いい です。", "Kyou wa hayaku kaettemo ii desu.", "今天可以早點回去。"], ["図書館で話してはいけません。", "としょかん で はなして は いけません。", "Toshokan de hanashite wa ikemasen.", "不可以在圖書館說話。"], ["ここに車を止めてはいけません。", "ここ に くるま を とめて は いけません。", "Koko ni kuruma o tomete wa ikemasen.", "不可以把車停在這裡。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
