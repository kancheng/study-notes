<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#182a45;background:#f7f4f2}
*{box-sizing:border-box}
body{margin:0}
header{background:#b3482f;color:white;padding:22px max(20px,calc((100vw - 1050px)/2))}
header .brand{font-size:1.35rem;font-weight:800}
header a{color:inherit;text-decoration:none}
main{max-width:1050px;margin:auto;padding:32px 20px 70px}
h1{font-size:clamp(1.8rem,4vw,2.65rem);margin:0 0 8px}
h2{font-size:1.55rem;margin:0}
p{line-height:1.7}
.intro{margin-bottom:24px}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 28px}
.download,button{cursor:pointer;border:0;border-radius:9px;font:inherit}
.download{display:inline-block;background:#b3482f;color:white;padding:12px 18px;text-decoration:none;font-weight:700}

<body>
<header><div class="brand"><a href="../index.html">← 法文筆記</a>　/　Pronoms compléments</div></header>
<main>
<div class="intro">
<h1>法文 A2｜直接與間接受詞代詞</h1>
<p>直接受詞代替被動詞直接作用的人或物。間接受詞代替 à 後面的人。代詞放在變位動詞前面。否定時，ne 在代詞前，pas 在動詞後。</p>
<div class="toolbar">
<a class="download" href="./pronoms.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的法語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>le 在母音前寫成 l’。<br>兩個代詞同時出現、以及複合過去裡代詞的位置，放到 B1。</div>
<nav class="pager"><a href="../comparatif/">← Comparatif</a><a href="../y-en/">Y et en →</a></nav>
</main>
<footer>Pronoms compléments · 法文 A2</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "直接", "meaning": "le、la、les", "rows": [["他（陽）", "je le vois", "我看見他"], ["她（陰）", "je la connais", "我認識她"], ["他們", "je les aime", "我喜歡它們"], ["否定", "je ne le connais pas", "我不認識他"]], "examples": [["Je vois Paul. Je le vois.", "我看見 Paul。我看見他。"], ["Je connais Marie. Je la connais.", "我認識 Marie。我認識她。"], ["Tu aimes ces livres ? Oui, je les aime.", "你喜歡這些書嗎？對，我喜歡。"], ["Je ne le connais pas.", "我不認識他。"]]}, {"name": "間接", "meaning": "lui、leur，代替 à + 人", "rows": [["對他／她", "je lui parle", "我跟他說"], ["對他們", "je leur téléphone", "我打電話給他們"], ["給我", "tu me parles", "你在跟我說"], ["否定", "je ne lui parle pas", "我不跟他說"]], "examples": [["Je parle à Marie. Je lui parle.", "我在跟 Marie 說話。我在跟她說。"], ["Je téléphone à mes parents. Je leur téléphone.", "我打電話給父母。我打電話給他們。"], ["Tu me parles ?", "你在跟我說話嗎？"], ["Je ne lui écris pas souvent.", "我不常寫信給他。"]]}, {"name": "位置", "meaning": "動詞前，原形前", "rows": [["現在", "je le vois", "我看見他"], ["即將", "je vais le voir", "我要去看他"], ["可以", "tu peux la prendre", "你可以拿它"], ["想", "je veux les voir", "我想看它們"]], "examples": [["Je le vois tous les jours.", "我每天看見他。"], ["Je vais le voir demain.", "我明天要去看他。"], ["Tu peux la prendre.", "你可以拿它。"], ["Nous allons leur écrire.", "我們要寫信給他們。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="fr">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="fr">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放法語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="fr">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('fr'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
