<style>

<body>
<header><div class="brand"><a href="../index.html">← 法文筆記</a>　/　Gérondif</div></header>
<main>
<div class="intro">
<h1>法文 B1｜副動詞</h1>
<p>en 加現在分詞，表示同一個人同時做的另一件事，或做某事的方式。現在分詞是 nous 現在式去掉 -ons，加上 -ant。</p>
<div class="toolbar">
<a class="download" href="./gerondif.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的法語語音；可用性依瀏覽器與系統而異。</span>
</div>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>主詞必須是同一個人。Il apprend en regardant 的「學」和「看」都是他。<br>être 的現在分詞是 étant。avoir 是 ayant。例外詞幹：sachant、faisant、disant。</div>
<nav class="pager"><a href="../ordre-pronoms/">← Place des pronoms</a><a href="../opinion/">Opinion →</a></nav>
</main>
<footer>Gérondif · 法文 B1</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "形式", "中文"], "groups": [{"name": "同時", "meaning": "一邊…一邊…", "rows": [["邊看邊學", "en regardant", "藉著看"], ["邊走邊談", "en marchant", "邊走"], ["邊聽邊寫", "en écoutant", "邊聽"], ["邊笑邊說", "en souriant", "邊笑"]], "examples": [["Il apprend le français en regardant des films.", "他藉著看電影學法文。"], ["Nous discutons en marchant.", "我們邊走邊聊。"], ["Elle écrit en écoutant de la musique.", "她邊聽音樂邊寫。"], ["Il a répondu en souriant.", "他笑著回答。"]]}, {"name": "方式與時間", "meaning": "在做…的時候", "rows": [["下樓時", "en descendant", "下樓的時候"], ["出門時", "en sortant", "出門的時候"], ["讀的時候", "en lisant", "讀的時候"], ["是…的同時", "tout en", "儘管同時"]], "examples": [["Elle est tombée en descendant l’escalier.", "她下樓時跌倒了。"], ["En sortant, fermez la porte.", "出門時請把門關上。"], ["J’ai compris l’idée en lisant le texte.", "我讀文章的時候懂了這個想法。"], ["Il écoute, tout en regardant son téléphone.", "他在聽，同時卻看著手機。"]]}, {"name": "詞形", "meaning": "nous 去掉 -ons 加 -ant", "rows": [["說", "en parlant", "說的時候"], ["做", "en faisant", "做的時候"], ["是", "en étant", "作為"], ["有", "en ayant", "有了之後"]], "examples": [["On apprend en parlant.", "藉著說，才學得會。"], ["Il a fait une erreur en faisant ce calcul.", "他做這道計算時出錯了。"], ["En étant patient, tu vas comprendre.", "只要有耐心，你就會懂。"], ["En ayant les documents, nous pouvons commencer.", "文件到了，我們就可以開始。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="fr">' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (pair) { return '<div class="example"><div><div class="line" lang="fr">' + esc(pair[0]) + '</div><div class="zh">' + esc(pair[1]) + '</div></div><button class="speak" type="button" data-say="' + esc(pair[0]) + '" aria-label="播放法語：' + esc(pair[0]) + '">▶ 播放</button></div>'; }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="fr">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('fr'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
