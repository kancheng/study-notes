<style>

<body>
<header><div class="brand"><a href="../index.html">← 日文筆記</a>　/　助詞</div></header>
<main>
<div class="intro">
<h1>日文 N5｜助詞</h1>
<p>は標出話題，が標出新資訊或主語。を是動作的對象。に、で、へ分別是到達的時間或地點、動作的場所或工具、移動的方向。</p>
<div class="toolbar">
<a class="download" href="./joshi.pdf" download>下載完整 PDF</a>
<span class="note">發音使用裝置的日語語音，朗讀的是漢字句。可用性依瀏覽器與系統而異。</span>
</div>
<p class="convention">假名依詞分開。羅馬拼音用平文式：助詞は、を、へ寫成 wa、o、e。長音照假名寫成 ou、oo、ei、ii、uu，片假名的長音符號寫成雙母音。</p>
</div>
<div id="content"></div>
<div class="tip"><strong>用法提醒：</strong>は讀 wa，へ讀 e，を讀 o。<br>存在句的新資訊用が：猫がいます。</div>
<nav class="pager"><a href="../kore/">← これ・それ・あれ</a><a href="../keiyoushi/">形容詞 →</a></nav>
</main>
<footer>助詞 · 日文 N5</footer>
<script id="lesson" type="application/json">{"cols": ["用法", "漢字", "假名", "羅馬拼音"], "groups": [{"name": "は・が・を", "meaning": "話題、主語、對象", "rows": [["話題", "私は学生です。", "わたし は がくせい です。", "Watashi wa gakusei desu."], ["有", "猫がいます。", "ねこ が います。", "Neko ga imasu."], ["對象", "パンを食べます。", "パン を たべます。", "Pan o tabemasu."], ["也", "私も学生です。", "わたし も がくせい です。", "Watashi mo gakusei desu."]], "examples": [["これは私の本です。", "これ は わたし の ほん です。", "Kore wa watashi no hon desu.", "這是我的書。"], ["誰が来ますか。", "だれ が きます か。", "Dare ga kimasu ka.", "誰會來？"], ["水を飲みます。", "みず を のみます。", "Mizu o nomimasu.", "我喝水。"], ["私も日本語が好きです。", "わたし も にほんご が すき です。", "Watashi mo nihongo ga suki desu.", "我也喜歡日文。"]]}, {"name": "に・で・へ", "meaning": "時間地點、場所工具、方向", "rows": [["時間", "七時に起きます。", "しちじ に おきます。", "Shichiji ni okimasu."], ["去", "学校に行きます。", "がっこう に いきます。", "Gakkou ni ikimasu."], ["場所", "図書館で勉強します。", "としょかん で べんきょう します。", "Toshokan de benkyou shimasu."], ["方向", "日本へ行きます。", "にほん へ いきます。", "Nihon e ikimasu."]], "examples": [["六時に起きます。", "ろくじ に おきます。", "Rokuji ni okimasu.", "我六點起床。"], ["バスで学校へ行きます。", "バス で がっこう へ いきます。", "Basu de gakkou e ikimasu.", "我搭公車去學校。"], ["図書館で本を読みます。", "としょかん で ほん を よみます。", "Toshokan de hon o yomimasu.", "我在圖書館看書。"], ["友達と駅へ行きます。", "ともだち と えき へ いきます。", "Tomodachi to eki e ikimasu.", "我和朋友去車站。"]]}, {"name": "と・から・まで・の", "meaning": "一起、從、到、的", "rows": [["一起", "友達と話します。", "ともだち と はなします。", "Tomodachi to hanashimasu."], ["從……到", "九時から五時までです。", "くじ から ごじ まで です。", "Kuji kara goji made desu."], ["的", "私の本です。", "わたし の ほん です。", "Watashi no hon desu."], ["從", "家から学校まで歩きます。", "いえ から がっこう まで あるきます。", "Ie kara gakkou made arukimasu."]], "examples": [["兄と映画を見ます。", "あに と えいが を みます。", "Ani to eiga o mimasu.", "我和哥哥看電影。"], ["授業は九時からです。", "じゅぎょう は くじ から です。", "Jugyou wa kuji kara desu.", "課從九點開始。"], ["これは母の傘です。", "これ は はは の かさ です。", "Kore wa haha no kasa desu.", "這是媽媽的傘。"], ["家から駅まで十分です。", "いえ から えき まで じゅっぷん です。", "Ie kara eki made juppun desu.", "從家到車站要十分鐘。"]]}]}</script>
<script>
const lesson = JSON.parse(document.getElementById('lesson').textContent);
const esc = s => s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
document.querySelector('#content').innerHTML = lesson.groups.map(function (g) {
  var head = lesson.cols.map(function (col) { return '<th scope="col">' + esc(col) + '</th>'; }).join('');
  var rows = g.rows.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td lang="ja">' + esc(r[1]) + '</td><td lang="ja">' + esc(r[2]) + '</td><td>' + esc(r[3]) + '</td></tr>'; }).join('');
  var examples = g.examples.map(function (item) {
    return '<div class="example"><div><div class="kanji" lang="ja">' + esc(item[0]) + '</div><div class="kana" lang="ja">' + esc(item[1]) + '</div><div class="roma">' + esc(item[2]) + '</div><div class="zh">' + esc(item[3]) + '</div></div><button class="speak" type="button" data-say="' + esc(item[0]) + '" aria-label="播放日語：' + esc(item[0]) + '">▶ 播放</button></div>';
  }).join('');
  return '<section class="card"><div class="cardhead"><h2 lang="ja">' + esc(g.name) + '</h2><span class="meaning">' + esc(g.meaning) + '</span></div><div class="tablewrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + rows + '</tbody></table></div><div class="examples"><h3>例句與翻譯</h3>' + examples + '</div></section>';
}).join('');
function speak(text) {
  if (!('speechSynthesis' in window)) { alert('此瀏覽器不支援語音播放。'); return; }
  let started = false;
  const run = () => {
    if (started) return;
    started = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.82;
    const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  };
  if (speechSynthesis.getVoices().length) run();
  else {
    speechSynthesis.addEventListener('voiceschanged', run, { once: true });
    setTimeout(run, 300);
  }
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
document.addEventListener('click', e => {
  const b = e.target.closest('.speak');
  if (b) speak(b.dataset.say);
});
</script>
